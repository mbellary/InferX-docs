<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Accept useful service, then charge the deployment horizon</title><desc id="desc">Teaching fixtures and proposed gates; no measured generator performance</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Accept useful service, then charge the deployment horizon</text><text x="30" y="76" class="sub">Teaching fixtures and proposed gates; no measured generator performance</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Correctness and useful output</text><text x="48" y="168" class="body">Preserve IDs, stopping, draws and KV state</text><text x="48" y="195" class="body">Count success / failure / cancel / unresolved</text><text x="48" y="222" class="body">900 accepted IDs / 10 s = 90 tokens/s</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="538" y="137" class="head">Mean gains can hide worse tails</text><text x="538" y="168" class="body">Baseline mean 101 ms; sample p99 100 ms</text><text x="538" y="195" class="body">Candidate mean 94.2 ms; p99 300 ms</text><text x="538" y="222" class="body">Report quantile convention and uncertainty</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="48" y="312" class="head">Four proposed confirmatory claims</text><text x="48" y="343" class="body">20 independent paired sessions</text><text x="48" y="370" class="body">Useful-rate lower bound ≥ 1.05</text><text x="48" y="397" class="body">Three latency upper bounds ≤ 1.02</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Setup can erase the warm gain</text><text x="538" y="343" class="body">Setup 2,000 ms; warm saving 10 ms/request</text><text x="538" y="370" class="body">N = 200 ties; N &gt; 200 wins serially</text><text x="538" y="397" class="body">Recovery and invalidation also cost time</text><text x="30" y="465" class="body">The formal tail response is a median session-ratio claim, not pooled population p99.</text><text x="30" y="492" class="body">Preserve all outcomes; a failed correctness gate cannot be offset by a speedup.</text></svg>