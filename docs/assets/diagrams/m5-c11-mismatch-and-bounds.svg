<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Use compatible boundaries for occupancy and resources</title><desc id="desc">Independent prompt, selected-output and KV reservation references</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Use compatible boundaries for occupancy and resources</text><text x="30" y="76" class="sub">Independent prompt, selected-output and KV reservation references</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Prompt lengths: 2,8,4</text><text x="48" y="168" class="body">14 useful positions; 24 padded rectangle</text><text x="48" y="195" class="body">10 padding positions; occupancy 58.3%</text><text x="48" y="222" class="body">This is not a GPU utilization counter</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Output lengths: 2,4,1</text><text x="538" y="168" class="body">Seven useful IDs in 12 output positions</text><text x="538" y="195" class="body">First ID comes from prefill for each row</text><text x="538" y="222" class="body">Decode only: four useful positions in nine</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Logical KV reservation: 21 positions</text><text x="48" y="343" class="body">64 KiB × sum(prompt + cap) = 1.3125 MiB</text><text x="48" y="370" class="body">A uniform 3 × 12 rectangle is 2.25 MiB</text><text x="48" y="397" class="body">Other pools, padding and metadata add cost</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Amortization differs from response</text><text x="538" y="343" class="body">Separate all-ready one-ID toy workload</text><text x="538" y="370" class="body">Three serial 2-ms jobs: 500 requests/s</text><text x="538" y="397" class="body">One 3-ms batch: 1,000/s; response 3 ms</text><text x="30" y="465" class="body">Amortized service is 1 ms per request in the batched toy, not a 1-ms response.</text><text x="30" y="492" class="body">Counts and stipulated times establish neither physical allocation nor serving capacity.</text></svg>