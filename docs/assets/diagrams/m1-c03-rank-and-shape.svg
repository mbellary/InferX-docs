<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-labelledby="title desc"><title id="title">Ranks and labelled shapes</title><desc id="desc">A scalar value, a four-element vector, a three by four matrix, and two request panels forming a two by three by four tensor.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="580" fill="white"/><text x="440" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172b4d">From one value to three labelled axes</text><text x="190" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">Scalar: rank 0, shape ()</text><rect x="140" y="95" width="100" height="60" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="190.0" y="131.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">7</text><text x="190" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">One value; no axes</text><text x="630" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">Vector: rank 1, shape (4)</text><rect x="506" y="105" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="537.0" y="131.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">7</text><rect x="568" y="105" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="599.0" y="131.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">8</text><rect x="630" y="105" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="661.0" y="131.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">9</text><rect x="692" y="105" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="723.0" y="131.0" text-anchor="middle" font-family="Arial, sans-serif"