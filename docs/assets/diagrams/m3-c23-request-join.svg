<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc"><title id="title">Request dependency join and conditional improvements</title><desc id="desc">Overlapping GPU and host branches join before validation; a faster off-path kernel need not change publication.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="680" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Publication waits for both required branches</text><text x="30" y="76" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Constructed microseconds on one compatible axis; widths show the stated durations</text><text x="175" y="111" fill="#172b42" font-family="Arial, sans-serif" font-size="17">0</text><path d="M180 120 V380" stroke="#cbd5e1" stroke-width="1"/><text x="335" y="111" fill="#172b42" font-family="Arial, sans-serif" font-size="17">20</text><path d="M340 120 V380" stroke="#cbd5e1" stroke-width="1"/><text x="495" y="111" fill="#172b42" font-family="Arial, sans-serif" font-size="17">40</text><path d="M500 120 V380" stroke="#cbd5e1" stroke-width="1"/><text x="655" y="111" fill="#172b42" font-family="Arial, sans-serif" font-size="17">60</text><path d="M660 120 V380" stroke="#cbd5e1" stroke-width="1"/><text x="815" y="111" fill="#172b42" font-family="Arial, sans-serif" font-size="17">80</text><path d="M820 120 V380" stroke="#cbd5e1" stroke-width="1"/><text x="895" y="111" fill="#172b42" font-family="Arial, sans-serif" font-size="17">90</text><path d="M900 120 V380" stroke="#cbd5e1" stroke-width="1"/><text x="30" y="154" fill="#172b42" font-family="Arial, sans-serif" font-size="19" font-weight="700">Initial path</text><rect x="180" y="127" width="160" height="44" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="190" y="155" fill="#172b42" font-family="Arial, sans-serif" font-size="19">0 → 20 µs</text><text x="30" y="215" fill="#172b42" font-family="Arial, sans-serif" font-size="19" font-weight="700">GPU projection</text><rect x="340" y="183" width="320" height="48" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="360" y="213" fill="#172b42" font-family="Arial, sans-serif" font-size="19">20 → 60: 40 µs</text><text x="30" y="284" fill="#172b42" font-family="Arial, sans-serif" font-size="19" font-weight="700">Host metadata</text><rect x="340" y="252" width="480" height="48" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="360" y="282" fill="#172b42" font-family="Arial, sans-serif" font-size="19">20 → 80: 60 µs</text><text x="30" y="353" fill="#172b42" font-family="Arial, sans-serif" font-size="18" font-weight="700">Validate / publish</text><rect x="820" y="321" width="80" height="48" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="830" y="352" fill="#172b42" font-family="Arial, sans-serif" font-size="18">10 µs</text><path d="M660 231 L820 321" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M820 300 L820 321" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="415" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Join = max(60, 80) = 80 µs. Publication finishes at 90 µs.</text><text x="40" y="459" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">Conditional intervention</text><text x="680" y="459" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">Publication</text><text x="45" y="498" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Original overlap policy</text><text x="690" y="498" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">90 µs</text><text x="45" y="535" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Halve GPU duration only</text><text x="690" y="535" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">90 µs</text><text x="45" y="572" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Halve metadata duration only</text><text x="690" y="572" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">70 µs</text><text x="45" y="609" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Halve both durations</text><text x="690" y="609" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">60 µs</text><text x="40" y="649" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Serializing metadata after GPU instead would finish at 130 µs; no hardware result is asserted.</text></svg>