<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="630" viewBox="0 0 1060 630" role="img" aria-labelledby="title desc"><title id="title">Combining heads and output projection</title><desc id="desc">Two heads with two query positions are combined by position into four-feature rows, then projected to two output features. Direct flattening of head-major storage confuses the two positions.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="630" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#0f172a">Head layout preserves query-position identity</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Output example: two heads • two positions • two value features per head</text><rect x="30" y="120" width="290" height="230" rx="9" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="157" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">O: (1, 2, 2, 2)</text><text x="50" y="205" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Head 0: [1, 2], [3, 4]</text><text x="50" y="251" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Head 1:</text><text x="50" y="293" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[10, 20], [30, 40]</text><path d="M330,235 L390,235" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="400" y="120" width="300" height="230" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="420" y="157" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Z: (1, 2, 4)</text><text x="420" y="205" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Position 0:</text><text x="420" y="244" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">[1, 2, 10, 20]</text><text x="420" y="283" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Position 1:</text><text x="420" y="322" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">[3, 4, 30, 40]</text><path d="M710,235 L765,235" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="775" y="120" width="255" height="230" rx="9" fill="#fef3c7" stroke="#64748b"/><text x="795" y="157" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Y = ZW_O</text><text x="795" y="205" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">W_O: (4, 2)</text><text x="795" y="251" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Position 0: [−9, 52]</text><text x="795" y="299" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Position 1: [−7, 114]</text><rect x="30" y="395" width="1000" height="105" rx="9" fill="#fee2e2" stroke="#64748b"/><text x="50" y="435" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Wrong: flatten head-major storage directly into position rows.</text><text x="50" y="474" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">[1, 2, 3, 4] and [10, 20, 30, 40] have the right size but the wrong association.</text><text x="30" y="550" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Combine head features per position; never concatenate requests or token positions.</text><text x="30" y="592" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">The output projection mixes those features using weights tied to their declared order.</text></svg>