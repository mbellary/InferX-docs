<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Sampling fusion: payload saved, resource limits retained</title><desc id="desc">Stipulated FP32 logical payload; real passes and state traffic must be added</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Sampling fusion: payload saved, resource limits retained</text><text x="30" y="76" class="sub">Stipulated FP32 logical payload; real passes and state traffic must be added</text><rect x="30" y="110" width="450" height="155" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="142" class="head">Four-stage baseline</text><text x="48" y="173" class="body">Transform → select → normalize → draw</text><text x="48" y="200" class="body">Three full-row read/write stages</text><text x="48" y="227" class="body">Final probability read + ID write</text><text x="48" y="254" class="body">Payload = 28RV + 4R bytes</text><rect x="520" y="110" width="450" height="155" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="142" class="head">Conditional local-state ideal</text><text x="538" y="173" class="body">One logits read → one selected ID write</text><text x="538" y="200" class="body">All intermediate state stays local</text><text x="538" y="227" class="body">Requires sufficient resources and ordering</text><text x="538" y="254" class="body">Payload = 4RV + 4R bytes</text><rect x="30" y="295" width="450" height="130" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="327" class="head">R = 8; V = 32,768</text><text x="48" y="358" class="body">Baseline: 7 MiB + 32 bytes</text><text x="48" y="385" class="body">Ideal: 1 MiB + 32 bytes</text><text x="48" y="412" class="body">Avoided intermediate payload: 6 MiB</text><rect x="520" y="295" width="450" height="130" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="327" class="head">Profile the crossover</text><text x="538" y="358" class="body">Candidates / ranking / refinement passes</text><text x="538" y="385" class="body">Registers, shared memory and spills</text><text x="538" y="412" class="body">Completed row and useful service latency</text><text x="30" y="465" class="body">The ideal is not a claim that a full vocabulary and ranking state fit locally.</text><text x="30" y="492" class="body">A fixed top-p candidate cap needs completeness proof or an explicit approximation.</text></svg>