<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Two-dimensional coordinate ownership and masking</title><desc id="desc">A four-by-eight covered rectangle contains a three-by-five logical tensor with fifteen valid and seventeen masked positions.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">R = 3, C = 5: valid coordinates are not the whole launch</text><text x="30" y="78" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Teaching block 4 × 2; grid 2 × 2; x varies fastest inside each block</text><text x="73" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c0</text><text x="143" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c1</text><text x="213" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c2</text><text x="283" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c3</text><text x="353" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c4</text><text x="423" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c5</text><text x="493" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c6</text><text x="563" y="113" fill="#172b42" font-family="Arial, sans-serif" font-size="17">c7</text><text x="10" y="162" fill="#172b42" font-family="Arial, sans-serif" font-size="17">r0</text><rect x="45" y="130" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="56" y="169" fill="#172b42" font-family="Arial, sans-serif" font-size="18">0,0</text><rect x="115" y="130" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="126" y="169" fill="#172b42" fon