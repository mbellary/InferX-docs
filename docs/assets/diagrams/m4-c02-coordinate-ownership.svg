 stroke="#8293a8"/><text x="336" y="239" fill="#172b42" font-family="Arial, sans-serif" font-size="18">1,4</text><rect x="395" y="200" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="406" y="239" fill="#172b42" font-family="Arial, sans-serif" font-size="18">1,5</text><rect x="465" y="200" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="476" y="239" fill="#172b42" font-family="Arial, sans-serif" font-size="18">1,6</text><rect x="535" y="200" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="546" y="239" fill="#172b42" font-family="Arial, sans-serif" font-size="18">1,7</text><text x="10" y="302" fill="#172b42" font-family="Arial, sans-serif" font-size="17">r2</text><rect x="45" y="270" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="56" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,0</text><rect x="115" y="270" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="126" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,1</text><rect x="185" y="270" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="196" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,2</text><rect x="255" y="270" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="266" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,3</text><rect x="325" y="270" width="66" height="65" rx="8" fill="#a7f3d0" stroke="#8293a8"/><text x="336" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,4</text><rect x="395" y="270" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="406" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,5</text><rect x="465" y="270" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="476" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,6</text><rect x="535" y="270" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="546" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="18">2,7</text><text x="10" y="372" fill="#172b42" font-family="Arial, sans-serif" font-size="17">r3</text><rect x="45" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="56" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,0</text><rect x="115" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="126" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,1</text><rect x="185" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="196" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,2</text><rect x="255" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="266" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,3</text><rect x="325" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="336" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,4</text><rect x="395" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="406" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,5</text><rect x="465" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="476" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,6</text><rect x="535" y="340" width="66" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="546" y="379" fill="#172b42" font-family="Arial, sans-serif" font-size="18">3,7</text><path d="M322 125 V410 M40 268 H607" stroke="#334155" stroke-width="3" stroke-dasharray="6 5"/><rect x="650" y="130" width="350" height="275" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="670" y="169" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">32 configured positions</text><text x="670" y="212" fill="#172b42" font-family="Arial, sans-serif" font-size="21">15 valid output owners</text><text x="670" y="252" fill="#172b42" font-family="Arial, sans-serif" font-size="21">17 data-masked positions</text><text x="670" y="298" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Correct: r &lt; 3 AND c &lt; 5</text><text x="670" y="345" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Dashed lines divide blocks.</text><text x="670" y="382" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Color describes data validity.</text><text x="40" y="455" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Wrong shortcut: rC + c &lt; RC accepts (r = 0, c = 5).</text><text x="40" y="499" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Its flattened value 5 collides with valid coordinate (1, 0).</text><text x="40" y="542" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Mask both axes before memory access; every valid output must have one owner.</text><text x="40" y="588" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Geometric coverage is not hardware occupancy or measured instruction efficiency.</text></svg>