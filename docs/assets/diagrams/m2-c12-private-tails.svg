<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Shared partial tail and divergent private continuations</title><desc id="desc">A and B initially map slots zero and two at six valid positions. A copies two tail rows into slot one and appends A position six. B copies the same two old rows into slot three and appends a distinct B row. Slot zero remains shared and slot two waits for safe return.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Divergent writes need private tails</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">B = 4; N = 6 before branching; k = 128 bytes/position</text><rect x="30" y="120" width="1000" height="105" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="160" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Initially: A table [0,2]; B table [0,2]</text><text x="50" y="201" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Slot 0: positions 0–3. Slot 2: positions 4–5, two unused rows.</text><rect x="30" y="270" width="485" height="190" rx="10" fill="#dcfce7" stroke="#64748b"/><rect x="545" y="270" width="485" height="190" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="310" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">A → table [0,1]; N = 7</text><text x="50" y="353" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Slot 1: copy positions 4–5</text><text x="50" y="393" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Then write A’s position 6</text><text x="50" y="433" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Row 3 stays invalid</text><text x="565" y="310" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">B → table [0,3]; N = 7</text><text x="565" y="353" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Slot 3: copy positions 4–5</text><text x="565" y="393" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Then write B’s position 6</text><text x="565" y="433" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Row 3 stays invalid</text><rect x="30" y="505" width="1000" height="105" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="546" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Slot 0 stays shared and immutable.</text><text x="50" y="587" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Old slot 2 returns only after owners and all pins are gone.</text><text x="30" y="655" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Each partial-tail copy: 2 × 128 = 256 old payload bytes.</text><text x="30" y="695" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">All publication waits for required copy and append completion.</text></svg>