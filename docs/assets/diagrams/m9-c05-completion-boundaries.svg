<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="715" viewBox="0 0 1060 715" role="img" aria-labelledby="title desc"><title id="title">Content versus terminal completion</title><desc id="desc">A constructed client submits at 100 milliseconds, observes IDs at 140 160 180 and 200, and parses successful terminal status at 215. Content latency is 100 milliseconds and terminal latency 115.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="715" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Content complete is not always protocol complete</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Constructed client trace; one monotonic clock, times in milliseconds</text><rect x="30" y="120" width="1000" height="150" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="158" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Submission: 100 ms → first ID: 140 ms → last ID: 200 ms</text><text x="50" y="202" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">ID availability times: 140, 160, 180, 200 ms</text><text x="50" y="245" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">First-content latency: 40 ms; subsequent content delivery: 60 ms</text><rect x="30" y="310" width="1000" height="125" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="350" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Last content at 200 ms → successful terminal parsed at 215 ms</text><text x="50" y="397" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Terminal tail: 15 ms; no additional output IDs in this interval</text><rect x="30" y="475" width="1000" height="145" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="515" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Content latency: 200 − 100 = 100 ms</text><text x="50" y="560" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Terminal latency: 215 − 100 = 115 ms</text><text x="50" y="599" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Decomposition: 40 + 3 × 20 + 15 = 115 ms</text><text x="30" y="675" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Missing terminal status leaves success unresolved; closure alone is insufficient.</text></svg>