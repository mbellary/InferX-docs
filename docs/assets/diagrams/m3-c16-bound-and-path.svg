<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Resource bounds and serial paths</title><desc id="desc">Constructed compute and transfer times give a maximum lower bound of 0.12288 microseconds. A strictly preceding five microsecond stage raises the serial path lower bound to 5.12288 microseconds. A separate ten millisecond request becomes 9.5 milliseconds when its one millisecond kernel is halved.</desc><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">A resource envelope does not replace a dependency path</text><text x="30" y="80" font-size="19">Constructed 64³ GEMM; capacities and delays are hypothetical</text><rect x="30" y="120" width="320" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="42" y="149" font-size="19">Compute demand / capacity</text><text x="42" y="177" font-size="17">0.065536 µs</text><rect x="390" y="120" width="320" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="402" y="149" font-size="19">Logical bytes / bandwidth</text><text x="402" y="177" font-size="17">0.12288 µs</text><rect x="750" y="120" width="320" height="100" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="762" y="149" font-size="19">Resource time lower bound</text><text x="762" y="177" font-size="17">max(...) = 0.12288 µs</text><text x="30" y="267" font-size="19">Inside the operation: allow ideal resource overlap when taking the maximum.</text><rect x="30" y="310" width="320" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="339" font-size="19">Strictly preceding stage</text><text x="42" y="367" font-size="17">5 µs; no overlap assumed</text><rect x="430" y="310" width="320" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="442" y="339" font-size="19">Operation lower bound</text><text x="442" y="367" font-size="17">0.12288 µs</text><path d="M355 360 L423 360" stroke="#526d82" stroke-width="3"/><path d="M411 352 L423 360 L411 368" stroke="#526d82" stroke-width="3" fill="none"/><text x="795" y="349" font-size="18">Serial path lower bound:</text><text x="795" y="383" font-size="23">5.12288 µs</text><text x="30" y="464" font-size="19">Add only demonstrated serial stages. Queueing and other costs can add delay.</text><text x="30" y="509" font-size="19">Different example: 9 ms other + 1 ms kernel → 9 + 0.5 = 9.5 ms request.</text><text x="30" y="549" font-size="19">Local 2× speedup becomes 10 / 9.5 ≈ 1.0526× for that serial request.</text></g></svg>