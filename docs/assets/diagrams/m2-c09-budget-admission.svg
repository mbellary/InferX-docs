<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="695" viewBox="0 0 1060 695" role="img" aria-labelledby="title desc"><title id="title">Block size and fixed budget admission</title><desc id="desc">With 4096 payload bytes, sizes two four and eight have sixteen eight and four slots. The first two admit all four offered requests, while size eight rejects length nine after admitting the first three. Metadata is separately budgeted.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="695" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">One payload budget; different admission outcomes</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">M = 4,096 bytes; offer lengths 1 → 4 → 5 → 9 and hold accepted state</text><rect x="30" y="120" width="1000" height="130" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="157" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">B = 2; P = 16 slots → 4 admitted / 0 rejected</text><text x="50" y="199" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">5 free slots = 1,280 bytes</text><text x="50" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">11 assigned blocks; 19 valid positions; 384 tail bytes</text><rect x="30" y="280" width="1000" height="130" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="317" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">B = 4; P = 8 slots → 4 admitted / 0 rejected</text><text x="50" y="359" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">1 free slot = 512 bytes</text><text x="50" y="392" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">7 assigned blocks; 19 valid positions; 1,152 tail bytes</text><rect x="30" y="440" width="1000" height="130" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="477" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">B = 8; P = 4 slots → 3 admitted / 1 rejected</text><text x="50" y="519" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">1 free slot = 1,024 bytes</text><text x="50" y="552" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Last request needs 2 slots; partial assignment is forbidden</text><text x="30" y="613" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Metadata has a separate available budget; no sharing or retiring slots.</text><text x="30" y="655" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">A shorter run with fewer admissions is not an equivalent-work speedup.</text></svg>