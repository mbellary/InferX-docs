<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="710" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc"><title id="title">Two by four suffix attention mask aligned to absolute positions</title><desc id="desc">Query at absolute position two may attend keys zero one two but not three. Query at three may attend all four valid keys. A dashed line separates old and new keys. The condition is key index less than or equal to old length plus local query row. This is not the top left local triangular mask.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="710" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Cached suffix causality uses absolute positions</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Old positions n = 2; new rows r = 2; keys include the new suffix.</text><text x="270" y="145" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Old keys</text><text x="665" y="145" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">New keys</text><text x="270" y="190" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Key 0</text><text x="455" y="190" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Key 1</text><text x="640" y="190" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Key 2</text><text x="825" y="190" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Key 3</text><text x="30" y="272" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Query 2</text><rect x="230" y="220" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="260" y="266" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><rect x="415" y="220" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="445" y="266" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><rect x="600" y="220" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="630" y="266" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><rect x="785" y="220" width="165" height="75" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="815" y="266" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Block</text><text x="30" y="372" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Query 3</text><rect x="230" y="320" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="260" y="366" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><rect x="415" y="320" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="445" y="366" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><rect x="600" y="320" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="630" y="366" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><rect x="785" y="320" width="165" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="815" y="366" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Allow</text><path d="M590,165 L590,410" stroke="#475569" stroke-width="2" stroke-dasharray="7 7"/><rect x="30" y="445" width="1000" height="105" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="484" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Eligibility: key j ≤ n + local query row i</text><text x="50" y="524" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">One new row at n = 2 may use keys 0, 1 and 2, including itself.</text><rect x="30" y="580" width="1000" height="100" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="619" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">A top-left triangle resets time and hides valid past keys.</text><text x="50" y="659" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Unused capacity is never valid context. Later suffix keys stay masked.</text></svg>