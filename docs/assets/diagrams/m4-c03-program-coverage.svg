<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Triton program coverage</title><desc id="desc">Two eight-position programs cover ten valid elements and six masked positions.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="35" y="45" fill="#172b42" font-family="Arial, sans-serif" font-size="26" font-weight="700">N = 10; logical width B = 8; grid G = 2</text><text x="35" y="92" fill="#172b42" font-family="Arial, sans-serif" font-size="21">A logical position is not a promise of one hardware thread.</text><text x="35" y="150" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Program 0</text><rect x="35" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="55" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 0</text><text x="49" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="155" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="175" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 1</text><text x="169" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="275" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="295" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 2</text><text x="289" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="395" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="415" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 3</text><text x="409" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="515" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="535" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 4</text><text x="529" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="635" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="655" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 5</text><text x="649" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="755" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="775" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 6</text><text x="769" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="875" y="175" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="895" y="209" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 7</text><text x="889" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><text x="35" y="300" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Program 1</text><rect x="35" y="325" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="55" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 8</text><text x="49" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="155" y="325" width="110" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="175" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 9</text><text x="169" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">valid</text><rect x="275" y="325" width="110" height="80" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="295" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 10</text><text x="289" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">masked</text><rect x="395" y="325" width="110" height="80" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="415" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 11</text><text x="409" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">masked</text><rect x="515" y="325" width="110" height="80" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="535" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 12</text><text x="529" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">masked</text><rect x="635" y="325" width="110" height="80" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="655" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 13</text><text x="649" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">masked</text><rect x="755" y="325" width="110" height="80" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="775" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 14</text><text x="769" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">masked</text><rect x="875" y="325" width="110" height="80" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="895" y="359" fill="#172b42" font-family="Arial, sans-serif" font-size="19">i = 15</text><text x="889" y="387" fill="#172b42" font-family="Arial, sans-serif" font-size="18">masked</text><text x="35" y="495" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Valid positions 0–9: one output owner each.</text><text x="35" y="540" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Positions 10–15: no loads or stores; explicit fallback for arithmetic.</text><text x="35" y="585" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Coverage = 10 / 16 = 62.5%; hardware utilization requires measurement.</text></svg>