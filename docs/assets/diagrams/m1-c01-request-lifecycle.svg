<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="title desc"><title id="title">Single-request lifecycle</title><desc id="desc">Prompt processing supplies the first scores. Continuing selects, appends and consumes tokens. Terminal paths wait before safe reclamation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="860" height="470" fill="#fff"/><text x="430" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">One text request: computation and lifecycle</text><rect x="25" y="65" width="235" height="80" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="142.5" y="98.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Arrival / admission</text><text x="142.5" y="123.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Validate and prepare</text><rect x="315" y="65" width="235" height="80" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="432.5" y="98.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Process prompt</text><text x="432.5" y="123.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">First next-token scores</text><rect x="605" y="65" width="230" height="80" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="720.0" y="98.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Select next token</text><text x="720.0" y="123.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Check stopping rules</text><path d="M260 105 H315" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 105 H605" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="315" y="240" width="235" height="85" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="432.5" y="276.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Consume selected token</text><text x="432.5" y="301.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Next scores; reuse KV</text><rect x="605" y="240" width="230" height="85" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="720.0" y="276.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Append / deliver</text><text x="720.0" y="301.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">per output policy</text><path d="M720 145 V240" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><text x="775" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">continue</text><path d="M605 282 H550" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 282 H575 V195 H585 V105 H605" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="240" width="235" height="85" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="142.5" y="263.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Finalize output</text><text x="142.5" y="288.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Terminal outcome</text><text x="142.5" y="313.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Wait; safely reclaim</text><path d="M720 65 V48 H285 V220 H143 V240" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><text x="150" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">EOS / cap / failure</text><text x="430" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Fixed model weights are used for prompt and later computation.</text><text x="430" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Request IDs, output buffers and retained state belong to this request.</text><text x="430" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">Cancellation ends delivery obligations; in-flight work still needs completion.</text></svg>