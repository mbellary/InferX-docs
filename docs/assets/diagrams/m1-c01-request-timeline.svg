<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="title desc"><title id="title">Invented service timing example</title><desc id="desc">Arrival zero, admission two, preparation three, first selection eleven, first visible delivery twelve, terminal delivery twenty-two milliseconds.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="860" height="390" fill="#fff"/><text x="430" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172b4d">Illustrative timeline — invented values, one host clock</text><text x="430" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">Elapsed milliseconds; stage widths are schematic</text><path d="M30 155 H830" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="30" y1="145" x2="30" y2="165" stroke="#496a92" stroke-width="2"/><text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0 ms</text><text x="30" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">Arrival</text><line x1="190" y1="145" x2="190" y2="165" stroke="#496a92" stroke-width="2"/><text x="190" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2 ms</text><text x="190" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">Admission</text><line x1="350" y1="145" x2="350" y2="165" stroke="#496a92" stroke-width="2"/><text x="350" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">3 ms</text><text x="350" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">Prepared</text><line x1="510" y1="145" x2="510" y2="165" stroke="#496a92" stroke-width="2"/><text x="510" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">11 ms</text><text x="510" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">Selected</text><line x1="670" y1="145" x2="670" y2="165" stroke="#496a92" stroke-width="2"/><text x="670" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">12 ms</text><text x="670" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">Delivered</text><line x1="830" y1="145" x2="830" y2="165" stroke="#496a92" stroke-width="2"/><text x="830" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">22 ms</text><text x="830" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172b4d">Terminal</text><rect x="30" y="180" width="152" height="52" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="106.0" y="212.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Queue: 2 ms</text><rect x="190" y="180" width="152" height="52" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="266.0" y="212.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Prepare: 1 ms</text><rect x="350" y="180" width="152" height="52" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="426.0" y="212.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Prefill: 8 ms</text><rect x="510" y="180" width="152" height="52" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="586.0" y="212.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Output: 1 ms</text><text x="430" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">Service TTFT = first visible delivery − arrival = 12 ms</text><text x="430" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">Service request latency = terminal delivery − arrival = 22 ms</text><text x="430" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">Later decode, selection and output occupy the remaining request path.</text></svg>