<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" role="img" aria-labelledby="title desc"><title id="title">Greedy and ordered sampling paths from logits to a selected token ID</title><desc id="desc">Finite identified logits branch into greedy maximum with lowest-ID ties and no draw, or temperature then top-k normalization top-p normalization and a request-owned uniform mapped by an ascending-ID CDF. Both return the chosen vocabulary ID with request identity; sampling commits state advancement.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="740" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">One logit row, two explicitly different selection contracts</text><rect x="30" y="85" width="1000" height="85" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="122" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Finite logits + request/model/policy identity</text><text x="50" y="153" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Columns remain tied to vocabulary IDs throughout selection.</text><rect x="30" y="225" width="350" height="130" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="263" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Greedy</text><text x="50" y="302" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Greatest score; lowest tied ID</text><text x="50" y="335" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">No softmax or random draw</text><path d="M200,180 L200,215" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="225" width="600" height="80" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="450" y="261" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Temperature T &gt; 0</text><text x="450" y="290" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Scale scores; normalize probabilities.</text><path d="M735,180 L735,215" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="345" width="600" height="80" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="450" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Top-k → renormalize → top-p → renormalize</text><text x="450" y="410" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Exact support, order, ties and crossing rule are fixed.</text><path d="M735,315 L735,335" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="465" width="600" height="90" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="450" y="500" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">One request-owned uniform u in [0, 1)</text><text x="450" y="535" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Ascending-ID CDF; first cumulative mass &gt; u.</text><path d="M735,435 L735,455" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="600" width="1000" height="65" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="641" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Selected vocabulary ID + request identity + committed stream advancement</text><path d="M200,365 L200,590" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M735,565 L735,590" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="708" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Changing policy is not equivalent optimization; appending/stopping belongs to M1-C16.</text></svg>