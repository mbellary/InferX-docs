<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="title desc"><title id="title">Text preparation contract</title><desc id="desc">Messages become rendered text then prepared IDs through fixed artifacts and options. Request buffers and shared resources have different lifetimes.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="540" fill="white"/><text x="440" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">Prepare IDs under one explicit transformation contract</text><rect x="25" y="65" width="230" height="90" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="140.0" y="103.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Messages</text><text x="140.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Roles + exact content</text><rect x="325" y="65" width="230" height="90" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="440.0" y="103.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Chat template</text><text x="440.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Roles + boundary rules</text><rect x="625" y="65" width="230" height="90" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="740.0" y="103.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Rendered text</text><text x="740.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Exact UTF-8 bytes</text><path d="M255 110 H325" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M555 110 H625" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 155 V225" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><rect x="625" y="225" width="230" height="100" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="740.0" y="256.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Tokenizer</text><text x="740.0" y="281.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Declared transforms</text><text x="740.0" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Fixed vocabulary</text><rect x="325" y="225" width="230" height="100" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="440.0" y="268.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Prepared IDs</text><text x="440.0" y="293.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Length + mask + identity</text><rect x="25" y="225" width="230" height="100" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="140.0" y="268.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Executor handoff</text><text x="140.0" y="293.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Preserve ID order</text><path d="M625 275 H555" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M325 275 H255" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><text x="440" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Direct template-to-IDs may avoid exposing intermediate text.</text><rect x="25" y="395" width="380" height="75" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="215.0" y="426.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Share read-only resources</text><text x="215.0" y="451.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Pin artifacts, template and options</text><rect x="455" y="395" width="400" height="75" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="655.0" y="426.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Own request state separately</text><text x="655.0" y="451.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Keep buffers valid until consumed</text><text x="440" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Decode for display separately; never reconstruct model IDs from cleaned text.</text></svg>