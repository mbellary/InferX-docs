<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Online softmax common-scale merge</title><desc id="desc">Two disjoint summaries use scale factors one half and one to produce normalizer seven fourths, numerator three halves and two, and weighted output six sevenths and eight sevenths.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="42" fill="#172b42" font-family="Arial, sans-serif" font-size="26" font-weight="700">Merge disjoint chunks at one common maximum</text><rect x="35" y="105" width="440" height="160" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="145" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Chunk A: first two members</text><text x="55" y="189" fill="#172b42" font-family="Arial, sans-serif" font-size="21">mA = ln(2); lA = 3/2</text><text x="55" y="231" fill="#172b42" font-family="Arial, sans-serif" font-size="21">uA = (1, 2); nA = 2</text><rect x="565" y="105" width="440" height="160" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="585" y="145" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Chunk B: final member</text><text x="585" y="189" fill="#172b42" font-family="Arial, sans-serif" font-size="21">mB = ln(4); lB = 1</text><text x="585" y="231" fill="#172b42" font-family="Arial, sans-serif" font-size="21">uB = (1, 1); nB = 1</text><path d="M250 267 L430 325" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M785 267 L610 325" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="140" y="302" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Scale A by 1/2</text><text x="820" y="302" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">Scale B by 1</text><rect x="35" y="330" width="970" height="175" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="55" y="369" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Common maximum m = ln(4)</text><text x="55" y="413" fill="#172b42" font-family="Arial, sans-serif" font-size="22">l = (1/2)(3/2) + 1 = 7/4</text><text x="55" y="455" fill="#172b42" font-family="Arial, sans-serif" font-size="22">u = (1/2)(1, 2) + (1, 1) = (3/2, 2); n = 3</text><text x="55" y="490" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Final weighted output u/l = (6/7, 8/7)</text><text x="35" y="560" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Rescale both l and u. A valid count does not replace normalization.</text><text x="35" y="602" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Fractions are ideal mathematical references, not rounded-ln hardware bit patterns.</text></svg>