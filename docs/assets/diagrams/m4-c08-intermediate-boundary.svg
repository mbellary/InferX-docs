<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Private intermediate and kernel fusion</title><desc id="desc">The split path writes and rereads intermediate A; the fused path retains it locally, unless the caller requires A as an output.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">A private intermediate can stay inside the fused unit</text><text x="35" y="90" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Split path: two ordered launches; public output is Z only</text><rect x="35" y="125" width="270" height="130" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="50" y="160" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Producer</text><text x="50" y="204" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Read X, Y</text><text x="50" y="236" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Compute A = 2X + Y</text><rect x="375" y="125" width="270" height="130" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="390" y="160" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Global A tensor</text><text x="390" y="204" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Write A, then read A</text><text x="390" y="236" fill="#172b42" font-family="Arial, sans-serif" font-size="19">8N intermediate bytes</text><rect x="715" y="125" width="290" height="130" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="730" y="160" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Consumer</text><text x="730" y="204" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Read R; apply ReLU</text><text x="730" y="236" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Emit Z = max(A,0) + R</text><path d="M307 190 L370 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M647 190 L710 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="35" y="300" fill="#172b42" font-family="Arial, sans-serif" font-size="22">Logical traffic: 24N bytes; live value payload: 20N bytes.</text><text x="35" y="360" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fused path: one launch; A is retained locally until its consumer</text><rect x="35" y="390" width="970" height="100" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="55" y="430" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Read X, Y, R → compute private A → emit Z</text><text x="55" y="470" fill="#172b42" font-family="Arial, sans-serif" font-size="21">No required global A write/read pair under this Z-only contract.</text><text x="35" y="535" fill="#172b42" font-family="Arial, sans-serif" font-size="22">Logical traffic: 16N bytes; live value payload: 16N bytes.</text><text x="35" y="577" fill="#172b42" font-family="Arial, sans-serif" font-size="20">If A is also a public output, its store remains: fused traffic becomes 20N bytes.</text><text x="35" y="611" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Logical counts exclude guards, allocator/runtime overhead, spills and cache effects.</text></svg>