<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" role="img" aria-labelledby="title desc"><title id="title">Eviction eligibility comes before victim ranking</title><desc id="desc">Six slots × 512 bytes = 3,072 backing payload bytes</desc><rect width="1060" height="740" fill="#f8fafc"/>
<text x="30" y="45" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#142033">Eviction eligibility comes before victim ranking</text>
<text x="30" y="86" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#142033">Six slots × 512 bytes = 3,072 backing payload bytes</text>
<rect x="30" y="115" width="1000" height="112" rx="12" fill="#dbeafe" stroke="#8492a6"/>
<text x="50" y="148" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Active: slot 0</text>
<text x="50" y="183" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Request edge remains, with a cache edge as well.</text>
<text x="50" y="212" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Removing retention cannot recover this active payload.</text>
<rect x="30" y="250" width="1000" height="112" rx="12" fill="#fef3c7" stroke="#8492a6"/>
<text x="50" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Retained-only: slots 1, 2 and 3</text>
<text x="50" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Slots 1 and 3 have no pins; slot 2 still has an admitted reader.</text>
<text x="50" y="347" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Immediate-recovery policy skips pinned slot 2, regardless of recency.</text>
<rect x="30" y="385" width="1000" height="112" rx="12" fill="#dcfce7" stroke="#8492a6"/>
<text x="50" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Retiring: slot 4; already free: slot 5</text>
<text x="50" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Slot 4 has no owners but still has an unresolved pin.</text>
<text x="50" y="482" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">A logical removal is not a completed pool return.</text>
<rect x="30" y="520" width="1000" height="112" rx="12" fill="#ede9fe" stroke="#8492a6"/>
<text x="50" y="553" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Target: three free slots; two new returns required</text>
<text x="50" y="588" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Evict eligible slots 1 and 3 → free capacity 3 × 512 = 1,536 bytes.</text>
<text x="50" y="617" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Slot 4 completion later adds one free slot; slot 2 remains retained.</text>
<text x="30" y="700" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Lookup/retain and eviction share one protected authority; stale IDs never authorize reuse.</text>
</svg>
