<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A ready host thread can still wait for CPU service</title><desc id="desc">Constructed single-clock microseconds • serial mutually exclusive host states</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">A ready host thread can still wait for CPU service</text><text x="30" y="76" class="sub">Constructed single-clock microseconds • serial mutually exclusive host states</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Before submission</text><text x="48" y="168" class="body">0–3: executing preparation</text><text x="48" y="195" class="body">3–8: runnable, waiting for CPU</text><text x="48" y="222" class="body">8–10: executing dispatch</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="538" y="137" class="head">After submission</text><text x="538" y="168" class="body">10–30: blocked on declared completion</text><text x="538" y="195" class="body">30–34: runnable, waiting for CPU</text><text x="538" y="222" class="body">34–36: executing reconciliation</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="48" y="312" class="head">Reconcile elapsed time</text><text x="48" y="343" class="body">CPU 7 + runnable 9 + blocked 20 = 36</text><text x="48" y="370" class="body">Completion ready 30 → published 36</text><text x="48" y="397" class="body">Final delay = 4 waiting + 2 execution</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Interpret the evidence</text><text x="538" y="343" class="body">Do not add overlapping device time again</text><text x="538" y="370" class="body">Switch counts do not establish delay cause</text><text x="538" y="397" class="body">Trace wakeup, scheduling and clock scopes</text><text x="30" y="465" class="body">Preparation 3 → 2 predicts 35 µs only when all other waits stay fixed.</text><text x="30" y="492" class="body">Final runnable wait 4 → 1 predicts 33 µs; real interventions may change other intervals.</text></svg>