<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="715" viewBox="0 0 1060 715" role="img" aria-labelledby="title desc"><title id="title">Zero owner retirement and outstanding pins</title><desc id="desc">Last strong owner releases at constructed time five milliseconds but two readers retain pins. Completions at eight and eleven remove the pins. Actual return at twelve gives seven milliseconds of zero owner retention and 3584 byte milliseconds area.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="715" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Zero strong owners does not imply safe reuse</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Constructed host times in ms; one shared block = 512 bytes</text><rect x="30" y="120" width="1000" height="105" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="159" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">5 ms: last strong owner releases</text><text x="50" y="202" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">n = 0; p = 2; close new use → Retiring</text><rect x="30" y="255" width="1000" height="105" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="294" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">8 ms: first reader completion covered</text><text x="50" y="337" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">n = 0; p = 1; still unavailable</text><rect x="30" y="390" width="1000" height="105" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="429" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">11 ms: final reader completion covered</text><text x="50" y="472" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">n = 0; p = 0; other safe-return gates hold</text><rect x="30" y="525" width="1000" height="105" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="564" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">12 ms: authority returns the slot once</text><text x="50" y="607" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Free; old handles reject; next assignment needs fresh identity</text><text x="30" y="673" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Zero-owner retention: 12 − 5 = 7 ms; area = 512 × 7 = 3,584 byte·ms</text></svg>