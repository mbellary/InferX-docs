<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="670" viewBox="0 0 1060 670" role="img" aria-labelledby="title desc"><title id="title">Weight version validation publication and reader ownership</title><desc id="desc">A candidate contains twenty named tensors and ninety FP64 values. Validate architecture and resident parameter identity together. Failure rejects the candidate and keeps the valid version. Success publishes a complete version pinned by each reader, and old versions survive until their readers finish.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="670" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Admit a complete weight version before publishing it</text><text x="30" y="81" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">A readable tensor file is one input to validation, not a complete model contract.</text><rect x="30" y="130" width="290" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="167" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Candidate bundle</text><text x="50" y="205" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">20 named tensors</text><text x="50" y="242" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">90 FP64 values</text><rect x="390" y="130" width="640" height="140" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="410" y="167" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Validate as one compatible model</text><text x="410" y="205" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Config + identities + shapes + dtype + finite values</text><text x="410" y="242" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Orientation + block order + reference logits</text><path d="M330,200 L380,200" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="390" y="350" width="640" height="110" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="410" y="388" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Publish one admitted version</text><text x="410" y="430" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Each request pins that version through its last use.</text><path d="M710,280 L710,340" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="30" y="350" width="290" height="110" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="50" y="389" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Reject candidate</text><text x="50" y="431" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Keep valid version</text><path d="M450,280 L450,305 L175,305 L175,340" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="30" y="535" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Old-version readers finish using old weights before those weights are reclaimed.</text><text x="30" y="580" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Never combine blocks from different versions; do not publish a partial load.</text><text x="30" y="630" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">This is a proposed ownership contract, not a guarantee supplied by a file format.</text></svg>