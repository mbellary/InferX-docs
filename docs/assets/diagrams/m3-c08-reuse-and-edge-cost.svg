<text x="395" y="355" font-family="sans-serif" font-size="19" fill="#263d53">Gray output positions are never stored.</text>
<text x="30" y="425" font-family="sans-serif" font-size="20" fill="#152c49">Same 210 useful multiply-accumulates; different padded work and input demand:</text>
<text x="30" y="460" font-family="sans-serif" font-size="19" fill="#263d53">T = 2: 246 input reads / 288 updates.  T = 4: 144 / 512.  T = 8: 72 / 512.</text>
<text x="30" y="500" font-family="sans-serif" font-size="18" fill="#263d53">Exact teaching-model counts; requested input values are not measured DRAM transactions.</text>
