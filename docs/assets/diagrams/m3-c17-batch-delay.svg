<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Constructed batch formation and service timeline</title><desc id="desc">Four requests arriving at zero, one, two and three milliseconds form one batch at three and complete at five. Formation waits are three, two, one and zero milliseconds. Response latencies are five, four, three and two milliseconds. Immediate singles each take one millisecond.</desc><rect width="1100" height="600" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Spaced arrivals: faster amortization can increase response latency</text><text x="30" y="80" font-size="19">Constructed arrivals at 0,1,2,3 ms; size-four-or-3-ms-timeout policy</text><path d="M180 120 L180 430" stroke="#526d82" stroke-width="2" fill="none"/><text x="175" y="112" font-size="17">0</text><path d="M330 120 L330 430" stroke="#526d82" stroke-width="2" fill="none"/><text x="325" y="112" font-size="17">1</text><path d="M480 120 L480 430" stroke="#526d82" stroke-width="2" fill="none"/><text x="475" y="112" font-size="17">2</text><path d="M630 120 L630 430" stroke="#526d82" stroke-width="2" fill="none"/><text x="625" y="112" font-size="17">3</text><path d="M780 120 L780 430" stroke="#526d82" stroke-width="2" fill="none"/><text x="775" y="112" font-size="17">4</text><path d="M930 120 L930 430" stroke="#526d82" stroke-width="2" fill="none"/><text x="925" y="112" font-size="17">5</text><text x="970" y="112" font-size="17">ms</text><text x="30" y="170" font-size="18">Request 1</text><rect x="180" y="145" width="450" height="38" fill="#fce1a9"/><rect x="630" y="145" width="300" height="38" fill="#a8d8c5"/><text x="960" y="170" font-size="18">5 ms</text><text x="30" y="240" font-size="18">Request 2</text><rect x="330" y="215" width="300" height="38" fill="#fce1a9"/><rect x="630" y="215" width="300" height="38" fill="#a8d8c5"/><text x="960" y="240" font-size="18">4 ms</text><text x="30" y="310" font-size="18">Request 3</text><rect x="480" y="285" width="150" height="38" fill="#fce1a9"/><rect x="630" y="285" width="300" height="38" fill="#a8d8c5"/><text x="960" y="310" font-size="18">3 ms</text><text x="30" y="380" font-size="18">Request 4</text><rect x="630" y="355" width="300" height="38" fill="#a8d8c5"/><text x="960" y="380" font-size="18">2 ms</text><text x="960" y="430" font-size="17">Latency</text><text x="180" y="480" font-size="19">Yellow: formation wait</text><text x="550" y="480" font-size="19">Green: same shared 2 ms service</text><text x="30" y="526" font-size="19">Immediate singles: each latency 1 ms. Batch: latencies 5,4,3,2 ms; mean 3.5 ms.</text><text x="30" y="568" font-size="19">Burst at t=0 changes the result: mean singles 2.5 ms; full batch 2 ms.</text></g></svg>