<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Illustrative topology with distinct CPU, memory and device placement</title><desc id="desc">Node A has root A and switch A with G0, G1 and NIC0. Node B has root B with G2 and NIC1. Nodes connect through a system interconnect; an optional NVLink between G0 and G1 is unverified.</desc><rect width="1100" height="600" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="37" font-size="25">Trace pages, roots, switches and endpoints separately</text><text x="30" y="72" font-size="18">Invented teaching topology; optional connections require actual evidence</text><rect x="65" y="105" width="330" height="70" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="77" y="132" font-size="19">CPU / NUMA node A</text><text x="77" y="156" font-size="16">Pages A; submitter placed separately</text><rect x="705" y="105" width="330" height="70" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="717" y="132" font-size="19">CPU / NUMA node B</text><text x="717" y="156" font-size="16">Pages B; submitter placed separately</text><path d="M395 140 L705 140" stroke="#526d82" stroke-width="2" fill="none"/><text x="438" y="123" font-size="17">System interconnect</text><rect x="130" y="220" width="200" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="142" y="247" font-size="19">Root / bridge A</text><text x="142" y="271" font-size="16">PCIe hierarchy</text><path d="M230 175 L230 220" stroke="#526d82" stroke-width="2" fill="none"/><rect x="770" y="220" width="200" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="782" y="247" font-size="19">Root / bridge B</text><text x="782" y="271" font-size="16">PCIe hierarchy</text><path d="M870 175 L870 220" stroke="#526d82" stroke-width="2" fill="none"/><rect x="130" y="330" width="200" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="142" y="357" font-size="19">Switch A</text><text x="142" y="381" font-size="16">Shared host uplink</text><path d="M230 285 L230 330" stroke="#526d82" stroke-width="2" fill="none"/><rect x="705" y="430" width="150" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="717" y="457" font-size="19">G2</text><text x="717" y="481" font-size="16">GPU endpoint</text><rect x="900" y="430" width="165" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="912" y="457" font-size="19">NIC1</text><text x="912" y="481" font-size="16">Network endpoint</text><path d="M870 285 L780 430" stroke="#526d82" stroke-width="2" fill="none"/><path d="M870 285 L982 430" stroke="#526d82" stroke-width="2" fill="none"/><rect x="30" y="430" width="165" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="457" font-size="19">G0</text><text x="42" y="481" font-size="16">GPU endpoint</text><path d="M230 395 L112 430" stroke="#526d82" stroke-width="2" fill="none"/><rect x="235" y="430" width="165" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="247" y="457" font-size="19">G1</text><text x="247" y="481" font-size="16">GPU endpoint</text><path d="M230 395 L317 430" stroke="#526d82" stroke-width="2" fill="none"/><rect x="440" y="430" width="165" height="65" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="452" y="457" font-size="19">NIC0</text><text x="452" y="481" font-size="16">Network endpoint</text><path d="M230 395 L522 430" stroke="#526d82" stroke-width="2" fill="none"/><path d="M112 510 L317 510" stroke="#526d82" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M112 495 L112 510" stroke="#526d82" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M317 495 L317 510" stroke="#526d82" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="35" y="542" font-size="17">Optional G0–G1 NVLink: verify support and active route</text><text x="30" y="580" font-size="18">NIC0 → host pages A shares Switch A uplink. G0 → G1 may use another route.</text></g></svg>