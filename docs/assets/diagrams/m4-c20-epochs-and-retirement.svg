<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Replay: current data and safe retirement</title><desc id="desc">Same address and shape do not establish the current invocation or owner</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Replay: current data and safe retirement</text><text x="30" y="76" class="sub">Same address and shape do not establish the current invocation or owner</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Epoch A: diagnostic y = 2x + 1</text><text x="48" y="168" class="body">Rows: [1,3,5] and [2,2,2]</text><text x="48" y="195" class="body">Expected: [3,7,11] and [5,5,5]</text><text x="48" y="222" class="body">Record allocation and request generation</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Epoch B: new valid input is x + 10</text><text x="538" y="168" class="body">Same addresses; new input-ready event</text><text x="538" y="195" class="body">Expected: [23,27,31] and [25,25,25]</text><text x="538" y="222" class="body">An epoch-A answer is stale for B</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Submitted work retains claims</text><text x="48" y="343" class="body">Cancellation discards caller interest</text><text x="48" y="370" class="body">Device work and final readers may remain</text><text x="48" y="397" class="body">Unknown completion keeps slot quarantined</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Retirement permits next generation</text><text x="538" y="343" class="body">All covered device work completed</text><text x="538" y="370" class="body">Final output readers released their claims</text><text x="538" y="397" class="body">Only then reassign storage / graph slot</text><text x="30" y="465" class="body">Check current reference, installed binding and request mapping before accepting output.</text><text x="30" y="492" class="body">A normalization-only shift test can miss this stale-data witness; use distinct probes.</text></svg>