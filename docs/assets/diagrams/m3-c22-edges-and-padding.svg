<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">GEMM output coverage and arithmetic padding</title><desc id="desc">Two teaching output tiles cover 512 positions of which 217 are useful; reduction padding adds a separate work cost.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Ragged geometry: storage padding and extra math differ</text><text x="30" y="76" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Teaching tile: 16 × 16 output positions; logical M = 31, N = 7, K = 33</text><rect x="55" y="110" width="320" height="320" rx="8" fill="#e2e8f0" stroke="#8293a8"/><rect x="55" y="110" width="140" height="310" fill="#a7f3d0"/><path d="M55 270 H375" stroke="#475569" stroke-width="2"/><text x="215" y="180" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Unused columns</text><text x="215" y="212" fill="#172b42" font-family="Arial, sans-serif" font-size="18">under this model</text><text x="65" y="465" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">217 useful / 512 covered</text><text x="65" y="499" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Output coverage: 42.3828%</text><rect x="430" y="110" width="570" height="320" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="450" y="148" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Output coverage: 2 tiles of 16 × 16</text><text x="450" y="195" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Logical product: 31 × 7 × 33</text><text x="450" y="233" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Useful work: 14,322 FLOPs</text><text x="450" y="280" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Explicit zero-padded product: 32 × 16 × 48</text><text x="450" y="319" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Padded work model: 49,152 FLOPs</text><text x="450" y="370" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Useful / padded: 29.1382%</text><text x="450" y="406" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Actual backend execution needs separate evidence.</text><text x="40" y="550" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">Leading-dimension padding alone changes storage, while preserving M/N/K.</text><text x="40" y="587" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Explicit arithmetic padding adds zero operand regions; validate all padded outputs.</text></svg>