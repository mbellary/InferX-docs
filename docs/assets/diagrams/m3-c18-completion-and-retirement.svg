<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Completion and retirement for two independent slots</title><desc id="desc">Each slot orders upload completion before computation, download and validation. Different slots may overlap. Reuse follows that slot’s actual completion and reader retirement; cancellation and timeout do not release live storage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Overlap different slots; retain ordering within each generation</text><text x="30" y="82" font-size="18">Required dependencies, not a time scale; host return is not device completion</text><text x="30" y="153" font-size="18">Slot 0 / epoch e</text><rect x="230" y="125" width="200" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="242" y="154" font-size="19">Fill / upload</text><text x="242" y="182" font-size="17">Completion verified</text><rect x="460" y="125" width="200" height="85" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="472" y="154" font-size="19">Compute</text><text x="472" y="182" font-size="17">Completion verified</text><rect x="690" y="125" width="200" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="702" y="154" font-size="19">Download</text><text x="702" y="182" font-size="17">Completion verified</text><rect x="920" y="125" width="160" height="85" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="932" y="154" font-size="19">Validate</text><text x="932" y="182" font-size="17">Readers retire</text><path d="M430 168 L455 168" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M660 168 L685 168" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M890 168 L915 168" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="298" font-size="18">Slot 1 / epoch e+1</text><rect x="230" y="270" width="200" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="242" y="299" font-size="19">Fill / upload</text><text x="242" y="327" font-size="17">Completion verified</text><rect x="460" y="270" width="200" height="85" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="472" y="299" font-size="19">Compute</text><text x="472" y="327" font-size="17">Completion verified</text><rect x="690" y="270" width="200" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="702" y="299" font-size="19">Download</text><text x="702" y="327" font-size="17">Completion verified</text><rect x="920" y="270" width="160" height="85" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="932" y="299" font-size="19">Validate</text><text x="932" y="327" font-size="17">Readers retire</text><path d="M430 313 L455 313" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M660 313 L685 313" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M890 313 L915 313" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="420" font-size="20">Reuse each slot only after its own download and validation readers retire.</text><text x="30" y="465" font-size="19">Cancellation: suppress publication; retain live storage and generation identity.</text><text x="30" y="510" font-size="19">Watchdog expiry: completion unknown. Stop admission; do not infer safe reuse.</text><text x="30" y="550" font-size="18">Independent slots permit overlap only when the actual dependency contract allows it.</text></g></svg>