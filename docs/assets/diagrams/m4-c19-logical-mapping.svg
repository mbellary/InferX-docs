<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="Logical random draw mapping"><rect width="1100" height="580" fill="#f5f7fb"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#526580"/></marker></defs><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Logical identity owns randomness; worker order does not</text><rect x="35" y="100" width="220" height="65" rx="7" fill="#315bb5"/><text x="145" y="140" text-anchor="middle" font-size="21" fill="white">Request stream r</text><rect x="305" y="100" width="220" height="65" rx="7" fill="#315bb5"/><text x="415" y="140" text-anchor="middle" font-size="21" fill="white">Token step t</text><rect x="575" y="100" width="220" height="65" rx="7" fill="#315bb5"/><text x="685" y="140" text-anchor="middle" font-size="21" fill="white">Purpose domain d</text><rect x="845" y="100" width="220" height="65" rx="7" fill="#315bb5"/><text x="955" y="140" text-anchor="middle" font-size="21" fill="white">Subdraw k</text><path d="M145,165 L145,205 L955,205 L955,165 M550,205 L550,242" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#a)"/><rect x="265" y="250" width="570" height="60" rx="7" fill="#087f83"/><text x="550.0" y="287" text-anchor="middle" font-size="21" fill="white">Key + checked counter → raw words</text><rect x="265" y="355" width="570" height="60" rx="7" fill="#7552a8"/><text x="550.0" y="392" text-anchor="middle" font-size="21" fill="white">Declared word conversion → logical uniform u</text><rect x="265" y="460" width="570" height="60" rx="7" fill="#087f83"/><text x="550.0" y="497" text-anchor="middle" font-size="21" fill="white">Fixed policy / CDF → ID → checked commit</text><path d="M550,310 L550,347" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#a)"/><path d="M550,415 L550,452" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#a)"/><text x="28" y="558" font-size="18">Batch row, thread lane and graph slot execute the decision; they do not replace its stable logical identity.</text></g></svg>