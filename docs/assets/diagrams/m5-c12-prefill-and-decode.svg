<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Earlier admission can delay requests already decoding</title><desc id="desc">Same five-attempt finite trace • stipulated costs • no hardware result</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Earlier admission can delay requests already decoding</text><text x="30" y="76" class="sub">Same five-attempt finite trace • stipulated costs • no hardware result</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Shared starting point</text><text x="48" y="168" class="body">Receipts A0/B1/C3/D4/E6 ms</text><text x="48" y="195" class="body">A/B/C prefill 3–5; output counts 2/4/1</text><text x="48" y="222" class="body">Both policies emit their first IDs at 5</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="538" y="137" class="head">Continuous full-prefill priority</text><text x="538" y="168" class="body">D prefill 5–7; E prefill 7–9</text><text x="538" y="195" class="body">A/B next decode 9–10: first gap 5 ms</text><text x="538" y="222" class="body">A terminal 10; B terminal 12; drain 13</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="48" y="312" class="head">Compare the same useful outputs</text><text x="48" y="343" class="body">Both policies produce nine valid IDs</text><text x="48" y="370" class="body">Mean first output: continuous 3.4, static 4.6</text><text x="48" y="397" class="body">Mean terminal: continuous 5.8, static 5.4</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Joint teaching targets still matter</text><text x="538" y="343" class="body">First output ≤6; each gap ≤2; terminal ≤8</text><text x="538" y="370" class="body">Static A/B/C/E pass: 4/5 offered attempts</text><text x="538" y="397" class="body">Continuous C/D/E pass: 3/5 attempts</text><text x="30" y="465" class="body">All durations are milliseconds; reader work and resource limits are preserved.</text><text x="30" y="492" class="body">A lower mean first-output delay proves neither better joint service nor useful capacity.</text></svg>