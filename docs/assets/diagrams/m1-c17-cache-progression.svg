<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="730" viewBox="0 0 1060 730" role="img" aria-labelledby="title desc"><title id="title">Three forwards retain processed prefix state while selected history runs ahead</title><desc id="desc">Forward one processes ID one at position zero, caches one position and selects ID two. Forward two processes the selected ID two at position one and caches two positions. Forward three caches three positions, selecting a final fourth history ID which is not processed. Logical FP64 KV payload across both layers is sixty four, one hundred twenty eight and one hundred ninety two bytes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="730" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Processed cache state can lag the selected token history</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Fixed two-layer model; prompt [1]; three greedy selections.</text><rect x="30" y="115" width="1000" height="65" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="45" y="155" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Forward</text><text x="160" y="155" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">New input</text><text x="445" y="155" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Processed IDs</text><text x="635" y="155" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Selected history</text><text x="855" y="155" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">N / valid KV</text><rect x="30" y="195" width="1000" height="90" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="45" y="247" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">1</text><text x="160" y="247" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1] at position 0</text><text x="445" y="247" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1]</text><text x="635" y="247" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1, 2]</text><text x="855" y="247" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">1 / 64 bytes</text><rect x="30" y="305" width="1000" height="90" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="45" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">2</text><text x="160" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[2] at position 1</text><text x="445" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1, 2]</text><text x="635" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1, 2, 2]</text><text x="855" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">2 / 128 bytes</text><rect x="30" y="415" width="1000" height="90" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="45" y="467" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">3</text><text x="160" y="467" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[2] at position 2</text><text x="445" y="467" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1, 2, 2]</text><text x="635" y="467" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[1, 2, 2, 2]</text><text x="855" y="467" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">3 / 192 bytes</text><rect x="30" y="545" width="1000" height="105" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="584" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Both layers have the same valid length, but different K/V values.</text><text x="50" y="624" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">No fourth forward merely to cache a terminal selected ID.</text><text x="30" y="697" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">At G = 0: no forward, no selection and no populated cache. Counts are constructed.</text></svg>