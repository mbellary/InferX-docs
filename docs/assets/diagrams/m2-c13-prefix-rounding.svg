<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Longest common prefix and conservative full block reuse</title><desc id="desc">Four twelve position queries share nine four zero or twelve positions with cached S. With four positions per block and a policy leaving final prompt evaluation, they reuse eight four zero or eight positions. Request hit rate is seventy five percent and reused position fraction forty one point six seven percent.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Common-prefix length is not the number of reused positions</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">S = [1,2,…,12]; N = 12; B = 4; evaluate at least one prompt position</text><rect x="30" y="120" width="1000" height="100" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="156" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Q1: position 9 changes to 99</text><text x="50" y="198" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">L = 9 → reuse 8 positions / 2 blocks; evaluate 4 positions</text><rect x="30" y="250" width="1000" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="286" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Q2: position 4 changes to 50</text><text x="50" y="328" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">L = 4 → reuse 4 positions / 1 block; evaluate 8 positions</text><rect x="30" y="380" width="1000" height="100" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="416" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Q3: first block changes; later blocks match</text><text x="50" y="458" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">L = 0 → reuse 0; evaluate all 12 positions</text><rect x="30" y="510" width="1000" height="100" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="546" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Q4: the entire prompt matches</text><text x="50" y="588" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">L = 12 → reuse 8, evaluate 4 under this final-logit policy</text><text x="30" y="655" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Request hits: 3/4 = 75%; reused-position fraction: 20/48 ≈ 41.67%.</text><text x="30" y="695" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">These predict skipped prompt positions, not latency or decoding speedup.</text></svg>