<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Target population and diagnostic coverage are different</title><desc id="desc">Four constructed strata • target weights are independent of diagnostic counts</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Target population and diagnostic coverage are different</text><text x="30" y="76" class="sub">Four constructed strata • target weights are independent of diagnostic counts</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Target mix: 1000 offered attempts</text><text x="48" y="168" class="body">Short 700; long prompt 200</text><text x="48" y="195" class="body">Output-heavy 80; rare long 20</text><text x="48" y="222" class="body">Weights 70% / 20% / 8% / 2%</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Balanced diagnostic corpus</text><text x="538" y="168" class="body">25 records per stratum; 100 total</text><text x="538" y="195" class="body">Useful for rare-case coverage</text><text x="538" y="222" class="body">Not the target’s 70/20/8/2 composition</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Policy means need declared weighting</text><text x="48" y="343" class="body">Target A 25.4 ms; B 24.6 ms</text><text x="48" y="370" class="body">Balanced A 82.5 ms; B 74.25 ms</text><text x="48" y="397" class="body">These are stipulated, not measured results</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Always expose the class regression</text><text x="538" y="343" class="body">Short class A 10 ms → B 12 ms</text><text x="538" y="370" class="body">20% slower despite lower aggregate mean</text><text x="538" y="397" class="body">Do not average class p99 values</text><text x="30" y="465" class="body">Weighted means require compatible class populations and representative within-class evidence.</text><text x="30" y="492" class="body">Class-specific rejections change successful-only conditioning; preserve all outcomes.</text></svg>