<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Copy routes and distinct preparation and checking scopes</title><desc id="desc">Pageable or prepared host storage communicates through a declared H2D or D2H route with one GPU. Local D2D uses separate allocations on the same GPU. Setup and readback validation have separate costs. Payload rate and modeled read plus write rate do not by themselves measure physical traffic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Name the copy path and retain preparation / verification boundaries</text><rect x="30" y="110" width="320" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="139" font-size="19">Host storage</text><text x="42" y="167" font-size="17">Pageable or prepared / pinned</text><rect x="420" y="110" width="280" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="432" y="139" font-size="19">Declared transfer route</text><text x="432" y="167" font-size="17">H2D →     ← D2H</text><rect x="770" y="110" width="300" height="100" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="782" y="139" font-size="19">One GPU storage domain</text><text x="782" y="167" font-size="17">Source / destination identity</text><path d="M350 150 L415 150" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700 170 L765 170" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="290" width="320" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="319" font-size="19">Setup / release</text><text x="42" y="347" font-size="17">Allocate, register, place, retire</text><rect x="420" y="290" width="280" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="432" y="319" font-size="19">Local D2D</text><text x="432" y="347" font-size="17">Distinct buffers on same GPU</text><rect x="770" y="290" width="300" height="100" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="782" y="319" font-size="19">Exact validation</text><text x="782" y="347" font-size="17">Readbacks have separate costs</text><text x="30" y="450" font-size="20">S / T is payload rate. 2S / T is a declared read-plus-write model.</text><text x="30" y="495" font-size="19">Neither convention alone measures physical DRAM or connection traffic.</text><text x="30" y="540" font-size="19">A returning API call does not establish safe consumption or buffer reuse.</text><path d="M415 180 L350 180" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 140 L700 140" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/></g></svg>