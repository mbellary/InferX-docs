<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">GEMV reuse policies and completion boundaries</title><desc id="desc">Repeated and rotating access histories precede a completed GEMV and separate diagnostic validation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Reuse is a workload policy; cache residency needs evidence</text><text x="30" y="76" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Same 1,024 × 1,024 shape and values; distinct allocation identities</text><rect x="35" y="110" width="465" height="140" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="144" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Repeat policy</text><text x="55" y="181" fill="#172b42" font-family="Arial, sans-serif" font-size="19">One GEMV primes target A into scratch.</text><text x="55" y="218" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Wait, then measure A again.</text><rect x="535" y="110" width="470" height="140" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="555" y="144" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Rotation policy</text><text x="555" y="181" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Visit R−1 other matrices; complete them.</text><text x="555" y="218" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Then measure target slot q; advance q.</text><text x="40" y="291" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Defined per-observation order</text><rect x="40" y="320" width="270" height="90" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="56" y="355" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Prepare / initialize y</text><text x="56" y="384" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Complete required primers</text><rect x="370" y="320" width="270" height="90" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="387" y="355" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Start event → GEMV</text><text x="387" y="384" fill="#172b42" font-family="Arial, sans-serif" font-size="19">End event → wait</text><rect x="700" y="320" width="300" height="90" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="717" y="355" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Readback / checks</text><text x="717" y="384" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Retain output and guard verdicts</text><path d="M310 365 L370 365" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M640 365 L700 365" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="454" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">No transfer or diagnostic access between final primer and timed GEMV.</text><text x="40" y="493" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Operation timing excludes preparation, priming and later validation.</text><text x="40" y="532" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Retain those costs separately; compare normal latency before diagnostic profiles.</text><text x="40" y="571" fill="#172b42" font-family="Arial, sans-serif" font-size="19">A bank larger than cache increases reuse distance; it does not prove eviction.</text><text x="40" y="603" fill="#172b42" font-family="Arial, sans-serif" font-size="17">Illustrative order only: block widths are not elapsed times.</text></svg>