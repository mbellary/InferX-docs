<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="670" viewBox="0 0 1060 670" role="img" aria-labelledby="title desc"><title id="title">Causal mask alignment</title><desc id="desc">A full three-token prefix has a lower triangle including its diagonal. Two suffix queries at positions three and four over five keys allow four and five keys respectively. Local query row numbers do not express sequence position.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="670" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#0f172a">Causal visibility follows logical positions</text><text x="30" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Green = allowed • red = forbidden • diagonal/current token included</text><text x="30" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Full prefix: queries 0, 1, 2</text><text x="535" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Suffix: queries 3, 4; prefix length 3</text><text x="171" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">0</text><text x="241" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">1</text><text x="311" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">2</text><text x="150" y="158" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">key positions</text><text x="40" y="239" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">query 0</text><rect x="150" y="205" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="172" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="220" y="205" width="58" height="53" rx="9" fill="#fee2e2" stroke="#64748b"/><text x="242" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">0</text><rect x="290" y="205" width="58" height="53" rx="9" fill="#fee2e2" stroke="#64748b"/><text x="312" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">0</text><text x="40" y="304" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">query 1</text><rect x="150" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="172" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="220" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="242" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="290" y="270" width="58" height="53" rx="9" fill="#fee2e2" stroke="#64748b"/><text x="312" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">0</text><text x="40" y="369" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">query 2</text><rect x="150" y="335" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="172" y="369" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="220" y="335" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="242" y="369" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="290" y="335" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="312" y="369" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><text x="656" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">0</text><text x="726" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">1</text><text x="796" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">2</text><text x="866" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">3</text><text x="936" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">4</text><text x="635" y="158" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">key positions</text><text x="525" y="239" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">query 3</text><rect x="635" y="205" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="657" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="705" y="205" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="727" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="775" y="205" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="797" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="845" y="205" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="867" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="915" y="205" width="58" height="53" rx="9" fill="#fee2e2" stroke="#64748b"/><text x="937" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">0</text><text x="525" y="304" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">query 4</text><rect x="635" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="657" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="705" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="727" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="775" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="797" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="845" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="867" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="915" y="270" width="58" height="53" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="937" y="304" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1</text><rect x="30" y="455" width="1000" height="90" rx="9" fill="#fef3c7" stroke="#64748b"/><text x="50" y="490" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Suffix row i = 0 means logical query position 3, not position 0.</text><text x="50" y="525" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Correct rule: key position ≤ query position, with key validity checked separately.</text><text x="30" y="592" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Single new query at position 4 may read keys 0, 1, 2, 3 and 4.</text><text x="30" y="632" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">A local upper-left rule j ≤ i would incorrectly allow only key 0.</text></svg>