<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">Positional representation and rotary compatibility</title><desc id="desc">Three vectors demonstrate exact quarter-turn rotations with preserved squared length twenty-five. A separate standard four-feature fixture shows that resetting only the query position changes its scaled score against a retained key. Norms and shapes alone cannot detect the wrong position.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="690" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Position changes representation; a mask controls access</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Custom quarter-turn example: θ = π/2 radians per position</text><rect x="30" y="105" width="460" height="365" rx="9" fill="#e0f2fe" stroke="#64748b"/><rect x="520" y="105" width="510" height="365" rx="9" fill="#dcfce7" stroke="#64748b"/><path d="M245,290 L435,290" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M245,420 L245,135" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M245,290 L320,190" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M245,290 L145,215" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M245,290 L170,390" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="325" y="183" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">p = 0: [3, 4]</text><text x="50" y="205" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">p = 1: [−4, 3]</text><text x="48" y="424" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">p = 2: [−3, −4]</text><text x="50" y="452" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Each squared length = 25</text><text x="540" y="145" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Standard 4-feature fixture</text><text x="540" y="185" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Frequencies: [1, 0.01]</text><text x="540" y="225" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Query position 3; key position 1</text><text x="540" y="265" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Scaled score ≈ 0.2918265851</text><text x="540" y="320" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Reset only query to position 0:</text><text x="540" y="360" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Scaled score ≈ 0.7701261531</text><text x="540" y="410" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Same shape and norm; wrong meaning.</text><rect x="30" y="505" width="1000" height="105" rx="9" fill="#fef3c7" stroke="#64748b"/><text x="50" y="545" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Retained keys: record logical position and whether rotation is already applied.</text><text x="50" y="582" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Rotate Q/K consistently; do not rotate an already rotated key a second time.</text><text x="30" y="657" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Additive position vectors and RoPE are different schemes; follow the checkpoint contract.</text></svg>