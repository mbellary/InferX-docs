<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Publication and safe reuse of shared panels</title><desc id="desc">Initialize, publish, consume, then establish safe reuse before another stage overwrites shared storage.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="42" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Single-buffer lifetime: a reused panel is shared state</text><rect x="40" y="105" width="960" height="80" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="60" y="137" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Stage q: initialize every panel slot</text><text x="60" y="169" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Valid global values or explicit zero for invalid coordinates.</text><rect x="40" y="205" width="960" height="80" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="60" y="237" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Publish before consuming</text><text x="60" y="269" fill="#172b42" font-family="Arial, sans-serif" font-size="20">All required block participants establish readiness.</text><rect x="40" y="305" width="960" height="80" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="60" y="337" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Consume into retained accumulators</text><text x="60" y="369" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Every reader finishes its old-panel accesses.</text><rect x="40" y="405" width="960" height="80" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="60" y="437" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Establish safe reuse before overwrite</text><text x="60" y="469" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Then the next stage can own the same panel storage.</text><path d="M520 185 L520 202" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M520 285 L520 302" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M520 385 L520 402" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="537" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Two baseline barriers per stage; block scope, not grid scope.</text><text x="40" y="580" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Final partial K stage still initializes invalid slots to zero.</text><text x="40" y="612" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Cancellation on the host does not end device use or permit buffer reclamation.</text></svg>