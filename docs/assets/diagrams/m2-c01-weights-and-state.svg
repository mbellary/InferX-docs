<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="715" viewBox="0 0 1060 715" role="img" aria-labelledby="title desc"><title id="title">Shared weights and private request caches</title><desc id="desc">Shared selector weights derive request A keys one two and values ten twenty, while B values are one hundred two hundred. Each scalar FP64 two-position cache has thirty two logical bytes. A query must use the correct request state even when shapes match.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="715" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Shared transformations, private derived context</text><rect x="30" y="85" width="1000" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="124" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Resident model weights: Wk and Wv for the named layer</text><text x="50" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">The same projections can serve different request inputs.</text><path d="M270,195 L270,225" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M780,195 L780,225" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="235" width="475" height="170" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="274" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Request A: processed context</text><text x="50" y="318" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">K = [1, 2]; V = [10, 20]</text><text x="50" y="360" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Owner A; valid length 2</text><text x="50" y="394" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">32 logical KV bytes (FP64)</text><rect x="535" y="235" width="495" height="170" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="555" y="274" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Request B: processed context</text><text x="555" y="318" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">K = [1, 2]; V = [100, 200]</text><text x="555" y="360" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Owner B; valid length 2</text><text x="555" y="394" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">32 logical KV bytes (FP64)</text><rect x="30" y="450" width="1000" height="125" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="491" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Current query q = 1 uses the correct owner’s eligible K/V.</text><text x="50" y="534" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">A output ≈ 17.3106; B output ≈ 173.1059. Equal shapes are insufficient.</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Q, scores and attention probabilities can be temporary; old K/V remain reusable.</text><text x="30" y="675" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Independent one-layer scalar fixture; not the full Module 1 model.</text></svg>