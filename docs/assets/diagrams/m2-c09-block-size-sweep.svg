<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="695" viewBox="0 0 1060 695" role="img" aria-labelledby="title desc"><title id="title">Block size versus tail slack and mapping entries</title><desc id="desc">For four lengths one four five and nine, block sizes two four eight require eleven seven five blocks. Valid payload is 2432 bytes in all cases. Tail slack is 384 1152 2688 bytes; active entry bytes are 44 28 20. These are unconstrained requirements, not an admission trace.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="695" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">The same valid rows can require different capacities</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Lengths [1,4,5,9]; k = 128 bytes/position; 19 valid positions</text><rect x="30" y="120" width="1000" height="130" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="157" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">B = 2: 11 blocks; 44 active entry bytes</text><text x="50" y="198" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Valid 2432 bytes + tail 384 bytes = assigned 2816 bytes</text><text x="50" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Four bytes per active table entry; headers/descriptors excluded.</text><rect x="30" y="280" width="1000" height="130" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="317" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">B = 4: 7 blocks; 28 active entry bytes</text><text x="50" y="358" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Valid 2432 bytes + tail 1152 bytes = assigned 3584 bytes</text><text x="50" y="392" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Four bytes per active table entry; headers/descriptors excluded.</text><rect x="30" y="440" width="1000" height="130" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="477" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">B = 8: 5 blocks; 20 active entry bytes</text><text x="50" y="518" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Valid 2432 bytes + tail 2688 bytes = assigned 5120 bytes</text><text x="50" y="552" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Four bytes per active table entry; headers/descriptors excluded.</text><text x="30" y="613" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Aligned lengths [8,8,8,8]: zero tail slack for every candidate.</text><text x="30" y="655" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Unconstrained capacity requirements; apply the pool budget separately.</text></svg>