<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Sampling: preserve support, draw and commit</title><desc id="desc">One request / logical token decision; invalid policy consumes no draw</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Sampling: preserve support, draw and commit</text><text x="30" y="76" class="sub">One request / logical token decision; invalid policy consumes no draw</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">1. Scores → retained support</text><text x="48" y="168" class="body">Finite logits; T &gt; 0; deterministic ties</text><text x="48" y="195" class="body">Top-k → normalize → top-p</text><text x="48" y="222" class="body">Smallest prefix with cumulative mass ≥ τ</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">2. Retained support → selected ID</text><text x="538" y="168" class="body">Normalize again; one pending uniform</text><text x="538" y="195" class="body">Draw in ascending vocabulary-ID order</text><text x="538" y="222" class="body">First cumulative probability &gt; u</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">3. Selected ID → device completion</text><text x="48" y="343" class="body">Buffers and mapping remain alive</text><text x="48" y="370" class="body">Fallback preserves the pending uniform</text><text x="48" y="397" class="body">Cancellation does not free live state</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">4. Completion → generator commit</text><text x="538" y="343" class="body">Validate request and slot generation</text><text x="538" y="370" class="body">Append / stop / publish exactly once</text><text x="538" y="397" class="body">Discard cancelled result; reclaim safely</text><text x="30" y="465" class="body">Greedy is a separate maximum/lowest-ID decision: zero draws.</text><text x="30" y="492" class="body">Successful singleton sampling still consumes one logical uniform.</text></svg>