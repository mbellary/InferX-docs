<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Physical eligibility and peak memory are separate gates</title><desc id="desc">Independent packed-capacity, small staging and physical-charge references</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Physical eligibility and peak memory are separate gates</text><text x="30" y="76" class="sub">Independent packed-capacity, small staging and physical-charge references</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Packed axes have explicit meanings</text><text x="48" y="168" class="body">Logical N=3,R=6 → capacity (4,8)</text><text x="48" y="195" class="body">Six of eight query rows useful: 75%</text><text x="48" y="222" class="body">Not a 4 × 8 per-request token rectangle</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Small FP32 staging model</text><text x="538" y="168" class="body">Input + output, width 16: 128 bytes/row</text><text x="538" y="195" class="body">Eight rows 1,024 B; six rows 768 B</text><text x="538" y="222" class="body">256 extra bytes; other buffers excluded</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Memory gate with a 16-MiB limit</text><text x="48" y="343" class="body">Existing 12 + new KV 0.5 MiB</text><text x="48" y="370" class="body">Workspace 2 + two staging charges 0.25</text><text x="48" y="397" class="body">Peak 15 MiB; uncommitted 1 MiB</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Same counts can fail on workspace</text><text x="538" y="343" class="body">Workspace 4 instead of 2 → peak 17 MiB</text><text x="538" y="370" class="body">Dropping 1 Retiring MiB falsely shows 16</text><text x="538" y="397" class="body">Final users, not cancellation, release bytes</text><text x="30" y="465" class="body">A capacity-16 executable cannot override the logical query cap of eight.</text><text x="30" y="492" class="body">Count backing pools once and keep old readers protected; future growth is another contract.</text></svg>