<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
<title id="title">The axis determines the reduction groups</title><desc id="desc">A has rows 1 3 5 and 2 4 6. Reducing columns within rows yields sums 9 and 12. Reducing rows within columns yields sums 3 7 and 11.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4f6b87"/></marker></defs>
<rect width="880" height="560" fill="white"/>
<g font-family="Arial, sans-serif" fill="#203247">
<text x="440" y="35" text-anchor="middle" font-size="25">The axis determines which values belong together</text>
<text x="295" y="85" text-anchor="middle" font-size="19">A: shape (2, 3)</text>
<rect x="170" y="110" width="75" height="55" rx="8" fill="#edf7f1" stroke="#4f6b87" stroke-width="2"/>
<text x="207" y="146" text-anchor="middle" font-size="23">1</text>
<rect x="255" y="110" width="75" height="55" rx="8" fill="#edf7f1" stroke="#4f6b87" stroke-width="2"/>
<text x="292" y="146" text-anchor="middle" font-size="23">3</text>
<rect x="340" y="110" width="75" height="55" rx="8" fill="#edf7f1" stroke="#4f6b87" stroke-width="2"/>
<text x="377" y="146" text-anchor="middle" font-size="23">5</text>
<rect x="170" y="175" width="75" height="55" rx="8" fill="#fff0cc" stroke="#4f6b87" stroke-width="2"/>
<text x="207" y="211" text-anchor="middle" font-size="23">2</text>
<rect x="255" y="175" width="75" height="55" rx="8" fill="#fff0cc" stroke="#4f6b87" stroke-width="2"/>
<text x="292" y="211" text-anchor="middle" font-size="23">4</text>
<rect x="340" y="175" width="75" height="55" rx="8" fill="#fff0cc" stroke="#4f6b87" stroke-width="2"/>
<text x="377" y="211" text-anchor="middle" font-size="23">6</text>
<path d="M440,170 L510,170" fill="none" stroke="#4f6b87" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="675" y="110" text-anchor="middle" font-size="20">Axis 1: combine columns</text>
<rect x="535" y="135" width="280" height="85" rx="8" fill="#e9f2ff" stroke="#4f6b87" stroke-width="2"/>
<text x="675" y="168" text-anchor="middle" font-size="19">Row sums: [9, 12]</text>
<text x="675" y="198" text-anchor="middle" font-size="19">Shape (2,)</text>
<path d="M295,245 L295,305" fill="none" stroke="#4f6b87" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="295" y="340" text-anchor="middle" font-size="20">Axis 0: combine rows</text>
<rect x="95" y="365" width="400" height="80" rx="8" fill="#e9f2ff" stroke="#4f6b87" stroke-width="2"/>
<text x="295" y="397" text-anchor="middle" font-size="19">Column sums: [3, 7, 11]</text>
<text x="295" y="427" text-anchor="middle" font-size="19">Shape (3,)</text>
<rect x="535" y="320" width="280" height="125" rx="8" fill="#f4f6f8" stroke="#4f6b87" stroke-width="2"/>
<text x="675" y="353" text-anchor="middle" font-size="19">Keep the reduced axis:</text>
<text x="675" y="387" text-anchor="middle" font-size="19">row sums [[9], [12]]</text>
<text x="675" y="422" text-anchor="middle" font-size="19">shape (2, 1)</text>
<text x="440" y="505" text-anchor="middle" font-size="20">All entries together: sum 21, mean 3.5, maximum 6.</text>
<text x="440" y="540" text-anchor="middle" font-size="18">Grouping is part of correctness, even when every input is finite.</text>
</g></svg>
