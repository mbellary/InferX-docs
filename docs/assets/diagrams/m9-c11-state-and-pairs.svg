<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="State preparation and paired measurement"><rect width="1100" height="550" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Restore the declared state before each arm</text><text x="28" y="95" font-size="20" font-weight="bold">Pair 1: A then B</text><rect x="40" y="115" width="155" height="62" rx="7" fill="#63758a"/><text x="117.5" y="152" text-anchor="middle" font-size="17" fill="white">Restore + prepare</text><rect x="205" y="115" width="165" height="62" rx="7" fill="#315bb5"/><text x="287.5" y="152" text-anchor="middle" font-size="17" fill="white">A: measure</text><rect x="380" y="115" width="145" height="62" rx="7" fill="#7552a8"/><text x="452.5" y="152" text-anchor="middle" font-size="17" fill="white">Check + retire</text><text x="40" y="215" font-size="17">Setup-inclusive caller boundary includes preparation.</text><rect x="580" y="115" width="155" height="62" rx="7" fill="#63758a"/><text x="657.5" y="152" text-anchor="middle" font-size="17" fill="white">Restore + prepare</text><rect x="745" y="115" width="165" height="62" rx="7" fill="#087f83"/><text x="827.5" y="152" text-anchor="middle" font-size="17" fill="white">B: measure</text><rect x="920" y="115" width="145" height="62" rx="7" fill="#7552a8"/><text x="992.5" y="152" text-anchor="middle" font-size="17" fill="white">Check + retire</text><text x="580" y="215" font-size="17">Setup-inclusive caller boundary includes preparation.</text><text x="28" y="290" font-size="20" font-weight="bold">Pair 2: B then A</text><rect x="40" y="310" width="155" height="62" rx="7" fill="#63758a"/><text x="117.5" y="347" text-anchor="middle" font-size="17" fill="white">Restore + prepare</text><rect x="205" y="310" width="165" height="62" rx="7" fill="#087f83"/><text x="287.5" y="347" text-anchor="middle" font-size="17" fill="white">B: measure</text><rect x="380" y="310" width="145" height="62" rx="7" fill="#7552a8"/><text x="452.5" y="347" text-anchor="middle" font-size="17" fill="white">Check + retire</text><text x="40" y="410" font-size="17">Setup-inclusive caller boundary includes preparation.</text><rect x="580" y="310" width="155" height="62" rx="7" fill="#63758a"/><text x="657.5" y="347" text-anchor="middle" font-size="17" fill="white">Restore + prepare</text><rect x="745" y="310" width="165" height="62" rx="7" fill="#315bb5"/><text x="827.5" y="347" text-anchor="middle" font-size="17" fill="white">A: measure</text><rect x="920" y="310" width="145" height="62" rx="7" fill="#7552a8"/><text x="992.5" y="347" text-anchor="middle" font-size="17" fill="white">Check + retire</text><text x="580" y="410" font-size="17">Setup-inclusive caller boundary includes preparation.</text><text x="28" y="490" font-size="18">Warm-only timing excludes declared preparation; neither endpoint may hide failed attempts or first-use costs.</text><text x="28" y="522" font-size="17">Order balancing does not repair unequal cache histories, useful outputs or unsafe buffer ownership.</text></g></svg>