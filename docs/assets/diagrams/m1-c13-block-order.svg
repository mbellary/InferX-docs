<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="title desc"><title id="title">Complete Transformer block order and residual lifetimes</title><desc id="desc">Two rows show a pre-normalized attention sublayer and MLP sublayer. The first preserves X around normalization and attention to add into U. The second preserves U around normalization and MLP to produce Y.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="680" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Complete pre-normalized block: keep both skip inputs</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Toy contract: RMSNorm → causal attention → addition → RMSNorm → ReLU MLP → addition</text><rect x="30" y="170" width="140" height="85" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="88" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">X</text><rect x="240" y="170" width="190" height="85" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="258" y="219" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">RMSNorm₁</text><rect x="500" y="170" width="230" height="85" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="524" y="219" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Attention</text><circle cx="820" cy="212" r="25" fill="#fef3c7" stroke="#64748b"/><text x="810" y="221" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#0f172a">+</text><rect x="900" y="170" width="130" height="85" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="949" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">U</text><path d="M178,212 L230,212" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M440,212 L490,212" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M740,212 L785,212" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M855,212 L890,212" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M100,170 L100,125 L820,125 L820,180" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="360" y="113" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Preserve original X</text><rect x="30" y="450" width="140" height="85" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="88" y="501" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">U</text><rect x="240" y="450" width="190" height="85" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="258" y="499" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">RMSNorm₂</text><rect x="500" y="450" width="230" height="85" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="524" y="499" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">ReLU MLP</text><circle cx="820" cy="492" r="25" fill="#fef3c7" stroke="#64748b"/><text x="810" y="501" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#0f172a">+</text><rect x="900" y="450" width="130" height="85" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="949" y="501" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Y</text><path d="M178,492 L230,492" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M440,492 L490,492" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M740,492 L785,492" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M855,492 L890,492" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M100,450 L100,405 L820,405 L820,460" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="360" y="393" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Preserve original U</text><text x="30" y="320" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">First row: U = X + Attention(RMSNorm₁(X)).</text><text x="30" y="365" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Second row starts with that same U; its skip source is not X or RMSNorm₂(U).</text><text x="30" y="600" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Second row: Y = U + MLP(RMSNorm₂(U)).</text><text x="30" y="643" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Do not overwrite X or U before their residual reads. Arrows show dependencies, not durations.</text></svg>