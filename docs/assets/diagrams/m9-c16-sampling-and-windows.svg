<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Sparse sampling misses a short clock dip</title><desc id="desc">A constructed clock is 1500 MHz except from 40 to 60 ms at 900 MHz. Samples at 0,100,200 miss it, while a shifted sample at 50 observes it. Real sensors may average rather than sample points.</desc><rect width="1100" height="560" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">A quiet sample sequence can miss a short state change</text><text x="30" y="75" font-size="18">Constructed ideal point metric; actual sensor windows can differ</text><text x="30" y="145" font-size="17">Clock (MHz)</text><text x="125" y="184" font-size="17">1500</text><text x="134" y="255" font-size="17">900</text><path d="M210 290 L1030 290" fill="none" stroke="#526d82" stroke-width="2"/><path d="M210 125 L210 290" fill="none" stroke="#526d82" stroke-width="2"/><path d="M210 180 H370 V250 H450 V180 H1010" stroke="#b75b37" stroke-width="3" fill="none"/><text x="201" y="315" font-size="16">0</text><text x="361" y="315" font-size="16">40</text><text x="401" y="315" font-size="16">50</text><text x="441" y="315" font-size="16">60</text><text x="601" y="315" font-size="16">100</text><text x="801" y="315" font-size="16">150</text><text x="1001" y="315" font-size="16">200</text><circle cx="210" cy="180" r="7" fill="#246a9a"/><circle cx="610" cy="180" r="7" fill="#246a9a"/><circle cx="1010" cy="180" r="7" fill="#246a9a"/><circle cx="410" cy="250" r="9" fill="none" stroke="#347954" stroke-width="3"/><circle cx="810" cy="180" r="9" fill="none" stroke="#347954" stroke-width="3"/><text x="240" y="355" font-size="17">Time (ms)</text><text x="30" y="407" font-size="20">Blue points: 0, 100, 200 ms → all report 1500 MHz.</text><text x="30" y="448" font-size="20">Green rings: 50, 150 ms → one observation catches the dip.</text><text x="30" y="494" font-size="19">Query interval, refresh interval and averaging window are separate facts.</text><text x="30" y="534" font-size="19">A missing in-trial sample cannot establish an unchanged operating state.</text></g></svg>