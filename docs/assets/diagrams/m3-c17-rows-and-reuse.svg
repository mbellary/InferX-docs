<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Projection rows and separate request ownership</title><desc id="desc">Packed prompts of lengths three and two have five useful rows but two requests. Ordinary decode has one row per active request. Projection weights can be shared while position, mask, KV and generation identity remain separate.</desc><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Batch rows share projection weights; request state stays separate</text><rect x="30" y="100" width="310" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="129" font-size="19">Packed prefill example</text><text x="42" y="157" font-size="17">Lengths 3 + 2 → R=5; B_req=2</text><rect x="30" y="240" width="310" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="269" font-size="19">Ordinary decode example</text><text x="42" y="297" font-size="17">One new row/request → R=B_req</text><rect x="400" y="170" width="280" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="412" y="199" font-size="19">Same projection W: K×N</text><text x="412" y="227" font-size="17">X: R×K → Y: R×N</text><path d="M340 145 L400 210" stroke="#526d82" stroke-width="2" fill="none"/><path d="M340 285 L400 230" stroke="#526d82" stroke-width="2" fill="none"/><path d="M680 220 L740 220" stroke="#526d82" stroke-width="2" fill="none"/><rect x="740" y="100" width="330" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="752" y="129" font-size="19">Per-row identity</text><text x="752" y="157" font-size="17">Request + absolute position</text><rect x="740" y="240" width="330" height="90" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="752" y="269" font-size="19">Private attention contract</text><text x="752" y="297" font-size="17">KV / causal mask / generation</text><text x="30" y="395" font-size="21">Logical bytes = s[KN + R(K+N)]; useful FLOPs = 2RKN.</text><text x="30" y="442" font-size="19">Weights are amortized across rows; inputs and output writes grow with R.</text><text x="30" y="487" font-size="19">Cache hits can also reuse weights across separate calls. Measure each boundary.</text><text x="30" y="539" font-size="19">A later decode input of one request still depends on its earlier token selection.</text></g></svg>