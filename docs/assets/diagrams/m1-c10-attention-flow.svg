<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" role="img" aria-labelledby="title desc"><title id="title">Attention core dataflow</title><desc id="desc">Queries and transposed keys produce two by three scores. Row softmax over keys produces weights. Those weights multiply three by two paired values to produce two by two output features.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="640" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Attention: compare features, then combine values</text><text x="30" y="76" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">One head • L = 2 queries • S = 3 keys • all keys allowed</text><rect x="30" y="110" width="270" height="160" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="145" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Q: (2, 4)</text><text x="50" y="183" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Kᵀ: (4, 3)</text><text x="50" y="226" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Contract 4 features</text><path d="M308,190 L369,190" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="380" y="110" width="285" height="160" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="400" y="145" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">R = QKᵀ / 2: (2, 3)</text><text x="400" y="183" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Query 0: [1, 0, 1]</text><text x="400" y="226" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Query 1: [0, 1, 1]</text><path d="M675,190 L736,190" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="750" y="110" width="280" height="160" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="770" y="145" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">P: (2, 3)</text><text x="770" y="183" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Softmax across keys</text><text x="770" y="226" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Each row sums to 1</text><path d="M890,279 L890,343" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="750" y="355" width="280" height="155" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="770" y="393" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">O = PV: (2, 2)</text><text x="770" y="432" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Contract 3 key positions</text><text x="770" y="474" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Keep query identity</text><rect x="380" y="355" width="285" height="155" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="400" y="393" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">V: (3, 2)</text><text x="400" y="432" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Each row paired with K</text><text x="400" y="474" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">2 value features</text><path d="M675,432 L738,432" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="30" y="570" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">First sum: query/key feature coordinates. Second sum: weighted key positions.</text><text x="30" y="608" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">P contains attention weights, not vocabulary probabilities. O contains feature vectors.</text></svg>