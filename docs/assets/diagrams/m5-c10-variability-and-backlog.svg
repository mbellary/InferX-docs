<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Equal averages can conceal very different waiting</title><desc id="desc">Separate deterministic and fluid fixtures • no measured latency or fill deadline</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Equal averages can conceal very different waiting</text><text x="30" y="76" class="sub">Separate deterministic and fluid fixtures • no measured latency or fill deadline</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Spaced versus burst: 4 jobs in 40 ms</text><text x="48" y="168" class="body">Both 100 requests/s and 50% busy</text><text x="48" y="195" class="body">Mean response 5 versus 11 ms</text><text x="48" y="222" class="body">Maximum response 5 versus 17 ms</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Same demand spread, different order</text><text x="538" y="168" class="body">[17,1,1,1] versus [1,1,1,17] ms</text><text x="538" y="195" class="body">Both mean 5; variance 48 ms²</text><text x="538" y="222" class="body">Response means 15.5 versus 5 ms</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Overload spends finite waiting headroom</text><text x="48" y="343" class="body">Fluid 240 in/s − 200 out/s = 40 jobs/s</text><text x="48" y="370" class="body">20-job headroom / 40 ≈ 0.5 s</text><text x="48" y="397" class="body">20 × 4096 = 81920 payload bytes</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Required barrier follows slowest user</text><text x="538" y="343" class="body">Required readiness times 2,2,12 ms</text><text x="538" y="370" class="body">All-ready barrier opens at max = 12 ms</text><text x="538" y="397" class="body">Do not assume a barrier for every consumer</text><text x="30" y="465" class="body">Finite maxima are not production quantiles; preserve chronology and per-class outcomes.</text><text x="30" y="492" class="body">Retain in-flight claims through cancellation and unknown completion; count other state separately.</text></svg>