<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Match entity, outcome and observation window</title><desc id="desc">Separate reference fixtures • exact area identity is distinct from steady-state estimation</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Match entity, outcome and observation window</text><text x="30" y="76" class="sub">Separate reference fixtures • exact area identity is distinct from steady-state estimation</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Repeat queue visits: choose the entity</text><text x="48" y="168" class="body">3 + 2 + 1 = 6 ms total wait in 10 ms</text><text x="48" y="195" class="body">100 requests/s × 6 ms = 0.6</text><text x="48" y="222" class="body">300 visits/s × 2 ms = 0.6</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Effective admitted rate: include outcomes</text><text x="538" y="168" class="body">800 admitted/s × 10 ms = 8 requests</text><text x="538" y="195" class="body">Success 4.8 + failure 2 + cancellation 1.2</text><text x="538" y="222" class="body">Offered 1000/s is a different population</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Window [5,15): clip each residence</text><text x="48" y="343" class="body">A 2→8; B 6→12; C 14→20 ms</text><text x="48" y="370" class="body">Clipped durations 3,6,1; area 10</text><text x="48" y="397" class="body">Mean occupancy 1; full-cohort product 1.2</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Window edges explain the discrepancy</text><text x="538" y="343" class="body">10 = 12 full + 3 carry-in − 5 carry-out</text><text x="538" y="370" class="body">Two entries / two exits; occupancy 1 at edges</text><text x="538" y="397" class="body">Balanced counts do not remove edge bias</text><text x="30" y="465" class="body">Preserve unfinished intervals, actual identities and the original observation window.</text><text x="30" y="492" class="body">Equal mean residence can coexist with very different tails; use separate evidence.</text></svg>