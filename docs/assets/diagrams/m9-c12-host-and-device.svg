<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Constructed overlapping host and device intervals</title><desc id="desc">A 77 microsecond request has admission zero to five, preparation five to fifteen, submissions fifteen to twenty three, host wait twenty three to seventy two and validation to seventy seven. Device upload twenty to thirty, kernels thirty to sixty five and download to seventy overlap the host intervals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Host waiting overlaps device progress; do not add both durations</text><text x="30" y="80" font-size="19">Constructed compatible axis in µs; one request, one ordered stream</text><path d="M230 120 L230 425" stroke="#d3dce6"/><text x="222" y="112" font-size="16">0</text><path d="M430 120 L430 425" stroke="#d3dce6"/><text x="422" y="112" font-size="16">20</text><path d="M530 120 L530 425" stroke="#d3dce6"/><text x="522" y="112" font-size="16">30</text><path d="M730 120 L730 425" stroke="#d3dce6"/><text x="722" y="112" font-size="16">50</text><path d="M880 120 L880 425" stroke="#d3dce6"/><text x="872" y="112" font-size="16">65</text><path d="M930 120 L930 425" stroke="#d3dce6"/><text x="922" y="112" font-size="16">70</text><path d="M1000 120 L1000 425" stroke="#d3dce6"/><text x="992" y="112" font-size="16">77</text><text x="1030" y="112" font-size="17">µs</text><text x="30" y="178" font-size="19">Host thread</text><text x="30" y="303" font-size="19">Device copies</text><text x="30" y="388" font-size="19">Device kernels</text><rect x="230" y="155" width="50" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="234" y="183" font-size="15">admit</text><rect x="280" y="155" width="100" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="284" y="183" font-size="17">prepare</text><rect x="380" y="155" width="80" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="384" y="183" font-size="15">APIs</text><rect x="460" y="155" width="490" height="45" fill="#fce1a9" stroke="#8c9eb0"/><text x="464" y="183" font-size="17">wait (49 µs)</text><rect x="950" y="155" width="50" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="954" y="183" font-size="15">check</text><rect x="430" y="280" width="100" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="434" y="308" font-size="17">upload</text><rect x="880" y="280" width="50" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="884" y="308" font-size="15">copy</text><rect x="530" y="365" width="200" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="534" y="393" font-size="17">A (20 µs)</text><rect x="730" y="365" width="150" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="734" y="393" font-size="17">B (15 µs)</text><text x="30" y="465" font-size="20">Device activity union: 50 µs. Kernel union: 35 µs. Publication: 77 µs.</text><text x="30" y="510" font-size="19">Host partition: 5 + 10 + 8 + 49 + 5 = 77 µs; wait is not all CPU compute.</text><text x="30" y="550" font-size="18">Blank lanes need coverage evidence; these invented timestamps are not a real trace.</text></g></svg>