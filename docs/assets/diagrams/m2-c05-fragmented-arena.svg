<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="750" viewBox="0 0 1060 750" role="img" aria-labelledby="title desc"><title id="title">External fragmentation in a bounded arena</title><desc id="desc">A and C are live four MiB spans. Free B and D leave eight MiB total but no six MiB span. Once C safely releases, adjacent holes coalesce into twelve MiB and a six MiB request can fit.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="750" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Free-space shape can prevent allocation</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">16 MiB arena; four equal spans; no remapping or compaction</text><rect x="30" y="125" width="240" height="100" rx="10" fill="#bfdbfe" stroke="#64748b"/><text x="58" y="166" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">A live</text><text x="58" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">4 MiB</text><rect x="280" y="125" width="240" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="308" y="166" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">B free</text><text x="308" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">4 MiB</text><rect x="530" y="125" width="240" height="100" rx="10" fill="#bfdbfe" stroke="#64748b"/><text x="558" y="166" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">C live</text><text x="558" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">4 MiB</text><rect x="780" y="125" width="240" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="808" y="166" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">D free</text><text x="808" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">4 MiB</text><text x="30" y="260" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">0</text><text x="280" y="260" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">4</text><text x="530" y="260" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">8</text><text x="780" y="260" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">12</text><text x="990" y="260" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">16 MiB</text><rect x="30" y="295" width="1000" height="100" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="50" y="333" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">E requests 6 MiB → fails</text><text x="50" y="374" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Total free = 8 MiB; largest eligible hole = 4 MiB</text><path d="M530,408 L530,450" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="488" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">After C’s readers finish and C is safely released:</text><rect x="30" y="520" width="240" height="100" rx="10" fill="#bfdbfe" stroke="#64748b"/><text x="55" y="560" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">A live</text><text x="55" y="599" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">4 MiB</text><rect x="280" y="520" width="750" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="310" y="560" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">One coalesced free span [4, 16)</text><text x="310" y="599" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">12 MiB → E’s 6 MiB request now fits</text><text x="30" y="669" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Coalescing joins adjacent free holes; it cannot cross live C.</text><text x="30" y="710" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Constructed allocator-visible arena; not a machine OOM prediction.</text></svg>