<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Constructed host and device timing boundaries</title><desc id="desc">Host preparation zero to ten, submission ten to eighteen, wait eighteen to fifty seven and validation to sixty two overlap device upload twenty to thirty, arithmetic thirty to fifty and download fifty to fifty five. Submission eight, arithmetic twenty, submit to wait return forty seven and full path sixty two microseconds answer different questions.</desc><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">One constructed operation; four different valid timing boundaries</text><text x="30" y="80" font-size="19">Illustrative compatible time axis in µs; no real GPU measurements</text><path d="M230 120 L230 425" stroke="#d3dce6"/><text x="223" y="112" font-size="16">0</text><path d="M350 120 L350 425" stroke="#d3dce6"/><text x="343" y="112" font-size="16">10</text><path d="M446 120 L446 425" stroke="#d3dce6"/><text x="439" y="112" font-size="16">18</text><path d="M590 120 L590 425" stroke="#d3dce6"/><text x="583" y="112" font-size="16">30</text><path d="M830 120 L830 425" stroke="#d3dce6"/><text x="823" y="112" font-size="16">50</text><path d="M914 120 L914 425" stroke="#d3dce6"/><text x="907" y="112" font-size="16">57</text><path d="M974 120 L974 425" stroke="#d3dce6"/><text x="967" y="112" font-size="16">62</text><text x="1010" y="112" font-size="17">µs</text><text x="30" y="180" font-size="18">Host thread</text><text x="30" y="305" font-size="18">Device copies</text><text x="30" y="390" font-size="18">Device arithmetic</text><rect x="230" y="155" width="120" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="234" y="183" font-size="16">prepare</text><rect x="350" y="155" width="96" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="354" y="183" font-size="16">submit</text><rect x="446" y="155" width="468" height="45" fill="#fce1a9" stroke="#8c9eb0"/><text x="450" y="183" font-size="16">wait (39 µs)</text><rect x="914" y="155" width="60" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="918" y="183" font-size="16">check</text><rect x="470" y="280" width="120" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="474" y="308" font-size="16">upload</text><rect x="830" y="280" width="60" height="45" fill="#dceaf8" stroke="#8c9eb0"/><text x="834" y="308" font-size="16">copy</text><rect x="590" y="365" width="240" height="45" fill="#cee8df" stroke="#8c9eb0"/><text x="594" y="393" font-size="13">start event → operation → stop event</text><text x="30" y="465" font-size="20">Submission: 8 µs. Event interval: 20 µs. Submit-to-wait-return: 47 µs.</text><text x="30" y="510" font-size="19">Full validated path: 62 µs = 10 + 8 + 39 + 5. Device work overlaps host time.</text><text x="30" y="550" font-size="19">47 − 20 = 27 µs mixes boundaries; it is not a pure launch-overhead measure.</text></g></svg>