<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">Inverse CDF intervals and shared versus request owned uniform streams</title><desc id="desc">Four intervals of length 0.4 0.3 0.2 and 0.1 map uniforms to token IDs zero through three. A shared uniform sequence assigns different tokens under AABB and ABAB schedules. Binding separate supplied streams to A and B preserves each request result under either schedule. These fixed-q test inputs are not PRNG measurements.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="690" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Uniform intervals and request-owned random state</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">q = [0.4, 0.3, 0.2, 0.1]; first cumulative mass strictly greater than u.</text><rect x="50" y="125" width="384.0" height="75" rx="10" fill="#bfdbfe" stroke="#64748b"/><text x="62" y="170" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">ID 0</text><rect x="434.0" y="125" width="288.0" height="75" rx="10" fill="#bbf7d0" stroke="#64748b"/><text x="446.0" y="170" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">ID 1</text><rect x="722.0" y="125" width="192.0" height="75" rx="10" fill="#fde68a" stroke="#64748b"/><text x="734.0" y="170" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">ID 2</text><rect x="914.0" y="125" width="96.0" height="75" rx="10" fill="#e9d5ff" stroke="#64748b"/><text x="926.0" y="170" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">ID 3</text><text x="40" y="232" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">0</text><text x="424" y="232" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">0.4</text><text x="712" y="232" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">0.7</text><text x="904" y="232" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">0.9</text><text x="1000" y="232" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">1</text><text x="30" y="278" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Example: u = 0.4 selects ID 1. A boundary belongs to the interval on its right.</text><rect x="30" y="325" width="1000" height="120" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="50" y="365" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Shared sequence: [0.1, 0.3, 0.8, 0.95]</text><text x="50" y="404" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">AABB → A [0, 0], B [2, 3]; ABAB → A [0, 2], B [0, 3]</text><rect x="30" y="480" width="1000" height="130" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="520" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Owned streams: A [0.1, 0.8]; B [0.3, 0.95]</text><text x="50" y="560" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Either schedule → A [0, 2], B [0, 3]</text><text x="50" y="592" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Fixed q; these are supplied uniforms, not measured PRNG output.</text><text x="30" y="658" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">A seed alone does not specify stream assignment, draw consumption or probability arithmetic.</text></svg>