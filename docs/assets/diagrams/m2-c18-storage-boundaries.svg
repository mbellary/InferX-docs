<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" role="img" aria-labelledby="title desc"><title id="title">Count retained fields and reconstruction space separately</title><desc id="desc">Toy FP64 representation counts; model weights, metadata and other workspace are separate</desc><rect width="1060" height="740" fill="#f8fafc"/>
<text x="30" y="45" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#142033">Count retained fields and reconstruction space separately</text>
<text x="30" y="86" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#142033">Toy FP64 representation counts; model weights, metadata and other workspace are separate</text>
<rect x="30" y="115" width="1000" height="112" rx="12" fill="#dbeafe" stroke="#8492a6"/>
<text x="50" y="148" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Latent c + one shared positional key r</text>
<text x="50" y="183" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">(2 + 2) × 8 = 32 bytes per token per layer.</text>
<text x="50" y="212" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Two layers, N = 5, B = 4: 320 valid bytes; 512 assigned bytes.</text>
<rect x="30" y="250" width="1000" height="112" rx="12" fill="#fef3c7" stroke="#8492a6"/>
<text x="50" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Expanded content K/V + one shared positional key</text>
<text x="50" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">[2 heads × (2 content + 2 value) + 2 position] × 8 = 80 bytes/row/layer.</text>
<text x="50" y="347" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Same two-layer fixture: 800 valid bytes; 1,280 assigned bytes.</text>
<rect x="30" y="385" width="1000" height="112" rx="12" fill="#dcfce7" stroke="#8492a6"/>
<text x="50" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Expanded keys with positional state copied per head</text>
<text x="50" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">2 heads × (2 content + 2 position + 2 value) × 8 = 96 bytes/row/layer.</text>
<text x="50" y="482" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Same fixture: 960 valid bytes; 1,536 assigned bytes.</text>
<rect x="30" y="520" width="1000" height="112" rx="12" fill="#ede9fe" stroke="#8492a6"/>
<text x="50" y="553" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Separate one-layer temporary-expansion experiment</text>
<text x="50" y="588" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Start with compressed 32N bytes; optional content K/V temporary adds 64N.</text>
<text x="50" y="617" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Compressed + expanded history = 96N bytes; other scratch is still additional.</text>
<text x="30" y="700" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Smaller retained payload is not proof of smaller total peak memory, lower latency or model equivalence.</text>
</svg>
