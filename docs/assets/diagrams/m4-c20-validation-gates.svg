<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Four independent gates before performance claims</title><desc id="desc">A plausible numerical result can still violate memory, epoch or ownership rules</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Four independent gates before performance claims</text><text x="30" y="76" class="sub">A plausible numerical result can still violate memory, epoch or ownership rules</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">1. Supported contract</text><text x="48" y="168" class="body">Shape / strides / dtype / finite range</text><text x="48" y="195" class="body">Masks, parameters and allowed overlap</text><text x="48" y="222" class="body">Reject or validated fallback before launch</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">2. Values and exact decisions</text><text x="538" y="168" class="body">Current stored-input reference</text><text x="538" y="195" class="body">Coordinate budgets for finite outputs</text><text x="538" y="222" class="body">Exact support / token ID / draw count</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">3. Safety and dependencies</text><text x="48" y="343" class="body">Bounds, initialization and synchronization</text><text x="48" y="370" class="body">Tool findings plus ordering/lifetime review</text><text x="48" y="397" class="body">Retain storage through every last user</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">4. Completed publication</text><text x="538" y="343" class="body">Match request, epoch and generation</text><text x="538" y="370" class="body">Discard cancelled or stale results</text><text x="538" y="397" class="body">Commit once; compare useful service</text><text x="30" y="465" class="body">Eager/reference, eager/fused, replay/reference and replay/fused need the same gates.</text><text x="30" y="492" class="body">Passing one gate cannot compensate for failing another.</text></svg>