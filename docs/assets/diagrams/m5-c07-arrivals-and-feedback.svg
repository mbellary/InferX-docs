<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Feedback changes arrivals even when service is identical</title><desc id="desc">Separate four-job serial model • 5 ms service per job • no hardware prediction</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Feedback changes arrivals even when service is identical</text><text x="30" y="76" class="sub">Separate four-job serial model • 5 ms service per job • no hardware prediction</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Open-loop demand is independent</text><text x="48" y="168" class="body">Arrivals 0,1,2,3 ms</text><text x="48" y="195" class="body">Completions 5,10,15,20 ms</text><text x="48" y="222" class="body">Waits 0,4,8,12; mean response 11 ms</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">One closed-loop client; think time 1 ms</text><text x="538" y="168" class="body">Arrivals 0,6,12,18 ms</text><text x="538" y="195" class="body">Completions 5,11,17,23 ms</text><text x="538" y="222" class="body">Zero waits; response time 5 ms</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Preserve intended versus actual dispatch</text><text x="48" y="343" class="body">Eight-row lags 0,0,3,3,0,1,1,2 ms</text><text x="48" y="370" class="body">Mean lag 1.25 ms; maximum 3 ms</text><text x="48" y="397" class="body">A concurrency throttle changes dispatch</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">No request disappears from the ledger</text><text x="538" y="343" class="body">Unsent / late / rejected / failed / cancelled</text><text x="538" y="370" class="body">Report unfinished and useful output too</text><text x="538" y="397" class="body">Freeze seed algorithm and actual trace</text><text x="30" y="465" class="body">Lower response time under feedback does not establish a faster server.</text><text x="30" y="492" class="body">Choose the arrival window and drain endpoint separately; report both denominators.</text></svg>