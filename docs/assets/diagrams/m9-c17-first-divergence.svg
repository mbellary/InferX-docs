<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" role="img" aria-labelledby="title desc"><title id="title">First divergence and conditional local replay of the fixed model</title><desc id="desc">Model stages embedding block zero block one final normalization and head are compared against original full-path references. A deliberately perturbed first-block output fails its own budget. Local replay on the captured input distinguishes inherited error from local error without repairing the failed complete path. Trace overhead is outside timing comparisons.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="700" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Locate the first observable contract violation</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Fixed two-block model; captured inputs retain request, position and weight identities.</text><rect x="30" y="125" width="235" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="45" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Embedding</text><text x="45" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Original input</text><path d="M269,175 L281,175" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="285" y="125" width="235" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="300" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Block 0 → H₁</text><text x="300" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Error ≤ 10⁻⁹</text><path d="M524,175 L536,175" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="540" y="125" width="235" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="555" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Block 1 → H₂</text><text x="555" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Error ≤ 10⁻⁸</text><path d="M779,175 L791,175" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="795" y="125" width="235" height="100" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="810" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Norm + head</text><text x="810" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Error ≤ 10⁻⁶</text><rect x="30" y="280" width="1000" height="115" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="50" y="320" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Diagnostic variant: add 0.0001 to H₁[request 0, position 0, feature 0]</text><text x="50" y="361" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Earlier stages unchanged; the H₁ boundary fails by 100,000 times its limit.</text><rect x="30" y="440" width="480" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="478" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Full-path acceptance</text><text x="50" y="518" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Compare with original references.</text><text x="50" y="555" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">The injected path remains failed.</text><rect x="540" y="440" width="490" height="140" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="560" y="478" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Local diagnostic replay</text><text x="560" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Evaluate block 1 on captured H₁.</text><text x="560" y="555" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Separate inherited and local errors.</text><text x="30" y="627" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Tracing may copy, allocate and synchronize. Keep it separate from latency comparisons.</text><text x="30" y="667" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">An opaque kernel limits what can be observed; do not invent hidden stage evidence.</text></svg>