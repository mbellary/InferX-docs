<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">A two-producer dependency join</title><desc id="desc">A and B form one branch; C and D form another. E waits for B and D. F follows E. Durations are invented, not observed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526d82"/></marker></defs><rect width="1100" height="540" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">Two independent producers must both reach the join</text><text x="30" y="72" font-size="19">Constructed durations in microseconds; dependency bound only</text><rect x="30" y="120" width="210" height="80" rx="9" fill="#dceaf8" stroke="#8c9eb0"/><text x="44" y="148" font-size="20">A: first H2D</text><text x="44" y="174" font-size="17">4 µs; finish 4</text><rect x="300" y="120" width="235" height="80" rx="9" fill="#dceaf8" stroke="#8c9eb0"/><text x="314" y="148" font-size="20">B: transform</text><text x="314" y="174" font-size="17">7 µs; finish 11</text><rect x="30" y="280" width="210" height="80" rx="9" fill="#dceaf8" stroke="#8c9eb0"/><text x="44" y="308" font-size="20">C: second H2D</text><text x="44" y="334" font-size="17">3 µs; finish 3</text><rect x="300" y="280" width="235" height="80" rx="9" fill="#dceaf8" stroke="#8c9eb0"/><text x="314" y="308" font-size="20">D: transform</text><text x="314" y="334" font-size="17">5 µs; finish 8</text><rect x="655" y="200" width="180" height="80" rx="9" fill="#fce1a9" stroke="#8c9eb0"/><text x="669" y="228" font-size="20">E: merge</text><text x="669" y="254" font-size="17">2 µs; finish 13</text><rect x="880" y="200" width="190" height="80" rx="9" fill="#cee8df" stroke="#8c9eb0"/><text x="894" y="228" font-size="20">F: result D2H</text><text x="894" y="254" font-size="17">4 µs; finish 17</text><path d="M240,160 L298,160" fill="none" stroke="#526d82" stroke-width="2" marker-end="url(#a)"/><path d="M240,320 L298,320" fill="none" stroke="#526d82" stroke-width="2" marker-end="url(#a)"/><path d="M535,160 L653,222" fill="none" stroke="#526d82" stroke-width="2" marker-end="url(#a)"/><path d="M535,320 L653,260" fill="none" stroke="#526d82" stroke-width="2" marker-end="url(#a)"/><path d="M835,240 L878,240" fill="none" stroke="#526d82" stroke-width="2" marker-end="url(#a)"/><text x="548" y="130" font-size="16">record / wait</text><text x="548" y="350" font-size="16">record / wait</text><text x="30" y="420" font-size="21">Critical path: A → B → E → F = 17 µs. Fully serial work = 25 µs.</text><text x="30" y="460" font-size="19">The graph permits independence; shared resources can still serialize execution.</text><text x="30" y="498" font-size="19">A marker after B alone cannot certify D, the merge or the final result copy.</text></g></svg>