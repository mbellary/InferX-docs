<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Readiness join and evidence required for attribution</title><desc id="desc">A branch ready at fifty microseconds and another at sixty feed a common consumer. Improving the first to forty five does not change the sixty microsecond join. Improving the second to fifty five changes readiness to fifty five if no other constraints intervene.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Follow required predecessors before attributing a scheduling gap</text><text x="30" y="82" font-size="18">Separate constructed join; all other release and resource conditions assumed ready</text><rect x="30" y="125" width="320" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="154" font-size="19">Branch A ready at 50 µs</text><text x="42" y="182" font-size="17">Improving to 45 leaves join at 60</text><rect x="30" y="270" width="320" height="90" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="42" y="299" font-size="19">Branch X ready at 60 µs</text><text x="42" y="327" font-size="17">Improving to 55 moves join to 55</text><rect x="440" y="195" width="290" height="100" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="452" y="224" font-size="19">B requires A and X</text><text x="452" y="252" font-size="17">Readiness = max(50,60) = 60</text><path d="M350 170 L435 230" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M350 315 L435 260" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730 245 L785 245" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="790" y="195" width="280" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="802" y="224" font-size="19">Before calling it causal</text><text x="802" y="252" font-size="17">Check IDs, edges and coverage</text><text x="30" y="425" font-size="21">Do not infer a dependency from two nearby timestamps alone.</text><text x="30" y="470" font-size="19">Unknown resource constraints can invalidate the simplified readiness prediction.</text><text x="30" y="515" font-size="19">Verify one intervention with equivalent correct work and useful completion.</text><text x="30" y="555" font-size="18">A missing endpoint is incomplete evidence, not zero work or permission to reuse.</text></g></svg>