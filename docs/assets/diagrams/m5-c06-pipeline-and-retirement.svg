<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Independent overlap requires disjoint retained state</title><desc id="desc">Separate constructed pipeline and retirement fixtures • no measured serving speedup</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Independent overlap requires disjoint retained state</text><text x="30" y="76" class="sub">Separate constructed pipeline and retirement fixtures • no measured serving speedup</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Three independent requests, one device stream</text><text x="48" y="168" class="body">Prepare A 0–2; B 2–4; C 4–6</text><text x="48" y="195" class="body">Device A 2–10; B 10–18; C 18–26</text><text x="48" y="222" class="body">Reconcile 10–11,18–19,26–27</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Conditional pipeline arithmetic</text><text x="538" y="168" class="body">Serial 3 × (2 + 8 + 1) = 33 µs</text><text x="538" y="195" class="body">Pipeline drains 27 µs; ratio ≈ 1.22</text><text x="538" y="222" class="body">3 × 4096 = 12288 workspace bytes</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Earlier trace: completed access is not reuse</text><text x="48" y="343" class="body">Device final access 14; commit 19</text><text x="48" y="370" class="body">Bindings detached 20; last reader 23</text><text x="48" y="397" class="body">Earliest authorized reuse = 23 µs</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Cancellation does not erase submitted users</text><text x="538" y="343" class="body">Cleanup authority survives dropped task</text><text x="538" y="370" class="body">Unknown completion retains device claim</text><text x="538" y="397" class="body">Stale / duplicate results cannot release twice</text><text x="30" y="465" class="body">The pipeline device remains serial; dependent tokens of one request cannot run ahead.</text><text x="30" y="492" class="body">A full slot/status budget blocks admission; idle queues do not establish complete drain.</text></svg>