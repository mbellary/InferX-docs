<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A larger numerator cannot override failed service gates</title><desc id="desc">Independent ten-second rejection, length-class and offered-load references</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">A larger numerator cannot override failed service gates</text><text x="30" y="76" class="sub">Independent ten-second rejection, length-class and offered-load references</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Admission can hide lost service</text><text x="48" y="168" class="body">P: 20/20 admitted useful; 20/100 offered</text><text x="48" y="195" class="body">Q: 81/90 admitted useful; 81/100 offered</text><text x="48" y="222" class="body">Conditional 100% vs 90%; offered 20% vs 81%</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Request and token weighting differ</text><text x="538" y="168" class="body">X and Y: nine useful requests per second</text><text x="538" y="195" class="body">X: 18 useful IDs/s; Y: 116 useful IDs/s</text><text x="538" y="222" class="body">Check short and long class coverage too</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Load cells under a 98% objective</text><text x="48" y="343" class="body">50/s → 99%; 80/s → 98% attainment</text><text x="48" y="370" class="body">100/s → 93%; 120/s → 80%: both fail</text><text x="48" y="397" class="body">80/s is only the highest tested candidate</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Unknowns and recovery remain real</text><text x="538" y="343" class="body">96 pass + 2 fail + 2 unknown = 100</text><text x="538" y="370" class="body">Logical possible attainment: 96%–98%</text><text x="538" y="397" class="body">No certification or reuse without evidence</text><text x="30" y="465" class="body">Require joint acceptance, class coverage, quality, bounded resources and recovery.</text><text x="30" y="492" class="body">Repeated sessions and uncertainty are needed; zero endpoint backlog alone proves little.</text></svg>