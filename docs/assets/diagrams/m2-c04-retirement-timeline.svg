<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Cancellation completion and safe pool return</title><desc id="desc">A device reader begins at zero milliseconds. Cancellation at three closes new use but retains sixty four KiB. Completion is observed at nine; safe return occurs at ten and reuse at eleven. Seven milliseconds retention consumes four hundred forty eight KiB milliseconds of state area.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Cancellation closes new use; completion permits safe return</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Constructed host observation times; slot 0 has 64 KiB of payload.</text><rect x="30" y="120" width="1000" height="120" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="160" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">0 ms: active device reader; requests R and S fill the pool</text><text x="50" y="201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Active 128 KiB; retiring 0; free 0</text><text x="50" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Backing pool payload stays 128 KiB throughout.</text><rect x="30" y="280" width="1000" height="125" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="321" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">3 ms: R cancelled → retiring; no new users</text><text x="50" y="363" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">9 ms: last required reader completion observed</text><text x="50" y="396" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Active 64 KiB; retiring 64 KiB; free 0 until final return</text><rect x="30" y="445" width="1000" height="125" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="486" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">10 ms: safe return once → free 64 KiB</text><text x="50" y="528" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">11 ms: T receives slot 0 with a new generation</text><text x="50" y="561" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Active 128 KiB; retiring 0; free 0 after reuse</text><rect x="30" y="610" width="1000" height="90" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="648" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Retirement residence: 10 − 3 = 7 ms</text><text x="50" y="685" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Retained-state area: 64 KiB × 7 ms = 448 KiB·ms</text></svg>