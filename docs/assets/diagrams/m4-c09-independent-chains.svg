<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Accumulator parallelism and the mandatory join</title><desc id="desc">One chain has depth eight additions; four two-addition chains plus a two-level join have depth four additions under idealized assumptions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1000" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="40" font-size="28" fill="#0f172a">Independent chains need a final join</text><text x="30" y="75" font-size="20" fill="#0f172a">Eight product additions; each addition has a stipulated latency of 4 units</text><rect x="30" y="100" width="940" height="83" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="50" y="132" font-size="22" fill="#0f172a">One accumulator: 8 dependent additions</text><text x="50" y="163" font-size="21" fill="#0f172a">Dependency depth = 8 × 4 = 32 time units</text><rect x="30" y="215" width="220" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="44" y="247" font-size="20" fill="#0f172a">Chain 0: 2 additions</text><text x="44" y="278" font-size="20" fill="#0f172a">Depth: 8 units</text><path d="M140 300 L140 323 L500 323 L500 346" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="215" width="220" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="284" y="247" font-size="20" fill="#0f172a">Chain 1: 2 additions</text><text x="284" y="278" font-size="20" fill="#0f172a">Depth: 8 units</text><path d="M380 300 L380 323 L500 323 L500 346" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="215" width="220" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="524" y="247" font-size="20" fill="#0f172a">Chain 2: 2 additions</text><text x="524" y="278" font-size="20" fill="#0f172a">Depth: 8 units</text><path d="M620 300 L620 323 L500 323 L500 346" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="215" width="220" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="764" y="247" font-size="20" fill="#0f172a">Chain 3: 2 additions</text><text x="764" y="278" font-size="20" fill="#0f172a">Depth: 8 units</text><path d="M860 300 L860 323 L500 323 L500 346" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="350" width="560" height="76" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="242" y="380" font-size="20" fill="#0f172a">Two-level final sum: 2 more additions deep</text><text x="242" y="410" font-size="20" fill="#0f172a">Total critical depth = (2 + 2) × 4 = 16 units</text><text x="30" y="462" font-size="20" fill="#0f172a">More simultaneous state; issue limits, loads and allocation are omitted.</text><text x="30" y="491" font-size="20" fill="#0f172a">A dependency-depth model is not a measured kernel speedup.</text></g></svg>