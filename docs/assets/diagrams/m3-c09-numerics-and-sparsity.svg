<text x="442" y="255" font-family="sans-serif" font-size="19" fill="#263d53">0</text>
<rect x="30" y="180" width="224" height="92" fill="none" stroke="#16496d" stroke-width="2"/>
<rect x="254" y="180" width="224" height="92" fill="none" stroke="#16496d" stroke-width="2"/>
<text x="520" y="201" font-family="sans-serif" font-size="19" fill="#263d53">B[k,0] = k + 1; B[k,1] = 1</text>
<text x="520" y="235" font-family="sans-serif" font-size="21" fill="#16496d">D rows: [57, 10] and [125, 26]</text>
<text x="30" y="316" font-family="sans-serif" font-size="19" fill="#263d53">Store retained values AND their positions; metadata is part of the representation.</text>
<text x="30" y="353" font-family="sans-serif" font-size="19" fill="#263d53">[1, 2, 3, 4 | 0, 0, 0, 0] has 50% zeros but fails this per-quartet pattern.</text>
<text x="30" y="397" font-family="sans-serif" font-size="19" fill="#263d53">Pruning [1, 2, 3, 4] to [0, 0, 3, 4] changes its dot with ones from 10 to 7.</text>
<text x="30" y="451" font-family="sans-serif" font-size="20" fill="#152c49">Exact reconstruction preserves A. Pruning nonzero values changes the operation.</text>
<text x="30" y="500" font-family="sans-serif" font-size="18" fill="#263d53">Teaching references only: tiny sparse dimensions do not establish GPU library eligibility.</text>
