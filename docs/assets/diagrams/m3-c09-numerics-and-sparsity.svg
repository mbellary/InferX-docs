<text x="274" y="255" font-family="sans-serif" font-size="19" fill="#263d53">7</text>
<rect x="310" y="226" width="55" height="45" fill="#e5e9ef" stroke="#a3b3c4"/>
<text x="330" y="255" font-family="sans-serif" font-size="19" fill="#263d53">0</text>
