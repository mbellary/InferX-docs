<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img">
<title>Stored-input loss and structured sparse identity need separate references</title>
<rect width="1100" height="540" fill="#f4f7fb"/>
<text x="30" y="38" font-family="sans-serif" font-size="24" fill="#152c49">Representation changes and execution errors require different checks</text>
<text x="30" y="79" font-family="sans-serif" font-size="20" fill="#263d53">Original dot: [1 + 2⁻¹², 1] · [1, −1] = 2⁻¹².</text>
<text x="30" y="111" font-family="sans-serif" font-size="19" fill="#263d53">FP16 rounded inputs: [1, 1] · [1, −1] = 0. FP32 accumulation cannot recover the lost bits.</text>
<text x="30" y="157" font-family="sans-serif" font-size="20" fill="#16496d">Exact sparse A: each outlined quartet retains two nonzero values</text>
<rect x="30" y="180" width="55" height="45" fill="#cfe8e0" stroke="#a3b3c4"/>
<text x="50" y="209" font-family="sans-serif" font-size="19" fill="#263d53">1</text>
