<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Keep identity, outcomes and final users separate</title><desc id="desc">Constructed ten-attempt cohort and a separate one-request lifecycle</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Keep identity, outcomes and final users separate</text><text x="30" y="76" class="sub">Constructed ten-attempt cohort and a separate one-request lifecycle</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Disjoint delivery evidence</text><text x="48" y="168" class="body">10 intended = 1 unsent + 1 no-receipt</text><text x="48" y="195" class="body">+ 1 receipt unknown + 7 known received</text><text x="48" y="222" class="body">9 dispatched; 5 admitted; C unresolved</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Compare identities, not just totals</text><text x="538" y="168" class="body">Duplicate G: 8 events, 7 unique receipts</text><text x="538" y="195" class="body">D,E,F,G,G,I,J: 7 records but missing H</text><text x="538" y="222" class="body">Only G client success; G/H server success</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Separate one-request lifecycle</text><text x="48" y="343" class="body">Client timeout 50 ms; device done 60</text><text x="48" y="370" class="body">Server success 70; final reader done 90</text><text x="48" y="397" class="body">At cutoff 80, reuse is still forbidden</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Drain requires surviving evidence</text><text x="538" y="343" class="body">Stop issuance; reconcile every attempt</text><text x="538" y="370" class="body">Track late results and final physical users</text><text x="538" y="397" class="body">Unknown delivery is not proven loss/drain</text><text x="30" y="465" class="body">Do not add a client timeout as another outcome in the server terminal partition.</text><text x="30" y="492" class="body">A fixed sleep or an empty client task list does not establish physical retirement.</text></svg>