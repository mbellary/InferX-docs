<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" role="img" aria-labelledby="title desc"><title id="title">Censored request outcomes and an interval for median run level differences</title><desc id="desc">A constructed ten request cohort has eight observed completions by eight milliseconds and two still running after twenty milliseconds; original cohort p99 exceeds twenty and is unknown. Seven hypothetical run level p99 differences have median one microsecond and minimum maximum interval minus four to five including zero. Its independent continuous run coverage is 63 over 64 and its target is not a pooled request percentile.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="740" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Preserve unknown times and the target of an interval</text><rect x="30" y="85" width="1000" height="215" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="123" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Ten requests start at time 0; observation ends at 20 ms.</text><text x="50" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Eight complete at 1, 2, 3, 4, 5, 6, 7, 8 ms.</text><text x="50" y="207" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Two are still running: their completion times exceed 20 ms.</text><text x="50" y="250" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Completed-only p99 = 8 ms. Original-cohort p99 &gt; 20 ms.</text><text x="50" y="282" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Do not replace unknown completions with exact values of 20 ms.</text><rect x="30" y="340" width="1000" height="290" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="379" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Seven constructed run-level p99 differences (µs)</text><text x="50" y="418" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">[−4, −1, 0, 1, 2, 3, 5]; positive values favor candidate.</text><path d="M160,510 L925,510" stroke="#334155" stroke-width="3"/><path d="M160,492 L160,528 M925,492 L925,528" stroke="#334155" stroke-width="3"/><path d="M500,460 L500,553" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><circle cx="585" cy="510" r="8" fill="#2563eb"/><text x="143" y="560" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">−4</text><text x="491" y="582" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">0</text><text x="567" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">1: median</text><text x="917" y="560" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">5</text><text x="50" y="613" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Min–max interval [−4, 5] includes zero: no established positive median effect.</text><text x="30" y="674" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Under independent continuous runs, coverage is 63/64 = 98.4375%.</text><text x="30" y="711" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">The target is the median of run-level p99 differences, not a pooled request p99.</text></svg>