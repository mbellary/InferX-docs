<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="695" viewBox="0 0 1060 695" role="img" aria-labelledby="title desc"><title id="title">Partial tail normalization counterexamples</title><desc id="desc">Correct five row attention yields two and four. Including zero padded invalid rows yields 1.25 and 2.5. Averaging separately normalized block outputs yields 2.75 and 5.5. Uniform score block summaries merge with weights four fifths and one fifth.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="695" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">One normalization spans every eligible key</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Five valid zero scores; V at position p = [p, 2p]</text><rect x="30" y="120" width="1000" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="160" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Correct: five weights of 1/5</text><text x="50" y="202" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">Sum V = [10, 20]; output = [10, 20] / 5 = [2, 4]</text><rect x="30" y="275" width="1000" height="125" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="50" y="315" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Wrong: include three zero-valued tail rows</text><text x="50" y="357" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">Eight weights of 1/8 → [10, 20] / 8 = [1.25, 2.5]</text><text x="50" y="389" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Zero padding changes the denominator even when its numerator is zero.</text><rect x="30" y="435" width="1000" height="125" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="475" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Wrong: normalize each block and average outputs</text><text x="50" y="517" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">([1.5, 3] + [4, 8]) / 2 = [2.75, 5.5]</text><text x="50" y="549" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">The one-row tail must not receive the same weight as four valid rows.</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Uniform-score merge: sums S = 4 + 1 = 5; U = [6,12] + [4,8].</text><text x="30" y="651" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">General scores require consistent maxima and exponential-sum weights.</text></svg>