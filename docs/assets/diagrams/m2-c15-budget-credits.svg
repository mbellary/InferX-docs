<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" role="img" aria-labelledby="title desc"><title id="title">Free storage can already be committed to future growth</title><desc id="desc">C = 12 slots; B = 4 positions; 512 bytes/slot; 6,144 backing payload bytes</desc><rect width="1060" height="740" fill="#f8fafc"/>
<text x="30" y="45" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#142033">Free storage can already be committed to future growth</text>
<text x="30" y="86" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#142033">C = 12 slots; B = 4 positions; 512 bytes/slot; 6,144 backing payload bytes</text>
<rect x="30" y="115" width="1000" height="112" rx="12" fill="#dbeafe" stroke="#8492a6"/>
<text x="50" y="148" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Occupied O = 4 slots</text>
<text x="50" y="183" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Active, retained or retiring payload is not available for a new promise.</text>
<text x="50" y="212" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Only completed safe returns remove occupancy.</text>
<rect x="30" y="250" width="1000" height="112" rx="12" fill="#fef3c7" stroke="#8492a6"/>
<text x="50" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Growth reservations R = 3 slots</text>
<text x="50" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Physically free, but already promised to admitted requests.</text>
<text x="50" y="347" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Converting a credit into an occupied slot keeps U unchanged.</text>
<rect x="30" y="385" width="1000" height="112" rx="12" fill="#dcfce7" stroke="#8492a6"/>
<text x="50" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Headroom H = 2 slots</text>
<text x="50" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Physically free, withheld from ordinary admission by explicit policy.</text>
<text x="50" y="482" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">This is not tail slack, workspace or a second charge for the same slots.</text>
<rect x="30" y="520" width="1000" height="112" rx="12" fill="#ede9fe" stroke="#8492a6"/>
<text x="50" y="553" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Uncommitted U = 3 slots</text>
<text x="50" y="588" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">F = R + H + U = 8 physically free slots; only 3 can back a new request.</text>
<text x="50" y="617" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">After A reserves 2 and allocates its prompt: O = 6, R = 3, H = 2, U = 1.</text>
<text x="30" y="700" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Invariant: C = O + R + H + U. Credits promise capacity; they are not initialized KV payload.</text>
</svg>
