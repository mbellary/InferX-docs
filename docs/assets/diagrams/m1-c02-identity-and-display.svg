<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 535" role="img" aria-labelledby="title desc"><title id="title">Identity and incremental display</title><desc id="desc">Different toy ID sequences yield identical text. Constructed byte pieces C3 and A9 must combine before displaying e acute.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="535" fill="white"/><text x="440" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">Display equality does not establish token identity</text><rect x="25" y="65" width="320" height="70" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="185.0" y="106.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">IDs [6, 3, 4, 5]</text><rect x="25" y="170" width="320" height="70" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="185.0" y="211.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">IDs [1, 2, 3, 4, 5]</text><rect x="535" y="110" width="320" height="85" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="695.0" y="146.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Same visible text</text><text x="695.0" y="171.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">BID 100.25</text><path d="M345 100 H430 V135 H535" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M345 205 H430 V175 H535" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><text x="440" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Re-encoding the displayed text selects the canonical toy IDs.</text><text x="440" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172b4d">Byte pieces require state across display boundaries</text><rect x="25" y="370" width="210" height="90" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="130.0" y="408.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">First piece: C3</text><text x="130.0" y="433.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Wait; no character yet</text><rect x="335" y="370" width="210" height="90" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="440.0" y="408.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Next piece: A9</text><text x="440.0" y="433.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Combine C3 A9</text><rect x="645" y="370" width="210" height="90" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="750.0" y="408.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Visible text: é</text><text x="750.0" y="433.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Original IDs retained</text><path d="M235 415 H335" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M545 415 H645" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><text x="440" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Constructed teaching examples; these are not actual checkpoint token IDs.</text></svg>