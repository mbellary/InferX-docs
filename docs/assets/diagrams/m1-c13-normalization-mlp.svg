<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="675" viewBox="0 0 1060 675" role="img" aria-labelledby="title desc"><title id="title">Feature normalization and standard versus gated MLP</title><desc id="desc">LayerNorm and RMSNorm differ on one vector. Standard MLP has one up projection, activation and down projection. Gated MLP has two input projections whose activated gate and up features multiply before the down projection.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="675" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Normalize features; then choose the specified MLP</text><rect x="30" y="80" width="1000" height="150" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="117" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">At each (request, position), reduce D features independently.</text><text x="50" y="154" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">x = [1, 3], ε = 1, unit scale and zero LayerNorm offset:</text><text x="50" y="196" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">LayerNorm: [−1/√2, 1/√2]  |  RMSNorm: [1/√6, 3/√6]</text><rect x="30" y="270" width="470" height="310" rx="10" fill="#dcfce7" stroke="#64748b"/><rect x="530" y="270" width="500" height="310" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="310" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Standard MLP: two matrices</text><text x="50" y="353" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">z of width D</text><path d="M190,347 L270,347" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="285" y="353" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">zW_up: F</text><text x="50" y="413" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Activation φ, then W_down</text><text x="50" y="459" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Output width D for residual addition</text><text x="50" y="509" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">ReLU example: [1, −1, 3]</text><text x="50" y="549" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">→ [1, 0, 3] → [4, −3]</text><text x="550" y="310" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Gated MLP: three matrices</text><text x="550" y="357" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">g = zW_gate: F</text><text x="550" y="400" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">u = zW_up: F</text><path d="M765,354 L808,432" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M765,399 L808,432" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="545" y="431" width="465" height="55" rx="8" fill="#ffffff" stroke="#64748b"/><text x="550" y="464" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">h = φ(g) ⊙ u: F</text><text x="550" y="510" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Then hW_down: width D</text><text x="550" y="551" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Two branches; matching feature order</text><text x="30" y="637" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Changing norm, activation or gate changes the reference model; equal shapes are insufficient.</text></svg>