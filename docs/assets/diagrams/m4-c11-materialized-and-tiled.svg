<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Materialized attention and tiled output-only attention</title><desc id="desc">The baseline writes full scores and probabilities. The tiled path immediately consumes fragments with a row summary and publishes O after complete membership.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1000" height="580" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="40" font-size="28">Same attention output; different intermediate storage</text><text x="30" y="85" font-size="24">Materialized baseline</text><text x="520" y="85" font-size="24">Conceptual query-owned tile</text><rect x="30" y="110" width="450" height="94" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="48" y="145" font-size="22">QK → full score tensor S</text><text x="48" y="182" font-size="20">S has L × N entries</text><path d="M255.0 204 L255.0 235" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="235" width="450" height="94" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="48" y="270" font-size="22">Softmax → full probability tensor P</text><text x="48" y="307" font-size="20">P has L × N entries</text><path d="M255.0 329 L255.0 360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="360" width="450" height="94" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="48" y="395" font-size="22">PV → required output O</text><text x="48" y="432" font-size="20">Both S and P retained in this ledger</text><rect x="520" y="110" width="450" height="94" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="538" y="145" font-size="22">Q tile × K tile → local scores</text><text x="538" y="182" font-size="20">Br × Bc score fragment</text><path d="M745.0 204 L745.0 235" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="235" width="450" height="94" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="538" y="270" font-size="22">Scores + V tile → row state m, l, u</text><text x="538" y="307" font-size="20">Consume each eligible key once</text><path d="M745.0 329 L745.0 360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="360" width="450" height="94" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="538" y="395" font-size="22">Complete membership → O = u / l</text><text x="538" y="432" font-size="20">Publish only after all required tiles</text><text x="30" y="494" font-size="21">Full S/P allocations and handoffs</text><text x="520" y="494" font-size="21">No full S/P; bounded local working state</text><text x="30" y="541" font-size="22">O-only contract. Repeated input reads, scratch and resource costs still matter.</text></g></svg>