<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" role="img" aria-labelledby="title desc"><title id="title">Embedding lookup and affine projection</title><desc id="desc">Two requests of three IDs select three-feature rows and a shared affine map produces two features per position. The example at request zero position one maps ID two to zero two one and then to two five.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="580" fill="#f8fafc"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Select a row, then combine its features</text><text x="30" y="74" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Fixed toy weights • all base positions valid • no position or context mixing</text><rect x="30" y="110" width="245" height="340" rx="12" fill="#e0f2fe" stroke="#64748b"/><rect x="380" y="110" width="270" height="340" rx="12" fill="#dcfce7" stroke="#64748b"/><rect x="755" y="110" width="275" height="340" rx="12" fill="#fef3c7" stroke="#64748b"/><text x="50" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">IDs I: (2, 3)</text><text x="50" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Request 0: [1, 2, 1]</text><text x="50" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Request 1: [4, 0, 3]</text><text x="50" y="292" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">E has shape (6, 3)</text><text x="50" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">ID 2 selects E[2, :]</text><text x="50" y="388" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">[0, 2, 1]</text><text x="400" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Lookup X: (2, 3, 3)</text><text x="400" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">At position (0, 1):</text><text x="400" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">x = [0, 2, 1]</text><text x="400" y="292" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">W: (3, 2)</text><text x="400" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">a = [1, −2]</text><text x="400" y="388" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">T(x) = xW + a</text><text x="775" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Output Y: (2, 3, 2)</text><text x="775" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">At position (0, 1):</text><text x="775" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">y = [2, 5]</text><text x="775" y="292" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Same b = 0, s = 1</text><text x="775" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">New feature width: 2</text><text x="775" y="388" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">No other token read</text><path d="M282,275 L367,275" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="290" y="250" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">gather</text><path d="M657,275 L742,275" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="666" y="250" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">project</text><text x="30" y="500" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Repeated ID 1 → repeated raw X row → repeated Y row in this isolated path.</text><text x="30" y="540" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Lookup selects table features. Projection forms weighted sums of those features.</text></svg>