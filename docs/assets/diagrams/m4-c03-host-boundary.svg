<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Host ownership through device completion</title><desc id="desc">Three stages show host descriptors, reviewed bridge admission, and completion before resource reclamation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="35" y="45" fill="#172b42" font-family="Arial, sans-serif" font-size="26" font-weight="700">The bridge must establish admission and completion</text><rect x="35" y="130" width="290" height="220" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="50" y="170" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Rust owner</text><text x="50" y="217" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Allocation + generation</text><text x="50" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Capacity, dtype, shape</text><text x="50" y="303" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Device and dependency</text><rect x="375" y="130" width="290" height="220" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="390" y="170" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Reviewed bridge</text><text x="390" y="217" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Validate descriptor</text><text x="390" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Select compatible variant</text><text x="390" y="303" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Submit ordered work</text><rect x="715" y="130" width="290" height="220" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="730" y="170" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Device completion</text><text x="730" y="217" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Retain live resources</text><text x="730" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Observe terminal evidence</text><text x="730" y="303" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Then permit reclamation</text><path d="M325 245 L370 245" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M665 245 L710 245" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="405" width="970" height="155" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="55" y="445" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Submission ≠ completion; cancellation ≠ safe reuse.</text><text x="55" y="489" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Reject stale generation, wrong context, bad ranges or missing variants.</text><text x="55" y="532" fill="#172b42" font-family="Arial, sans-serif" font-size="20">A documented recovery contract must settle device errors before reuse.</text></svg>