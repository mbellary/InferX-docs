<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Protect meaning, publication and the transition into waiting</title><desc id="desc">Contracts for text-generation serving • no implementation or measured performance</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Protect meaning, publication and the transition into waiting</text><text x="30" y="76" class="sub">Contracts for text-generation serving • no implementation or measured performance</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Access and ownership differ</text><text x="48" y="168" class="body">Readers coexist; conflicting writers exclude</text><text x="48" y="195" class="body">Arc shares ownership, not arbitrary mutation</text><text x="48" y="222" class="body">Host access rules do not finish device work</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">One coherent protected transition</text><text x="538" y="168" class="body">Validate identity, admission and generation</text><text x="538" y="195" class="body">Update edge and mapping consistently</text><text x="538" y="222" class="body">A counter alone is not the whole invariant</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Publication needs a defined observation</text><text x="48" y="343" class="body">Initialize immutable descriptor → release</text><text x="48" y="370" class="body">Acquire observes intended publication</text><text x="48" y="397" class="body">Retain lifetime; do not reuse a stale flag</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Wait on state, not a remembered notification</text><text x="538" y="343" class="body">Inspect predicate under its mutex</text><text x="538" y="370" class="body">Coordinated release and wait enrollment</text><text x="538" y="397" class="body">Wake / timeout → recheck predicate</text><text x="30" y="465" class="body">Broken gap: check empty → producer publishes/notifies → consumer sleeps too late.</text><text x="30" y="492" class="body">Shutdown belongs to the predicate; notification is a hint to reconsider protected state.</text></svg>