<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Controls and workload mix change the interpretation</title><desc id="desc">Constructed costs only — no measured GPU or generator results</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Controls and workload mix change the interpretation</text><text x="30" y="76" class="sub">Constructed costs only — no measured GPU or generator results</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Ablation: time in microseconds</text><text x="48" y="168" class="body">Neither: 100       Fusion only: 80</text><text x="48" y="195" class="body">Replay only: 70    Both: 68</text><text x="48" y="222" class="body">Interaction: 68 − 80 − 70 + 100 = 18</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Two protected workload strata</text><text x="538" y="168" class="body">A: baseline 20 → candidate 18 µs</text><text x="538" y="195" class="body">B: baseline 100 → candidate 110 µs</text><text x="538" y="222" class="body">B regresses by 10% in either mixture</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Mixture: 90% A / 10% B</text><text x="48" y="343" class="body">Baseline mean: 28 µs</text><text x="48" y="370" class="body">Candidate mean: 27.2 µs</text><text x="48" y="397" class="body">Aggregate mean improves by about 2.857%</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Mixture: 10% A / 90% B</text><text x="538" y="343" class="body">Baseline mean: 92 µs</text><text x="538" y="370" class="body">Candidate mean: 100.8 µs</text><text x="538" y="397" class="body">Aggregate mean worsens by about 9.565%</text><text x="30" y="465" class="body">Ablations separate feature effects; matched diagnostics test the proposed mechanism.</text><text x="30" y="492" class="body">Weighted means do not establish mixture percentiles, throughput or queueing behavior.</text></svg>