<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Compact versus expanded representations of GQA</title><desc id="desc">Compact K and V have two distinct heads and sixty four payload bytes. Expanded reference duplicates them into four heads and one hundred twenty eight bytes. Outputs agree while Q and O remain four headed. Coexisting copies sum to one hundred ninety two KV payload bytes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">One GQA computation, two representations</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Scalar fixture: B = 1, Hq = 4, Hkv = 2, N = 2, d = 1, FP64</text><rect x="30" y="120" width="475" height="200" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="160" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Compact K/V</text><text x="50" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Distinct heads: [0, 1]</text><text x="50" y="245" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">K/V shape each: (1, 2, 2, 1)</text><text x="50" y="289" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Combined K/V payload: 64 bytes</text><rect x="535" y="120" width="495" height="200" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="555" y="160" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Physically expanded reference</text><text x="555" y="202" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Duplicated heads: [0, 0, 1, 1]</text><text x="555" y="245" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">K/V shape each: (1, 4, 2, 1)</text><text x="555" y="289" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Combined K/V payload: 128 bytes</text><rect x="30" y="360" width="1000" height="130" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="401" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Same Q and output shape: (1, 4, 1, 1); 32 bytes each</text><text x="50" y="445" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#0f172a">Both outputs: [15, 17.5, 150, 175]</text><text x="50" y="478" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Duplication changes storage, not learned architecture in this reference.</text><rect x="30" y="530" width="1000" height="120" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="571" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">If compact and expanded K/V coexist: 64 + 128 = 192 payload bytes</text><text x="50" y="614" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Unique allocations, workspace, metadata and physical traffic need separate evidence.</text><text x="30" y="701" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Reducing independently learned KV heads is a model change, not this equivalence.</text></svg>