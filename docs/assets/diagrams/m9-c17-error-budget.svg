<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="title desc"><title id="title">Mixed absolute relative error budget with pass and fail examples</title><desc id="desc">The allowed coordinate error equals an absolute allowance plus a relative allowance times reference magnitude. Three examples have normalized errors 0.5 and 0.7463 passing and 1.3289 failing. Worst coordinate and affected request counts must accompany aggregate metrics.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="680" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">A mixed error budget checks every required coordinate</text><rect x="30" y="80" width="1000" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="119" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Absolute error e = |candidate − reference|</text><text x="50" y="162" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Allowed error = a + t|reference|; normalized error q = e / allowed error</text><text x="30" y="237" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Constructed example: a = 10⁻⁶, t = 10⁻⁴. Pass only when q ≤ 1.</text><rect x="30" y="275" width="1000" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="305" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Reference 0: error 5 × 10⁻⁷; allowance 10⁻⁶</text><text x="50" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Normalized error: 0.5 → pass</text><rect x="30" y="375" width="1000" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="405" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Reference 2: error 0.00015; allowance 0.000201</text><text x="50" y="434" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Normalized error: 0.7463 → pass</text><rect x="30" y="475" width="1000" height="75" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="50" y="505" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Reference −3: error 0.0004; allowance 0.000301</text><text x="50" y="534" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Normalized error: 1.3289 → fail</text><text x="30" y="602" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Near zero, the absolute term protects the comparison; relative error alone is insufficient.</text><text x="30" y="647" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Report worst-coordinate location and affected requests alongside means and RMS error.</text></svg>