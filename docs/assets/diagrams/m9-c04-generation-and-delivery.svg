<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="750" viewBox="0 0 1060 750" role="img" aria-labelledby="title desc"><title id="title">Generation and delivery have different gaps</title><desc id="desc">Four IDs have generation mean 15 milliseconds, write mean 16 and one-ID client mean 20. Grouped client availability mean is 15 but maximum gap is 45, versus 26 before grouping. Server and client clock origins are unrelated.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="750" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">One output sequence, several timing boundaries</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Constructed replay: IDs [2, 0, 1, 2] → text “cabc”</text><rect x="30" y="110" width="1000" height="120" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="142" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Server S: selected IDs</text><text x="50" y="177" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Times: 10, 20, 35, 55 ms</text><text x="50" y="211" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Gaps: 10, 15, 20 ms; mean 15 ms</text><rect x="30" y="245" width="1000" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="277" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Server S: write accepted</text><text x="50" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Times: 12, 24, 38, 60 ms</text><text x="50" y="346" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Gaps: 12, 14, 22 ms; mean 16 ms</text><rect x="30" y="380" width="1000" height="120" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="412" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Client C: one ID per event</text><text x="50" y="447" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Times: 100, 112, 134, 160 ms</text><text x="50" y="481" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Gaps: 12, 22, 26 ms; mean 20 ms</text><rect x="30" y="515" width="1000" height="120" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="547" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Client C: grouped events</text><text x="50" y="582" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Positions 1–2 at 115; positions 3–4 at 160 ms</text><text x="50" y="616" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">ID availability gaps: 0, 45, 0 ms; mean 15 ms</text><text x="30" y="680" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">S and C have unrelated origins: no cross-clock transit subtraction.</text><text x="30" y="717" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Grouping delays first visibility and enlarges the maximum visible stall.</text></svg>