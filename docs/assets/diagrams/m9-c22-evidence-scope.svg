<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Use complementary evidence, each within its scope</title><desc id="desc">Proposed verification path • reference arithmetic is separate from runtime evidence</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Use complementary evidence, each within its scope</text><text x="30" y="76" class="sub">Proposed verification path • reference arithmetic is separate from runtime evidence</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Independent lifecycle oracle</text><text x="48" y="168" class="body">Compare identity / token / payload sets</text><text x="48" y="195" class="body">4 × 4096 = 16384 backing bytes</text><text x="48" y="222" class="body">Pins overlap storage; never count twice</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Explore competing orders</text><text x="538" y="168" class="body">3 reader + 3 retirement actions</text><text x="538" y="195" class="body">20 order-preserving merged schedules</text><text x="538" y="222" class="body">Rejected acquire skips dependent actions</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Host and device diagnostic scope</text><text x="48" y="343" class="body">Supported Miri paths; bounded Loom model</text><text x="48" y="370" class="body">Device modes check different fault classes</text><text x="48" y="397" class="body">Unsupported / incomplete is not a pass</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Keep reproducible campaign evidence</text><text x="538" y="343" class="body">100 seeds × 200 events × 2 pools = 40000</text><text x="538" y="370" class="body">Original and minimized failure traces</text><text x="538" y="397" class="body">Clean service timing after correctness</text><text x="30" y="465" class="body">No finding in a finite campaign establishes no universal safety or p99 guarantee.</text><text x="30" y="492" class="body">A stale in-bounds identity can require an oracle even when access diagnostics are clean.</text></svg>