<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Prefill decode and processed-position ledger</title><desc id="desc">Prompt one is processed at position zero, then selected two is processed at position one and another two at position two. Three outputs are selected, but final KV represents only one two two. Final selected history has four IDs and valid processed KV length three.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Selected history can be ahead of processed KV</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Full M1-C14 model: prompt [1], cap 3, greedy outputs [2, 2, 2]</text><rect x="30" y="115" width="1000" height="120" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="154" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Prefill processes position 0: input [1]</text><text x="50" y="196" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">KV represents [1]; first selected ID is 2 at output position 1.</text><text x="50" y="226" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Next model input uses logical position 1.</text><path d="M530,245 L530,275" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="285" width="1000" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="324" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Decode 1 processes position 1: input [2]</text><text x="50" y="366" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">KV represents [1, 2]; second selected ID is 2.</text><text x="50" y="396" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Next model input uses logical position 2.</text><path d="M530,415 L530,445" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="455" width="1000" height="120" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="494" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Decode 2 processes position 2: input [2]</text><text x="50" y="536" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">KV represents [1, 2, 2]; third selected ID is 2; stop at cap.</text><text x="50" y="566" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">No extra forward is required for that terminal selection.</text><rect x="30" y="615" width="1000" height="85" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="650" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Final selected history: [1, 2, 2, 2]; processed KV length: 3</text><text x="50" y="684" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Reserved capacity is not permission to read unprocessed positions.</text></svg>