<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="665" viewBox="0 0 1060 665" role="img" aria-labelledby="title desc"><title id="title">Attention axis and association boundaries</title><desc id="desc">Each of two query rows has three key weights alpha beta alpha or beta alpha alpha, normalized across keys. Independent batch and head slices must not mix. Keys and values move together.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="665" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Keep query rows, key columns and request slices distinct</text><text x="30" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">P weights in one (batch b, head h) slice: shape (L, S)</text><text x="215" y="133" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">key j = 0</text><text x="405" y="133" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">key j = 1</text><text x="595" y="133" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">key j = 2</text><text x="30" y="199" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">query i = 0</text><rect x="200" y="155" width="170" height="70" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="274" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">α</text><rect x="390" y="155" width="170" height="70" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="464" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">β</text><rect x="580" y="155" width="170" height="70" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="654" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">α</text><text x="30" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">query i = 1</text><rect x="200" y="245" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="274" y="290" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">β</text><rect x="390" y="245" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="464" y="290" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">α</text><rect x="580" y="245" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="654" y="290" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">α</text><path d="M790,190 L995,190" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="792" y="171" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">row total = 1</text><path d="M790,280 L995,280" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="792" y="261" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">row total = 1</text><rect x="30" y="365" width="1000" height="100" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="402" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Separate (b, h) slices never normalize or aggregate together.</text><text x="50" y="439" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Changing batch 1 values must leave every batch 0 output unchanged.</text><rect x="30" y="490" width="1000" height="100" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="527" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Key j and value j remain paired under any permutation.</text><text x="50" y="564" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Paired permutation preserves output; swapping only keys generally changes it.</text><text x="30" y="632" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">No causal mask here. Key eligibility and positional information follow in M1-C11.</text></svg>