<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="695" viewBox="0 0 1060 695" role="img" aria-labelledby="title desc"><title id="title">All or nothing group reservation and rollback</title><desc id="desc">A owns three slots. B temporarily reserves two of a requested four then fails before publication and before payload work. Rollback restores five free slots and leaves A unchanged. Generations do not rewind.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="695" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Reservation is tentative until the whole group commits</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Eight slots × 512 bytes = 4,096 backing payload bytes</text><rect x="30" y="120" width="1000" height="130" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="157" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">A owns three; B asks for four</text><text x="50" y="199" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">F = 5; R = 0; L = 3; D = 0</text><text x="50" y="233" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">A: IDs 0,1,2. Eligible IDs: 3,4,5,6,7.</text><rect x="30" y="280" width="1000" height="130" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="317" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Injected failure after B takes two</text><text x="50" y="359" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">F = 3; R = 2; L = 3; D = 0</text><text x="50" y="393" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">B: IDs 3,4 reserved; no table publication or payload work.</text><rect x="30" y="440" width="1000" height="130" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="477" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Rollback returns both tentative IDs once</text><text x="50" y="519" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">F = 5; R = 0; L = 3; D = 0</text><text x="50" y="553" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">A stays unchanged. Free eligibility restored; generations advance.</text><text x="30" y="614" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Free + Reserved + Live + Retiring = 8 at every observation.</text><text x="30" y="655" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">No partial handle group escapes; identity history does not rewind.</text></svg>