<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 565" role="img" aria-labelledby="title desc"><title id="title">Shared projection with request isolation</title><desc id="desc">Each of two requests has two input rows, uses one shared weight matrix, and retains its own two by two result. Bias is omitted.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="565" fill="white"/><text x="440" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">Two requests, one fixed shared weight matrix</text><text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">Request 0: X[0]</text><rect x="65" y="110" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="100.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="135" y="110" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="170.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−1</text><rect x="205" y="110" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="240.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">3</text><rect x="65" y="155" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="100.0" y="183.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0</text><rect x="135" y="155" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="170.0" y="183.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">4</text><rect x="205" y="155" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="240.0" y="183.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">1</text><text x="710" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">Request 1: X[1]</text><rect x="605" y="110" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="640.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">1</text><rect x="675" y="110" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="710.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="745" y="110" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="780.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0</text><rect x="605" y="155" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="640.0" y="183.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−1</text><rect x="675" y="155" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="710.0" y="183.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0</text><rect x="745" y="155" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="780.0" y="183.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="320" y="110" width="240" height="100" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="440.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Shared W</text><text x="440.0" y="166.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">shape (3, 2)</text><text x="440.0" y="191.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Read-only weights</text><path d="M170 200 V250" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M710 200 V250" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M320 160 H295 V225 H210 V250" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M560 160 H585 V225 H670 V250" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><text x="170" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Y[0] = X[0]W</text><text x="710" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Y[1] = X[1]W</text><rect x="100" y="305" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="135.0" y="333.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−3</text><rect x="170" y="305" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="205.0" y="333.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">8</text><rect x="100" y="350" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="135.0" y="378.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">18</text><rect x="170" y="350" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="205.0" y="378.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="640" y="305" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="675.0" y="333.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">14</text><rect x="710" y="305" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="745.0" y="333.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">1</text><rect x="640" y="350" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="675.0" y="378.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−8</text><rect x="710" y="350" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="745.0" y="378.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">3</text><rect x="310" y="320" width="260" height="70" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="440.0" y="348.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Keep request and</text><text x="440.0" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">position identities</text><text x="440" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">(B, S, K) × (K, N) → (B, S, N)</text><text x="440" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Example: (2, 2, 3) × (3, 2) → (2, 2, 2)</text><text x="440" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Bias omitted here. Private results remain private even when W is shared.</text></svg>