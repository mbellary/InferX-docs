<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Equal frequencies but different token coupling"><rect width="1100" height="550" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Same histogram can conceal 128 paired mismatches</text><text x="28" y="168" font-size="22" font-weight="bold">A: f(u)</text><rect x="230" y="130" width="204.8" height="65" fill="#315bb5"/><text x="332.4" y="169" text-anchor="middle" font-size="21" fill="white">ID 4: 64</text><rect x="434.8" y="130" width="409.6" height="65" fill="#087f83"/><text x="639.6" y="169" text-anchor="middle" font-size="21" fill="white">ID 9: 128</text><rect x="844.4000000000001" y="130" width="204.8" height="65" fill="#7552a8"/><text x="946.8000000000001" y="169" text-anchor="middle" font-size="21" fill="white">ID 12: 64</text><text x="28" y="303" font-size="22" font-weight="bold">B: f(1−u)</text><rect x="230" y="265" width="204.8" height="65" fill="#7552a8"/><text x="332.4" y="304" text-anchor="middle" font-size="21" fill="white">ID 12: 64</text><rect x="434.8" y="265" width="409.6" height="65" fill="#087f83"/><text x="639.6" y="304" text-anchor="middle" font-size="21" fill="white">ID 9: 128</text><rect x="844.4000000000001" y="265" width="204.8" height="65" fill="#315bb5"/><text x="946.8000000000001" y="304" text-anchor="middle" font-size="21" fill="white">ID 4: 64</text><text x="230.0" y="107" text-anchor="middle" font-size="18">u≈0</text><text x="434.8" y="107" text-anchor="middle" font-size="18">1/4</text><text x="844.4000000000001" y="107" text-anchor="middle" font-size="18">3/4</text><text x="1049.2" y="107" text-anchor="middle" font-size="18">u≈1</text><text x="230" y="380" font-size="22">Both counts: ID 4 = 64; ID 9 = 128; ID 12 = 64.</text><text x="230" y="425" font-size="22">First and last quarters differ: 64 + 64 = 128 of 256.</text><text x="28" y="495" font-size="18">Exhaustive eight-bit midpoint grid; a correctness exercise, not independent random sampling.</text><text x="28" y="528" font-size="17">Equal marginal counts do not prove token-wise coupling or independence across decisions.</text></g></svg>