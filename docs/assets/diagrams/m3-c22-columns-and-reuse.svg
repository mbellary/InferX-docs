<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">GEMM shared weights and independent input columns</title><desc id="desc">Shared weights transform two shown independent input columns while retaining separate output identities.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">One shared matrix, several independent input columns</text><text x="30" y="76" fill="#172b42" font-family="Arial, sans-serif" font-size="20">A: M × K · B: K × N · C: M × N · α = 1, β = 0</text><rect x="40" y="135" width="270" height="220" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="65" y="177" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Weights A</text><text x="65" y="219" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Shared by N columns</text><text x="65" y="263" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Logical read: sMK</text><text x="65" y="309" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Retain until all readers finish</text><rect x="390" y="115" width="250" height="115" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="410" y="155" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Apply A to input b₀</text><text x="410" y="198" fill="#172b42" font-family="Arial, sans-serif" font-size="19">K values; identity 0</text><rect x="390" y="265" width="250" height="115" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="410" y="305" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Apply A to input b₁</text><text x="410" y="348" fill="#172b42" font-family="Arial, sans-serif" font-size="19">K values; identity 1</text><rect x="740" y="115" width="250" height="115" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="760" y="155" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Output column c₀</text><text x="760" y="198" fill="#172b42" font-family="Arial, sans-serif" font-size="19">M values; identity 0</text><rect x="740" y="265" width="250" height="115" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="760" y="305" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Output column c₁</text><text x="760" y="348" fill="#172b42" font-family="Arial, sans-serif" font-size="19">M values; identity 1</text><path d="M310 207 L390 172" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M310 291 L390 322" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M640 172 L740 172" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M640 322 L740 322" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="427" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Each output: cⱼ = A bⱼ. Independent columns may share a GEMM.</text><text x="40" y="471" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Useful work: 2MNK FLOPs. Logical minimum: s(MK + KN + MN) bytes.</text><text x="40" y="515" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Repeated GEMVs may also reuse cached A; allocation sharing is not a traffic counter.</text><text x="40" y="557" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Batch column count is distinct from multiple separate batched-GEMM products.</text><text x="40" y="597" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Later decode steps of one request still depend on earlier token choices.</text></svg>