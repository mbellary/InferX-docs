<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="745" viewBox="0 0 1060 745" role="img" aria-labelledby="title desc"><title id="title">Lifecycle gates for writing reading and safe reuse</title><desc id="desc">A free block receives a fresh identity and exclusive writer. Required writer completion permits publication and protected readers. Cancellation closes new uses and detaches mapping but retains old claims. Final return requires no owner authority, writer or reader claims and happens once.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="745" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Readiness and safe reuse are different gates</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Private block; one lifecycle authority; no shared prefix owners</text><rect x="30" y="120" width="1000" height="115" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="160" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Free → Reserved → Writing</text><text x="50" y="204" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Fresh identity; one writer; no readers; valid range unpublished</text><rect x="30" y="275" width="1000" height="115" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="315" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Writer completes → Ready</text><text x="50" y="359" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Publish matching payload + valid prefix; then admit protected readers</text><rect x="30" y="430" width="1000" height="115" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="470" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Cancel / close new use → Retiring</text><text x="50" y="514" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Detach mapping; retain all writer and host/device reader claims</text><path d="M530,560 L530,595" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="615" width="1000" height="95" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="654" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Return once only after every required use finishes</text><text x="50" y="694" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">No owner authority; W = H = G = 0; new use closed; mapping detached</text></svg>