<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">Query and key-value head sharing</title><desc id="desc">MHA maps four query heads to four KV heads. Contiguous two-group GQA maps query heads zero and one to KV zero, and two and three to KV one. MQA maps all four query heads to one KV head.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="690" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Four query heads; different numbers of distinct KV heads</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Each query head keeps its own key-axis softmax and output.</text><rect x="30" y="110" width="310" height="365" rx="9" fill="#e0f2fe" stroke="#64748b"/><text x="46" y="151" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">MHA: H_kv = 4</text><rect x="46" y="177" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="60" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 0</text><path d="M142,199 L207,199" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="218" y="206" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><rect x="46" y="242" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="60" y="271" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 1</text><path d="M142,264 L207,264" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="218" y="271" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 1</text><rect x="46" y="307" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="60" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 2</text><path d="M142,329 L207,329" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="218" y="336" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 2</text><rect x="46" y="372" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="60" y="401" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 3</text><path d="M142,394 L207,394" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="218" y="401" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 3</text><text x="46" y="452" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">4 distinct key/value heads</text><rect x="375" y="110" width="310" height="365" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="391" y="151" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">GQA: H_kv = 2</text><rect x="391" y="177" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="405" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 0</text><path d="M487,199 L552,199" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="563" y="206" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><rect x="391" y="242" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="405" y="271" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 1</text><path d="M487,264 L552,264" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="563" y="271" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><rect x="391" y="307" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="405" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 2</text><path d="M487,329 L552,329" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="563" y="336" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 1</text><rect x="391" y="372" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="405" y="401" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 3</text><path d="M487,394 L552,394" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="563" y="401" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 1</text><text x="391" y="452" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">2 distinct key/value heads</text><rect x="720" y="110" width="310" height="365" rx="9" fill="#fef3c7" stroke="#64748b"/><text x="736" y="151" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">MQA: H_kv = 1</text><rect x="736" y="177" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="750" y="206" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 0</text><path d="M832,199 L897,199" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="908" y="206" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><rect x="736" y="242" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="750" y="271" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 1</text><path d="M832,264 L897,264" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="908" y="271" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><rect x="736" y="307" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="750" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 2</text><path d="M832,329 L897,329" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="908" y="336" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><rect x="736" y="372" width="88" height="44" rx="9" fill="#ffffff" stroke="#64748b"/><text x="750" y="401" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Q 3</text><path d="M832,394 L897,394" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="908" y="401" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">KV 0</text><text x="736" y="452" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">1 distinct key/value head</text><rect x="30" y="515" width="1000" height="90" rx="9" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="553" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">For contiguous GQA: g(h) = floor(h / (H_q / H_kv)).</text><text x="50" y="589" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">H_q = 4, H_kv = 2 → [0, 0, 1, 1]; remainder-based [0, 1, 0, 1] is different.</text><text x="30" y="652" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Fewer distinct KV heads reduce unique KV payload, not the number of query outputs.</text></svg>