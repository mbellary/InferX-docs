<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Rectangular panels and register microtile</title><desc id="desc">Sixteen-by-eight A and eight-by-thirty-two B panels feed a sixteen-by-thirty-two output tile; a two-by-four microtile reuses six operands for eight products.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="42" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">One full stage: Tm = 16, Tn = 32, Tk = 8</text><rect x="35" y="105" width="280" height="195" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="145" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">A panel: 16 × 8</text><text x="55" y="190" fill="#172b42" font-family="Arial, sans-serif" font-size="21">128 FP32 values</text><text x="55" y="230" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Reused across columns</text><rect x="365" y="105" width="280" height="195" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="385" y="145" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">B panel: 8 × 32</text><text x="385" y="190" fill="#172b42" font-family="Arial, sans-serif" font-size="21">256 FP32 values</text><text x="385" y="230" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Reused across rows</text><rect x="695" y="105" width="310" height="195" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="715" y="145" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">C tile: 16 × 32</text><text x="715" y="190" fill="#172b42" font-family="Arial, sans-serif" font-size="21">512 accumulators</text><text x="715" y="230" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Across K stages</text><path d="M175 300 V315 H850 V302" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M647 200 L690 200" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="35" y="342" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">A logical 2 × 4 register microtile, for one k:</text><rect x="45" y="365" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="62" y="405" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C00</text><rect x="145" y="365" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="162" y="405" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C01</text><rect x="245" y="365" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="262" y="405" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C02</text><rect x="345" y="365" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="362" y="405" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C03</text><rect x="45" y="440" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="62" y="480" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C10</text><rect x="145" y="440" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="162" y="480" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C11</text><rect x="245" y="440" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="262" y="480" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C12</text><rect x="345" y="440" width="90" height="65" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="362" y="480" fill="#172b42" font-family="Arial, sans-serif" font-size="21">C13</text><rect x="500" y="365" width="505" height="140" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="520" y="403" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">2 A + 4 B operands feed 8 products</text><text x="520" y="447" fill="#172b42" font-family="Arial, sans-serif" font-size="21">8 accumulators retain output state</text><text x="520" y="483" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Actual registers require compiler evidence.</text><text x="35" y="563" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Panels: 1536 B; stage work: 8192 FLOPs; input-only intensity: 16/3 FLOPs/B.</text><text x="35" y="603" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Logical tiles and value counts do not specify hardware thread count.</text></svg>