<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Graph topology comparison"><rect width="1100" height="520" fill="#f5f7fb"/><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4c607a"/></marker></defs><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Same useful result, different permitted schedules</text><text x="30" y="86" font-size="21" font-weight="bold">Minimal data dependencies</text><text x="580" y="86" font-size="21" font-weight="bold">Serial study topology</text><rect x="65" y="145" width="190" height="62" rx="8" fill="#315bb5"/><text x="160.0" y="183" text-anchor="middle" font-size="20" fill="white">A = 2X</text><rect x="65" y="315" width="190" height="62" rx="8" fill="#087f83"/><text x="160.0" y="353" text-anchor="middle" font-size="20" fill="white">B = X + 7</text><rect x="330" y="230" width="200" height="62" rx="8" fill="#7552a8"/><text x="430.0" y="268" text-anchor="middle" font-size="20" fill="white">Y = A + B</text><rect x="595" y="230" width="140" height="62" rx="8" fill="#315bb5"/><text x="665.0" y="268" text-anchor="middle" font-size="20" fill="white">A = 2X</text><rect x="765" y="230" width="140" height="62" rx="8" fill="#087f83"/><text x="835.0" y="268" text-anchor="middle" font-size="20" fill="white">B = X + 7</text><rect x="935" y="230" width="140" height="62" rx="8" fill="#7552a8"/><text x="1005.0" y="268" text-anchor="middle" font-size="20" fill="white">Y = A + B</text><path d="M255,176 L325,250" fill="none" stroke="#4c607a" stroke-width="3" marker-end="url(#arr)"/><path d="M255,346 L325,275" fill="none" stroke="#4c607a" stroke-width="3" marker-end="url(#arr)"/><path d="M735,261 L760,261" fill="none" stroke="#4c607a" stroke-width="3" marker-end="url(#arr)"/><path d="M905,261 L930,261" fill="none" stroke="#4c607a" stroke-width="3" marker-end="url(#arr)"/><text x="40" y="430" font-size="19">Model: max(4,6) + 5 = 11 µs</text><text x="590" y="430" font-size="19">Model: 4 + 6 + 5 = 15 µs</text><text x="28" y="485" font-size="18">Constructed durations. A and B read immutable X. Every Y waits for both producers; overlap is not guaranteed.</text></g></svg>