<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Double-buffered four-chunk reference schedule</title><desc id="desc">Rows show H2D, kernel and D2H intervals for four chunks across two slots. No slot is reused before its previous D2H finishes. All times are invented.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" stroke="#526d82" fill="none"/></marker></defs><rect width="1100" height="540" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="37" font-size="25">Two slots preserve ownership while different chunks overlap</text><text x="30" y="72" font-size="18">Constructed microseconds: H2D 4, kernel 7, D2H 3; immediate CPU retirement</text><path d="M230 112 V390" stroke="#d9e0e8"/><text x="223" y="104" font-size="15">0</text><path d="M322 112 V390" stroke="#d9e0e8"/><text x="315" y="104" font-size="15">4</text><path d="M414 112 V390" stroke="#d9e0e8"/><text x="407" y="104" font-size="15">8</text><path d="M483 112 V390" stroke="#d9e0e8"/><text x="476" y="104" font-size="15">11</text><path d="M552 112 V390" stroke="#d9e0e8"/><text x="545" y="104" font-size="15">14</text><path d="M644 112 V390" stroke="#d9e0e8"/><text x="637" y="104" font-size="15">18</text><path d="M713 112 V390" stroke="#d9e0e8"/><text x="706" y="104" font-size="15">21</text><path d="M805 112 V390" stroke="#d9e0e8"/><text x="798" y="104" font-size="15">25</text><path d="M874 112 V390" stroke="#d9e0e8"/><text x="867" y="104" font-size="15">28</text><path d="M966 112 V390" stroke="#d9e0e8"/><text x="959" y="104" font-size="15">32</text><path d="M1035 112 V390" stroke="#d9e0e8"/><text x="1028" y="104" font-size="15">35</text><text x="30" y="155" font-size="18">Chunk 0 / slot A</text><rect x="230" y="130" width="92" height="38" rx="5" fill="#cee8df" stroke="#8c9eb0"/><text x="270.0" y="155" font-size="17">H</text><rect x="322" y="130" width="161" height="38" rx="5" fill="#dceaf8" stroke="#8c9eb0"/><text x="396.5" y="155" font-size="17">K</text><rect x="483" y="130" width="69" height="38" rx="5" fill="#fce1a9" stroke="#8c9eb0"/><text x="511.5" y="155" font-size="17">D</text><text x="30" y="220" font-size="18">Chunk 1 / slot B</text><rect x="322" y="195" width="92" height="38" rx="5" fill="#cee8df" stroke="#8c9eb0"/><text x="362.0" y="220" font-size="17">H</text><rect x="483" y="195" width="161" height="38" rx="5" fill="#dceaf8" stroke="#8c9eb0"/><text x="557.5" y="220" font-size="17">K</text><rect x="644" y="195" width="69" height="38" rx="5" fill="#fce1a9" stroke="#8c9eb0"/><text x="672.5" y="220" font-size="17">D</text><text x="30" y="285" font-size="18">Chunk 2 / slot A</text><rect x="552" y="260" width="92" height="38" rx="5" fill="#cee8df" stroke="#8c9eb0"/><text x="592.0" y="285" font-size="17">H</text><rect x="644" y="260" width="161" height="38" rx="5" fill="#dceaf8" stroke="#8c9eb0"/><text x="718.5" y="285" font-size="17">K</text><rect x="805" y="260" width="69" height="38" rx="5" fill="#fce1a9" stroke="#8c9eb0"/><text x="833.5" y="285" font-size="17">D</text><text x="30" y="350" font-size="18">Chunk 3 / slot B</text><rect x="713" y="325" width="92" height="38" rx="5" fill="#cee8df" stroke="#8c9eb0"/><text x="753.0" y="350" font-size="17">H</text><rect x="805" y="325" width="161" height="38" rx="5" fill="#dceaf8" stroke="#8c9eb0"/><text x="879.5" y="350" font-size="17">K</text><rect x="966" y="325" width="69" height="38" rx="5" fill="#fce1a9" stroke="#8c9eb0"/><text x="994.5" y="350" font-size="17">D</text><text x="30" y="430" font-size="19">H = input copy; K = transform; D = output copy. Release A at 14, B at 21.</text><text x="30" y="468" font-size="19">Four chunks: serial 56 µs; this valid schedule 35 µs; first output still 14 µs.</text><text x="30" y="505" font-size="19">Additional CPU readers extend slot lifetime and require a different schedule.</text></g></svg>