<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 615" role="img" aria-labelledby="title desc"><title id="title">Coordinates and axis swaps</title><desc id="desc">Two request matrices show positions and features. Request one, position two, feature three is 123. Swapping equal-size request and position axes keeps shape but changes 12 to 102.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="615" fill="white"/><text x="440" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">Use coordinates to preserve request and position identity</text><text x="245" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172b4d">Request b = 0</text><text x="645" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172b4d">Request b = 1</text><text x="245" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Feature j → 0       1       2       3</text><text x="645" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Feature j → 0       1       2       3</text><rect x="120" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="151.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0</text><rect x="182" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="213.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">1</text><rect x="244" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="275.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="306" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="337.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">3</text><rect x="120" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="151.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">10</text><rect x="182" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="213.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">11</text><rect x="244" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="275.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">12</text><rect x="306" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="337.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">13</text><rect x="120" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="151.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">20</text><rect x="182" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="213.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">21</text><rect x="244" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="275.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">22</text><rect x="306" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="337.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">23</text><rect x="520" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="551.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">100</text><rect x="582" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="613.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">101</text><rect x="644" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="675.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">102</text><rect x="706" y="132" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="737.0" y="158.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">103</text><rect x="520" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="551.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">110</text><rect x="582" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="613.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">111</text><rect x="644" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="675.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">112</text><rect x="706" y="172" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="737.0" y="198.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">113</text><rect x="520" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="551.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">120</text><rect x="582" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="613.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">121</text><rect x="644" y="212" width="62" height="40" fill="#eef8f0" stroke="#496a92"/><text x="675.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">122</text><rect x="706" y="212" width="62" height="40" fill="#ffdfa3" stroke="#496a92"/><text x="737.0" y="238.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">123</text><text x="88" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">s = 0</text><text x="488" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">s = 0</text><text x="88" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">s = 1</text><text x="488" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">s = 1</text><text x="88" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">s = 2</text><text x="488" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">s = 2</text><text x="440" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">X[1, 2, 3] = 123; its ordinal is 23 in the chosen logical ordering.</text><rect x="45" y="330" width="790" height="60" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="440.0" y="366.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">The value is a label; the ordinal is a position, not a byte address.</text><text x="440" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172b4d">Equal-length axes can conceal a wrong interpretation</text><rect x="45" y="460" width="350" height="85" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="220.0" y="496.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Shape (2, 2, 4)</text><text x="220.0" y="520.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Intended X[0, 1, 2] = 12</text><rect x="485" y="460" width="350" height="85" rx="10" fill="#ffdfa3" stroke="#496a92" stroke-width="2"/><text x="660.0" y="496.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Same numeric shape</text><text x="660.0" y="520.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Swapped lookup gives 102</text><path d="M395 502 H485" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><text x="440" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Both extents are two: shape checks pass; coordinate-label checks fail.</text></svg>