<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="715" viewBox="0 0 1060 715" role="img" aria-labelledby="title desc"><title id="title">Fixed-window and cohort accounting</title><desc id="desc">Window zero through ten seconds has five arrivals and two successful terminals including carried-in A. The arrival cohort B through F finishes by thirteen seconds. Cohort span is twelve seconds. Admitted in-flight count reconciles from one to two.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="715" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">A fixed window and a drained cohort select different work</text><rect x="30" y="85" width="1000" height="170" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="124" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Fixed event window [0, 10) seconds</text><text x="50" y="166" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Arrivals: B, C, D, E, F; successful terminals: A, B</text><text x="50" y="205" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">A carried in; E and F remain in flight at 10 s.</text><text x="50" y="238" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Accepted output events: 9; success-committed output IDs: 7</text><rect x="30" y="295" width="1000" height="175" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="335" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Arrival cohort B–F, followed through terminal outcomes</text><text x="50" y="378" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">B/E succeed; C fails; D is rejected; F times out.</text><text x="50" y="418" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">First arrival: 1 s; last terminal: 13 s; span: 12 s</text><text x="50" y="452" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Successful output: 7 IDs / 12 s ≈ 0.5833 IDs/s</text><rect x="30" y="510" width="1000" height="115" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="550" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">In-flight conservation for admitted attempts</text><text x="50" y="595" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Start 1 + new admissions 4 − admitted terminals 3 = end 2</text><text x="30" y="675" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Never combine a cohort numerator with an unlabeled event-window denominator.</text></svg>