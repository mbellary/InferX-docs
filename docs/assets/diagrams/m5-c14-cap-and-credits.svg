<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Plan growth promises separately from current KV</title><desc id="desc">Constructed private-block reference • B=4 positions • Q=512 KiB</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Plan growth promises separately from current KV</text><text x="30" y="76" class="sub">Constructed private-block reference • B=4 positions • Q=512 KiB</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Current positions versus output cap</text><text x="48" y="168" class="body">A: prompt 6; output cap 7; selected 3</text><text x="48" y="195" class="body">Valid KV = 6 + 3 − 1 = 8 positions</text><text x="48" y="222" class="body">Current blocks 2; conservative cap 4</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Block rounding exposes policy cost</text><text x="538" y="168" class="body">Conservative P+G=13 → four blocks</text><text x="538" y="195" class="body">Qualified P+G−1=12 → three blocks</text><text x="538" y="222" class="body">Tighter rule needs actual backend evidence</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Free slots may already be promised</text><text x="48" y="343" class="body">Pool 12 = O7 + R3 + H1 + U1</text><text x="48" y="370" class="body">Five physically free; only one uncommitted</text><text x="48" y="397" class="body">New D needs two credits: wait</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Growth and release preserve the ledger</text><text x="538" y="343" class="body">A append: O/R/H/U = 8/2/1/1</text><text x="538" y="370" class="body">B terminal releases credit: 8/1/1/2</text><text x="538" y="397" class="body">B final user releases block: 7/1/1/3</text><text x="30" y="465" class="body">R backs admitted future growth; H is withheld headroom; neither adds pool backing bytes.</text><text x="30" y="492" class="body">A terminal can release unused credits before occupied blocks become safely reusable.</text></svg>