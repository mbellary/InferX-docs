<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Current identity and final users govern safe return</title><desc id="desc">Contract-level reference • no allocator or device implementation</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Current identity and final users govern safe return</text><text x="30" y="76" class="sub">Contract-level reference • no allocator or device implementation</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">A valid address is not enough</text><text x="48" y="168" class="body">Epoch / pool / slot / generation</text><text x="48" y="195" class="body">Request attempt and named user token</text><text x="48" y="222" class="body">Initialized coordinates and read readiness</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Sharing preserves distinct obligations</text><text x="538" y="168" class="body">A and B each hold an owner token</text><text x="538" y="195" class="body">Reader R7 survives logical cancellation</text><text x="538" y="222" class="body">Mutation requires its own write authority</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Return requires every gate</text><text x="48" y="343" class="body">Close attachment; detach old mappings</text><text x="48" y="370" class="body">Zero owners and outstanding access users</text><text x="48" y="397" class="body">Reconcile publication; authorize once</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Reassignment starts another lifetime</text><text x="538" y="343" class="body">Slot 0: generation 7 → generation 8</text><text x="538" y="370" class="body">Old R7 cannot release generation 8</text><text x="538" y="397" class="body">Unknown completion retains its claim</text><text x="30" y="465" class="body">Two-slot trace: 12 verdicts = 9 accepted + 3 rejected; 2 assignments = 2 returns.</text><text x="30" y="492" class="body">A late old-generation message must leave the current allocation unchanged.</text></svg>