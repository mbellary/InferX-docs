<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title desc"><title id="title">Constructed empirical distribution and a worker percentile aggregation counterexample</title><desc id="desc">An empirical CDF for eighteen one-millisecond durations plus ten and one hundred milliseconds reaches 0.9 at one 0.95 at ten and one at one hundred. Mean is 6.4 milliseconds. A separate worker example has one hundred fast and two slow observations; pooled p99 is one hundred milliseconds, not the average worker percentile.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="720" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">A sample percentile is a rank in one named population</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Constructed durations: eighteen × 1 ms, one × 10 ms, one × 100 ms.</text><text x="30" y="120" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Mean 6.4 ms; nearest-rank p50 = 1, p95 = 10, p99 = 100 ms.</text><path d="M122,405 L985,405" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M122,405 L122,150" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="35" y="175" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">F̂(t)</text><text x="88" y="411" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">0</text><text x="90" y="169" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#0f172a">1</text><text x="123" y="438" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">1</text><text x="192" y="438" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">10</text><text x="902" y="438" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">100</text><text x="660" y="474" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Latency t in ms (linear axis)</text><path d="M122,405 L130,405 L130,184.5 L202,184.5 L202,172.25 L922,172.25 L922,160 L965,160" stroke="#2563eb" stroke-width="4" fill="none"/><text x="250" y="220" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">18/20 are ≤ 1 ms</text><text x="470" y="266" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">19/20 are ≤ 10 ms</text><text x="690" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">20/20 are ≤ 100 ms</text><text x="30" y="525" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">The curve steps at observations; small samples give coarse tail ranks.</text><rect x="30" y="560" width="1000" height="130" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="598" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Worker A: 100 × 1 ms; worker B: 2 × 100 ms</text><text x="50" y="638" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Pooled p99: rank 101 of 102 → 100 ms</text><text x="50" y="672" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Averaging worker p99 values gives 50.5 ms, which is not the pooled p99.</text></svg>