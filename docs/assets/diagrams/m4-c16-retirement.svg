<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Variant and slot retirement"><rect width="1100" height="550" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Retirement requires the last user, not just cancellation</text><line x1="230" y1="76" x2="230" y2="465" stroke="#dce2eb"/><text x="230" y="68" text-anchor="middle" font-size="16">0</text><line x1="298" y1="76" x2="298" y2="465" stroke="#dce2eb"/><text x="298" y="68" text-anchor="middle" font-size="16">1</text><line x1="434" y1="76" x2="434" y2="465" stroke="#dce2eb"/><text x="434" y="68" text-anchor="middle" font-size="16">3</text><line x1="706" y1="76" x2="706" y2="465" stroke="#dce2eb"/><text x="706" y="68" text-anchor="middle" font-size="16">7</text><line x1="910" y1="76" x2="910" y2="465" stroke="#dce2eb"/><text x="910" y="68" text-anchor="middle" font-size="16">10</text><line x1="1046" y1="76" x2="1046" y2="465" stroke="#dce2eb"/><text x="1046" y="68" text-anchor="middle" font-size="16">12</text><text x="28" y="118" font-size="18">Admission</text><rect x="230" y="92" width="204" height="40" rx="5" fill="#315bb5"/><text x="332.0" y="118" text-anchor="middle" font-size="16" fill="white">Close at 3</text><text x="28" y="190" font-size="18">Device claim G</text><rect x="298" y="164" width="408" height="40" rx="5" fill="#087f83"/><text x="502.0" y="190" text-anchor="middle" font-size="16" fill="white">Submitted → checked completion</text><text x="28" y="262" font-size="18">CPU reader claim H</text><rect x="706" y="236" width="204" height="40" rx="5" fill="#7552a8"/><text x="808.0" y="262" text-anchor="middle" font-size="16" fill="white">Output retained</text><text x="28" y="334" font-size="18">Slot generation g</text><rect x="230" y="308" width="680" height="40" rx="5" fill="#63758a"/><text x="570.0" y="334" text-anchor="middle" font-size="16" fill="white">Unavailable for reassignment through last reader</text><text x="28" y="406" font-size="18">Release eligibility</text><rect x="910" y="380" width="136" height="40" rx="5" fill="#a15a26"/><text x="978.0" y="406" text-anchor="middle" font-size="16" fill="white">Release</text><text x="28" y="500" font-size="18">Constructed ordering units: submit=1; cancel/close=3; device complete=7; last reader=10.</text><text x="28" y="528" font-size="17">No new admission after 3. Release still requires binding detachment, zero claims and owner permission.</text></g></svg>