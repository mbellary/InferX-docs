<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="840" viewBox="0 0 1060 840" role="img" aria-labelledby="title desc"><title id="title">Two-block decoder-only model from token IDs to logits</title><desc id="desc">Token IDs enter embedding plus absolute positions, block zero, block one, separate final RMS normalization and an untied vocabulary projection. Only the final normalization and head can select the last row for a last-logit interface; both blocks still process the prefix.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="840" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">A complete decoder-only model: IDs to vocabulary scores</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Fixture: B requests, S valid positions, D = 2 features, V = 4 token identities</text><rect x="100" y="120" width="860" height="75" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="120" y="151" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Token IDs</text><text x="120" y="180" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Shape (B, S); IDs 0–3; positions 0–S−1</text><path d="M530,199 L530,219" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="100" y="225" width="860" height="75" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="120" y="256" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Embedding + position</text><text x="120" y="285" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">X₀ = E[ID] + P[position]; shape (B, S, 2)</text><path d="M530,304 L530,324" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="100" y="330" width="860" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="120" y="361" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Block 0 → H₁</text><text x="120" y="390" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Distinct attention output and MLP weights</text><path d="M530,409 L530,429" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="100" y="435" width="860" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="120" y="466" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Block 1 → H₂</text><text x="120" y="495" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Consumes H₁; shape stays (B, S, 2)</text><path d="M530,514 L530,534" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="100" y="540" width="860" height="75" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="120" y="571" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Final RMSNorm → Z</text><text x="120" y="600" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Scale [2, 1]; separate from block norms</text><path d="M530,619 L530,639" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="100" y="645" width="860" height="75" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="120" y="676" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Vocabulary projection → L</text><text x="120" y="705" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Untied (2, 4) matrix; output shape (B, S, 4)</text><text x="30" y="770" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Only the final norm/head may select the last row for a last-logit interface.</text><text x="30" y="808" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Both blocks still need the full prefix. Arrows express dependencies, not measured time.</text></svg>