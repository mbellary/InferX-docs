<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="715" viewBox="0 0 1060 715" role="img" aria-labelledby="title desc"><title id="title">Safe pool return after cancellation and completion</title><desc id="desc">A three slots retire after cancellation while B four slots remain live. One free slot cannot satisfy C two slot demand. After all required completions A slots return once; C gets IDs two and one with fresh generations. Pool backing is unchanged.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="715" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Cancellation does not immediately restore eligibility</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">A owns 3 slots; B owns 4; only slot 7 is free.</text><rect x="30" y="120" width="1000" height="125" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="159" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Cancel A while its readers still run</text><text x="50" y="202" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">F = 1; R = 0; L = 4; D = 3</text><text x="50" y="234" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">C asks for 2 → rejected; 1,536 retiring bytes remain unavailable.</text><path d="M530,260 L530,295" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="315" width="1000" height="125" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="354" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">All required readers complete → return A’s slots once</text><text x="50" y="397" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">F = 4; R = 0; L = 4; D = 0</text><text x="50" y="429" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Return IDs 0,1,2; free stack becomes [7,0,1,2].</text><path d="M530,455 L530,490" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="510" width="1000" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="549" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">C takes IDs 2,1 with fresh generations</text><text x="50" y="592" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">F = 2; R = 0; L = 6; D = 0; free stack [7,0]</text><text x="50" y="622" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Old A handles reject; B remains untouched.</text><text x="30" y="676" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Backing payload stays 4,096 bytes; pool return is not system deallocation.</text></svg>