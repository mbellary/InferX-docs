<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="710" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc"><title id="title">Multiple reader completions and deferred safe return</title><desc id="desc">A cancels at seven with one host and two device claims. Host finishes at nine and S0 at ten but S1 still blocks return until twelve. Actual return thirteen and reuse fourteen give six milliseconds retention and 3072 byte milliseconds area. Times are constructed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="710" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Cancellation leaves old host and device readers protected</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Constructed host observations in ms; one slot = 512 bytes</text><rect x="30" y="120" width="1000" height="105" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="159" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">7 ms: close A; H = 1; G = 2</text><text x="50" y="202" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Retiring; no new uses; B’s other slot remains live</text><rect x="30" y="255" width="1000" height="105" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="294" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">9 ms: host done; 10 ms: S0 done</text><text x="50" y="337" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">H = 0; G = 1; S1 still prevents return</text><rect x="30" y="390" width="1000" height="105" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="429" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">12 ms: S1 done; H = G = 0</text><text x="50" y="472" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">All required completion conditions now hold</text><rect x="30" y="525" width="1000" height="105" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="564" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">13 ms: safe return; 14 ms: C gets fresh identity</text><text x="50" y="607" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Generation 8; valid length 0; old generation 7 rejects</text><text x="30" y="673" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Retirement = 13 − 7 = 6 ms; retained area = 512 × 6 = 3,072 byte·ms</text></svg>