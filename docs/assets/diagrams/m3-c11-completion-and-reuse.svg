<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Scope, host readers and generation-safe reuse</title><desc id="desc">Result copy completes at 17; CPU reads from 18 to 21. Independent work finishes at 40 in a separate scope example. Old generation completions cannot release new storage.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526d82"/></marker></defs><rect width="1100" height="540" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">Scope and last users determine what completion can release</text><text x="30" y="74" font-size="18">Constructed times, not measured; separate examples share this illustration</text><text x="30" y="125" font-size="20">Request result</text><rect x="260" y="103" width="340" height="38" rx="6" fill="#cee8df"/><text x="615" y="130" font-size="18">GPU copy done: 17</text><text x="30" y="185" font-size="20">CPU reader</text><rect x="620" y="163" width="60" height="38" rx="6" fill="#fce1a9"/><text x="695" y="190" font-size="18">18–21; slot reusable at 21</text><text x="30" y="245" font-size="20">Independent work</text><rect x="260" y="223" width="800" height="38" rx="6" fill="#dceaf8"/><text x="260" y="292" font-size="18">Result-only scope: 17</text><text x="760" y="292" font-size="18">Device drain scope: 40</text><rect x="30" y="335" width="315" height="85" rx="9" fill="#dceaf8" stroke="#8c9eb0"/><text x="44" y="363" font-size="20">Slot 2 / generation 7</text><text x="44" y="389" font-size="17">Epoch 41; retire all users</text><rect x="420" y="335" width="315" height="85" rx="9" fill="#cee8df" stroke="#8c9eb0"/><text x="434" y="363" font-size="20">Slot 2 / generation 8</text><text x="434" y="389" font-size="17">Epoch 42; new ownership</text><path d="M345,377 L418,377" fill="none" stroke="#526d82" stroke-width="2" marker-end="url(#a)"/><text x="30" y="462" font-size="20">A delayed generation-7 completion must not release generation-8 storage.</text><text x="30" y="500" font-size="19">Cancellation suppresses publication; unknown completion preserves the lease.</text></g></svg>