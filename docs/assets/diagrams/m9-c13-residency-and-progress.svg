<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Resource residency and progress tradeoffs</title><desc id="desc">Resource limits affect resident work, but eligible work and completed useful results need separate evidence. Fewer registers can cause spills; less traffic can lower bandwidth while reducing time. Constructed one gigabyte in five milliseconds versus half a gigabyte in three illustrates the distinction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Residency, readiness and useful completion are different checks</text><rect x="30" y="110" width="320" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="139" font-size="19">Register / shared limits</text><text x="42" y="167" font-size="17">How much work can reside?</text><rect x="390" y="110" width="320" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="402" y="139" font-size="19">Eligible / issued work</text><text x="402" y="167" font-size="17">Can resident warps make progress?</text><rect x="750" y="110" width="320" height="100" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="762" y="139" font-size="19">Completed useful operation</text><text x="762" y="167" font-size="17">Do correct results arrive sooner?</text><path d="M350 160 L385 160" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M710 160 L745 160" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="290" width="490" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="319" font-size="19">Fewer registers: possible residency gain</text><text x="42" y="347" font-size="17">Extra spills, instructions or traffic may offset it</text><rect x="580" y="290" width="490" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="592" y="319" font-size="19">More reuse: possible transfer reduction</text><text x="592" y="347" font-size="17">Achieved byte/s may fall while time improves</text><text x="30" y="450" font-size="20">Constructed traffic example: 1 GB / 5 ms → 0.5 GB / 3 ms.</text><text x="30" y="494" font-size="19">Bandwidth: 200 → 166.67 GB/s; useful work stays fixed and time decreases.</text><text x="30" y="541" font-size="19">Require compatible counters and normal timing; a percentage is not a cause.</text></g></svg>