<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 535" role="img" aria-labelledby="title desc"><title id="title">Row by column matrix multiplication</title><desc id="desc">Highlighted row zero of A and column one of W determine C zero one equal eight. Full product rows are minus three eight and eighteen two.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="535" fill="white"/><text x="440" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">One output cell = one input row · one weight column</text><text x="160" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172b4d">A: shape (2, 3)</text><rect x="50" y="125" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="85.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="120" y="125" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="155.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−1</text><rect x="190" y="125" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="225.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">3</text><rect x="50" y="170" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="85.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0</text><rect x="120" y="170" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="155.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">4</text><rect x="190" y="170" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="225.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">1</text><text x="350" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#172b4d">×</text><text x="485" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172b4d">W: shape (3, 2)</text><rect x="415" y="125" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="450.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">4</text><rect x="485" y="125" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="520.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">1</text><rect x="415" y="170" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="450.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">5</text><rect x="485" y="170" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="520.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">0</text><rect x="415" y="215" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="450.0" y="243.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−2</text><rect x="485" y="215" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="520.0" y="243.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><text x="625" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#172b4d">=</text><text x="755" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172b4d">C: shape (2, 2)</text><rect x="685" y="125" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="720.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−3</text><rect x="755" y="125" width="70" height="45" fill="#ffdfa3" stroke="#496a92"/><text x="790.0" y="153.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">8</text><rect x="685" y="170" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="720.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">18</text><rect x="755" y="170" width="70" height="45" fill="#eef8f0" stroke="#496a92"/><text x="790.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2</text><rect x="45" y="330" width="790" height="85" rx="10" fill="#fff2dd" stroke="#496a92" stroke-width="2"/><text x="440.0" y="366.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">C[0, 1] = 2 × 1 + (−1) × 0 + 3 × 2 = 8</text><text x="440.0" y="391.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Contract K = 3; keep M = 2 input rows and N = 2 output features.</text><text x="440" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Each column of W defines a different weighted sum.</text><text x="440" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b4d">Matching axis lengths are necessary; feature identities must also match.</text></svg>