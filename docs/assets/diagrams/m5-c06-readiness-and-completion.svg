<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A wakeup is a request to reconsider durable state</title><desc id="desc">Constructed single-clock microseconds • one scheduler owner • no runtime implementation</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">A wakeup is a request to reconsider durable state</text><text x="30" y="76" class="sub">Constructed single-clock microseconds • one scheduler owner • no runtime implementation</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Submission is not completion</text><text x="48" y="168" class="body">Prepare / submit 0–2; device compute 2–12</text><text x="48" y="195" class="body">Required result transfer 12–14</text><text x="48" y="222" class="body">Host-readable completion evidence at 14</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Observation and CPU service add delay</text><text x="538" y="168" class="body">Observer publishes / notifies 15</text><text x="538" y="195" class="body">Owner resumes 17; commit completes 19</text><text x="538" y="222" class="body">14 → 19 gap = 1 + 2 + 2 = 5 µs</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Future results need named meaning</text><text x="48" y="343" class="body">Pending → arrange progress notification</text><text x="48" y="370" class="body">Ready success differs from Ready error</text><text x="48" y="397" class="body">Enqueue-ready differs from device-done</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">A notification is not a token count</text><text x="538" y="343" class="body">Duplicate / coalesced wakes preserve status</text><text x="538" y="370" class="body">Current attempt / step / epoch / generation</text><text x="538" y="397" class="body">One logical result commits at most once</text><text x="30" y="465" class="body">Ideal event checks at 2,7,12,17 detect completion-at-14 at 17: lag 3 µs.</text><text x="30" y="492" class="body">Real polling costs and scheduling delays need measurement; the ideal interval is not a deadline.</text></svg>