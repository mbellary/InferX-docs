<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Resource rounding and an independent residency limit</title><desc id="desc">64 and 65 registers require four and three register-limited blocks. Shared memory limits both to two blocks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1000" height="480" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="40" font-size="28" fill="#0f172a">A register threshold changes one bound</text><text x="30" y="74" font-size="20" fill="#0f172a">Teaching model: 256 threads / block; 8 warps; 64 warps / SM</text><rect x="30" y="100" width="460" height="245" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="50" y="135" font-size="21" fill="#0f172a">64 reported registers / thread</text><text x="50" y="178" font-size="21" fill="#0f172a">16,384 allocated registers / block</text><text x="50" y="221" font-size="21" fill="#0f172a">Register bound: 4 blocks / SM</text><text x="50" y="264" font-size="21" fill="#0f172a">With no shared bytes: 50% occupancy</text><text x="50" y="310" font-size="18" fill="#0f172a">Round each warp to 256-register units</text><rect x="510" y="100" width="460" height="245" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="530" y="135" font-size="21" fill="#0f172a">65 reported registers / thread</text><text x="530" y="178" font-size="21" fill="#0f172a">18,432 allocated registers / block</text><text x="530" y="221" font-size="21" fill="#0f172a">Register bound: 3 blocks / SM</text><text x="530" y="264" font-size="21" fill="#0f172a">With no shared bytes: 37.5% occupancy</text><text x="530" y="310" font-size="18" fill="#0f172a">Round each warp to 256-register units</text><rect x="30" y="367" width="940" height="75" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="50" y="397" font-size="21" fill="#0f172a">Add 32 KiB shared memory / block → only 2 blocks fit in 64 KiB.</text><text x="50" y="426" font-size="20" fill="#0f172a">Both cases now have 25% occupancy. No elapsed time is predicted.</text></g></svg>