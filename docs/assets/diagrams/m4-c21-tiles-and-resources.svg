<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Tuning: position counts and resource constraints</title><desc id="desc">Conditional ledgers guide a hypothesis; compiled reports and timing test it</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Tuning: position counts and resource constraints</text><text x="30" y="76" class="sub">Conditional ledgers guide a hypothesis; compiled reports and timing test it</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">D = 129: valid width stays fixed</text><text x="48" y="168" class="body">T = 128: 2 chunks, 256 capacity, 127 extra</text><text x="48" y="195" class="body">T = 256: 1 chunk, 256 capacity, 127 extra</text><text x="48" y="222" class="body">T = 512: 1 chunk, 512 capacity, 383 extra</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Same operation across every chunk</text><text x="538" y="168" class="body">Global statistics over valid coordinates</text><text x="538" y="195" class="body">Padding excluded before reductions</text><text x="538" y="222" class="body">More threads do not imply less latency</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Hypothetical resource bounds</text><text x="48" y="343" class="body">A: 6 blocks × 4 warps = 24 warps</text><text x="48" y="370" class="body">B: 3 blocks × 8 warps = 24 warps</text><text x="48" y="397" class="body">C: 2 blocks × 4 warps = 8 warps</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Measure the actual crossover</text><text x="538" y="343" class="body">Registers / shared memory / granularity</text><text x="538" y="370" class="body">Spills, passes, waits and completed time</text><text x="538" y="397" class="body">Stages matter only for eligible pipelines</text><text x="30" y="465" class="body">A/B/C use stipulated limits and resource demands, not measured GPU allocations.</text><text x="30" y="492" class="body">A lower register limit can increase spills; occupancy alone is not the objective.</text></svg>