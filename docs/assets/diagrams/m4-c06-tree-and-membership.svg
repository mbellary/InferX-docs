<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Padded adjacent-pair sum tree</title><desc id="desc">Five data values and three zero identities produce partials two, two, five, zero, then four and five, then sum nine.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="26" font-weight="700">Five members; eight logical leaves; sum = 9</text><text x="30" y="82" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Padding contributes zero but does not change the original group size.</text><rect x="38" y="112" width="100" height="65" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="79" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">3</text><rect x="160" y="112" width="100" height="65" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="201" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">−1</text><rect x="282" y="112" width="100" height="65" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="323" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">4</text><rect x="404" y="112" width="100" height="65" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="445" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">−2</text><rect x="526" y="112" width="100" height="65" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="567" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">5</text><rect x="648" y="112" width="100" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="689" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">0</text><rect x="770" y="112" width="100" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="811" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">0</text><rect x="892" y="112" width="100" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="933" y="153" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">0</text><text x="30" y="563" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Gray leaves are padding; the original group still has five members.</text><path d="M88 177 L139.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M210 177 L159.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="99.0" y="245" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="140.0" y="282" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">2</text><path d="M332 177 L383.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M454 177 L403.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="343.0" y="245" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="384.0" y="282" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">2</text><path d="M576 177 L627.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M698 177 L647.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="587.0" y="245" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="628.0" y="282" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">5</text><path d="M820 177 L871.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M942 177 L891.0 242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="831.0" y="245" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="872.0" y="282" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">0</text><path d="M149.0 295 L261.0 362" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M393.0 295 L281.0 362" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="221.0" y="365" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="262.0" y="402" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">4</text><path d="M637.0 295 L749.0 362" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M881.0 295 L769.0 362" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="709.0" y="365" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="750.0" y="402" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">5</text><path d="M271.0 415 L505.0 482" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M759.0 415 L525.0 482" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="465.0" y="485" width="100" height="55" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="506.0" y="522" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">9</text><text x="30" y="592" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Seven additions; three combine levels. Depth is not elapsed GPU time.</text></svg>