<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Bounded admission and cancellation-aware retirement</title><desc id="desc">Two slots and one pending item bound admissions. Correct final completion and retired readers permit reuse. Cancellation retains pending leases; uncertain completion quarantines resources.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" stroke="#526d82" fill="none"/></marker></defs><rect width="1100" height="540" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">Bound admissions; keep publication separate from reclamation</text><rect x="30" y="100" width="240" height="80" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="128" font-size="19">Arrivals</text><text x="42" y="153" font-size="16">Free slot → admit</text><rect x="350" y="100" width="270" height="80" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="362" y="128" font-size="19">Pending queue: at most 1</text><text x="362" y="153" font-size="16">No free slot → queue</text><rect x="760" y="100" width="305" height="80" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="772" y="128" font-size="19">Two busy slots maximum</text><text x="772" y="153" font-size="16">Queue full → reject newest</text><path d="M270,140 L348,140" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M620,140 L758,140" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="250" width="300" height="85" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="42" y="278" font-size="19">Observed final completion</text><text x="42" y="303" font-size="16">Identity + all users retired</text><rect x="400" y="250" width="300" height="85" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="412" y="278" font-size="19">Cancelled, work pending</text><text x="412" y="303" font-size="16">Suppress output; retain lease</text><rect x="770" y="250" width="300" height="85" rx="8" fill="#f7d7d0" stroke="#8c9eb0"/><text x="782" y="278" font-size="19">Completion uncertain</text><text x="782" y="303" font-size="16">Quarantine; stop admissions</text><text x="30" y="390" font-size="21">A slot becomes free only after its actual pending users are finished.</text><text x="30" y="434" font-size="18">Queued expiry: no GPU work to drain. In-flight cancellation: track submitted work.</text><text x="30" y="475" font-size="19">A late error can be observed on another query; observation is not attribution.</text><text x="30" y="512" font-size="19">Neither a timeout nor a cleared error flag proves safe reuse.</text></g></svg>