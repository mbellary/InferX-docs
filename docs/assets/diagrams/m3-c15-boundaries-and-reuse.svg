<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Separate logical request models from memory-interface evidence</title><desc id="desc">A constructed 16 cubed GEMM has 8192 useful FLOPs. Read-once logical bytes are 3072, scalar requests 33792, tiled requests 5120. Registers, cache, DRAM and host links need separate traffic evidence.</desc><rect width="1100" height="560" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">One 16³ GEMM: useful work is fixed; byte ledgers differ</text><text x="30" y="78" font-size="18">Constructed models: binary32, α=1, β=0; useful core work = 8192 FLOPs</text><rect x="30" y="115" width="320" height="85" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="42" y="143" font-size="19">Read-once logical model</text><text x="42" y="169" font-size="16">A 1024 + B 1024 + C write 1024</text><rect x="390" y="115" width="320" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="402" y="143" font-size="19">Scalar request model</text><text x="402" y="169" font-size="16">33792 bytes; per-product loads</text><rect x="750" y="115" width="320" height="85" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="762" y="143" font-size="19">Tiled request model, T=8</text><text x="762" y="169" font-size="16">5120 bytes; panel reuse</text><text x="30" y="249" font-size="20">These are different request models, not three observed DRAM counters.</text><rect x="30" y="300" width="230" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="328" font-size="19">Compute / registers</text><text x="42" y="354" font-size="16">Operand instructions</text><rect x="310" y="300" width="230" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="322" y="328" font-size="19">L1 / shared</text><text x="322" y="354" font-size="16">Local requests and reuse</text><rect x="590" y="300" width="230" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="602" y="328" font-size="19">L2 cache</text><text x="602" y="354" font-size="16">Filtered lower-level traffic</text><rect x="870" y="300" width="230" height="85" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="882" y="328" font-size="19">DRAM</text><text x="882" y="354" font-size="16">Scoped reads/writes</text><path d="M260 342 L310 342" stroke="#526d82" stroke-width="2" fill="none"/><path d="M540 342 L590 342" stroke="#526d82" stroke-width="2" fill="none"/><path d="M820 342 L870 342" stroke="#526d82" stroke-width="2" fill="none"/><text x="30" y="440" font-size="20">Cache hits can satisfy an access without a new DRAM read.</text><text x="30" y="481" font-size="19">Host-device and network transfers have separate byte and time boundaries.</text><text x="30" y="527" font-size="19">Never sum all levels and rename the result as one interface’s bandwidth.</text></g></svg>