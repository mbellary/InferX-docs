<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="750" viewBox="0 0 1060 750" role="img" aria-labelledby="title desc"><title id="title">Contiguous growth policy payload accounting</title><desc id="desc">Three teaching policies append eight positions. Exact growth copies 3584 bytes, doubling 896, static zero. Peaks are 1920, 1536 and 1024 bytes assuming prompt old allocation release. These are calculated payloads, not timings.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="750" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Same valid prefix; different allocation histories</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Constructed fixture: 128 bytes/position; append through N = 8</text><rect x="30" y="120" width="1000" height="145" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="155" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Exact size</text><text x="50" y="193" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Capacities: 1 → 2 → 3 → 4 → 5 → 6 → 7 → 8</text><text x="50" y="231" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Old payload copied: 3,584 bytes; peak live payload: 1,920 bytes</text><rect x="30" y="285" width="1000" height="145" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="320" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Doubling</text><text x="50" y="358" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Capacities: 1 → 2 → 4 → 8</text><text x="50" y="396" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Old payload copied: 896 bytes; peak live payload: 1,536 bytes</text><rect x="30" y="450" width="1000" height="145" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="485" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Static maximum</text><text x="50" y="523" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Capacities: 8</text><text x="50" y="561" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Old payload copied: 0 bytes; peak live payload: 1,024 bytes</text><text x="30" y="637" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">All finish with 1,024 valid bytes; fresh writes are separate from copies.</text><text x="30" y="676" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Peaks assume old readers finish before the next growth.</text><text x="30" y="714" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">At N = 3: unused static capacity = (8 − 3) × 128 = 640 bytes.</text></svg>