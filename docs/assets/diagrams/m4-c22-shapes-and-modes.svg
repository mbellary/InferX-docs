<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A benchmark case is more than a batch size</title><desc id="desc">Shape, valid extent, stored format, layout and contract identify useful work</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">A benchmark case is more than a batch size</text><text x="30" y="76" class="sub">Shape, valid extent, stored format, layout and contract identify useful work</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Prefill normalization: B = 8, S = 128</text><text x="48" y="168" class="body">R = 1,024 rows; H = 896 features</text><text x="48" y="195" class="body">917,504 values; two-byte input = 1.75 MiB</text><text x="48" y="222" class="body">Not the same rows as one-token decode</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Next-token sampling: B = 8</text><text x="538" y="168" class="body">R = 8 rows; V = 151,936 scores</text><text x="538" y="195" class="body">FP32 input = 4.63671875 MiB</text><text x="538" y="222" class="body">Valid vocabulary differs from padded capacity</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Four execution arms</text><text x="48" y="343" class="body">Staged eager / Fused eager</text><text x="48" y="370" class="body">Staged graph / Fused graph</text><text x="48" y="397" class="body">One graph submit can launch many kernels</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Qualify extensions before timing</text><text x="538" y="343" class="body">FP32 / FP16 / BF16; contiguous / pitched</text><text x="538" y="370" class="body">Same current inputs, reference and draws</text><text x="538" y="397" class="body">Count adapters, fallback and retained state</text><text x="30" y="465" class="body">Pinned model metadata anchors dimensions; the LayerNorm study has its own contract.</text><text x="30" y="492" class="body">Separate operation fusion from submission mode and preserve unsupported populations.</text></svg>