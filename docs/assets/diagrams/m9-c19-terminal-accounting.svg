<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">Expected boundary corpus terminal and empty output accounting</title><desc id="desc">Twelve constructed attempts include one admission rejection and eleven admitted results. Eleven equals two EOS three length two stop and four error results. Three normal completions and three errors have empty visible output. Only case B0 selects no ID; twenty five IDs are committed in total. No runtime measurements are represented.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="690" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Boundary corpus: classify every attempt and empty result</text><rect x="30" y="80" width="1000" height="85" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="116" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">12 constructed attempts = 1 admission rejection + 11 admitted</text><text x="50" y="148" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">B11 rejects reservation 1 + 8 &gt; 8; it generates no result.</text><path d="M530,175 L530,205" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="215" width="1000" height="155" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="251" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">11 admitted = 2 EOS + 3 length + 2 stop + 4 error</text><text x="50" y="292" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">7 normal completions: 3 empty visible results</text><text x="50" y="331" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">4 errors: 3 empty visible results</text><text x="50" y="357" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Normal empty cases: B0, B1, B8. Empty errors: B5, B6, B7.</text><path d="M530,380 L530,410" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="420" width="1000" height="110" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="459" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">6 admitted results have no visible text; only B0 selects no ID</text><text x="50" y="499" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">25 committed IDs in total; hidden EOS / stop IDs still count.</text><rect x="30" y="560" width="1000" height="95" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="597" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">First-visible time is undefined for empty results, not zero</text><text x="50" y="635" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">These are expected fixtures, not observed reliability or latency rates.</text></svg>