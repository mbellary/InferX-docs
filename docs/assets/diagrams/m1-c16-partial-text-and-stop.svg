<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="730" viewBox="0 0 1060 730" role="img" aria-labelledby="title desc"><title id="title">Incremental UTF8 and withheld multi token stop in a scripted fixture</title><desc id="desc">Five scripted token IDs one two zero one two add bytes C3 A9 41 C3 A9. The first two complete an emitted é, while the last three complete hidden stop Aé. Empty updates retain state and do not lose tokens. Stop wins at cap five; at cap three the incomplete stop prefix A is flushed as ordinary text. Incomplete final UTF8 is an error.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="730" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Byte fixture: five selected IDs, one visible é, a hidden stop</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Pieces: ID 0 → 41 (A), ID 1 → C3, ID 2 → A9, ID 3 → EOS.</text><text x="30" y="120" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Stop Aé = 41 C3 A9. Prepared prompt bytes are not generated output.</text><rect x="30" y="155" width="1000" height="55" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="45" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Commit</text><text x="155" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">ID / bytes</text><text x="330" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">State</text><text x="755" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">New text</text><text x="895" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Joined</text><rect x="30" y="220" width="1000" height="54" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="45" y="255" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">1</text><text x="155" y="255" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">1 / C3</text><text x="330" y="255" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Incomplete é; hold</text><text x="755" y="255" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">empty</text><text x="895" y="255" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">empty</text><rect x="30" y="281" width="1000" height="54" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="45" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">2</text><text x="155" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">2 / A9</text><text x="330" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">é complete; release</text><text x="755" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">é</text><text x="895" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">é</text><rect x="30" y="342" width="1000" height="54" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="45" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">3</text><text x="155" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">0 / 41</text><text x="330" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Possible stop prefix A; hold</text><text x="755" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">empty</text><text x="895" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">é</text><rect x="30" y="403" width="1000" height="54" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="45" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">4</text><text x="155" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">1 / C3</text><text x="330" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Held 41 C3; incomplete</text><text x="755" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">empty</text><text x="895" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">é</text><rect x="30" y="464" width="1000" height="54" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="45" y="499" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">5</text><text x="155" y="499" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">2 / A9</text><text x="330" y="499" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Stop Aé complete; hide it</text><text x="755" y="499" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">empty</text><text x="895" y="499" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">é</text><rect x="30" y="555" width="1000" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="591" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">At G = 5: stop wins over the simultaneous cap; final text is é.</text><text x="50" y="630" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">At G = 3 after [1, 2, 0]: flush held A → éA, reason length.</text><text x="30" y="698" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Ending with incomplete C3 is an error under this strict policy; no replacement text is invented.</text></svg>