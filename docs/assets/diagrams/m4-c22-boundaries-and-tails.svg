<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Completed endpoints and tail populations</title><desc id="desc">Constructed timestamps and samples only — no measured kernel or service results</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Completed endpoints and tail populations</text><text x="30" y="76" class="sub">Constructed timestamps and samples only — no measured kernel or service results</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">One host clock, microseconds</text><text x="48" y="168" class="body">Dispatch 0 → enqueue return 2</text><text x="48" y="195" class="body">Observed device completion 14</text><text x="48" y="222" class="body">Readable result 18 → generator commit 21</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Device interval is a separate clock</text><text x="538" y="168" class="body">Ordered device events: duration 11 µs</text><text x="538" y="195" class="body">Host result interval: 18 µs</text><text x="538" y="222" class="body">Do not add overlapping spans or mix clocks</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Constructed sample: 200 invocations</text><text x="48" y="343" class="body">197 × 10 µs; 3 × 200 µs</text><text x="48" y="370" class="body">Median 10 µs; mean 12.85 µs</text><text x="48" y="397" class="body">Nearest-rank p99 = 200 µs</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Useful generation has more boundaries</text><text x="538" y="343" class="body">Server arrival → first selected-ID commit</text><text x="538" y="370" class="body">Generation gaps ≠ client delivery gaps</text><text x="538" y="397" class="body">Last content ≠ successful terminal status</text><text x="30" y="465" class="body">Amortized batch duration is not an individual-operation latency distribution.</text><text x="30" y="492" class="body">Keep sample counts, session dependence, failures, cancellations and unresolved work.</text></svg>