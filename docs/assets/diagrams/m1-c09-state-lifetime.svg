<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="575" viewBox="0 0 1060 575" role="img" aria-labelledby="title desc"><title id="title">Parameter sharing and activation lifetime</title><desc id="desc">A request performs lookup, projection and output consumption in sequence. A concurrent request shares fixed parameters but owns separate activations. Input activation cannot be reclaimed before projection readers finish.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="575" fill="#f8fafc"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Shared weights; request-owned activations</text><text x="30" y="74" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Logical ordering only: horizontal length is not measured time</text><rect x="30" y="105" width="1000" height="90" rx="12" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="140" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">E, W, a: one compatible version, shared read-only</text><text x="50" y="174" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Keep this version alive until every request using it has finished reading.</text><text x="30" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Request A</text><rect x="185" y="210" width="220" height="72" rx="12" fill="#dcfce7" stroke="#64748b"/><text x="203" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">IDs → lookup</text><text x="203" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#0f172a">X becomes ready</text><rect x="460" y="210" width="250" height="72" rx="12" fill="#dcfce7" stroke="#64748b"/><text x="478" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Projection reads X</text><text x="478" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#0f172a">Y becomes ready</text><rect x="765" y="210" width="265" height="72" rx="12" fill="#fef3c7" stroke="#64748b"/><text x="782" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Consumer reads Y</text><text x="782" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#0f172a">Then Y may retire</text><path d="M412,246 L449,246" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M717,246 L754,246" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="185" y="320" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#0f172a">X cannot retire before projection finishes reading it.</text><text x="30" y="395" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Request B</text><rect x="305" y="360" width="655" height="82" rx="12" fill="#f1e8ff" stroke="#64748b"/><text x="325" y="394" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Separate I / X / Y; same compatible E / W / a</text><text x="325" y="424" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Overlap increases live activation capacity, not parameter copies.</text><text x="30" y="495" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Cancellation ≠ reader completion. Retain live storage until completion is established.</text><text x="30" y="535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Worker loss: discard incomplete Y; rebuild request state from a compatible checkpoint.</text></svg>