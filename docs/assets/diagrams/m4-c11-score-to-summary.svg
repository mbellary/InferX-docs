<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc"><title id="title">Merge QK-derived attention summaries</title><desc id="desc">Scores zero and one are summarized then merged with score two. Rescale both denominator and weighted numerator to the new maximum before final division.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1000" height="545" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="40" font-size="28">Worked QK scores [0, 1, 2]: merge at maximum 2</text><rect x="30" y="80" width="450" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="50" y="114" font-size="23">Tile A: keys 0 and 1</text><text x="50" y="148" font-size="21">mA = 1; lA = 1 + exp(−1)</text><text x="50" y="184" font-size="21">uA = (2exp(−1), 2)</text><rect x="520" y="80" width="450" height="145" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="540" y="114" font-size="23">Tile B: key 2</text><text x="540" y="148" font-size="21">mB = 2; lB = 1</text><text x="540" y="184" font-size="21">uB = (1, 1)</text><text x="50" y="263" font-size="21">Rescale BOTH lA and uA by exp(−1)</text><text x="540" y="263" font-size="21">Scale lB and uB by 1</text><path d="M250 226 L250 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M250 274 L250 295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 226 L750 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 274 L750 295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="300" width="940" height="126" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="50" y="336" font-size="23">Common-scale denominator: l = 1 + exp(−1) + exp(−2)</text><text x="50" y="374" font-size="23">Weighted numerator: u = (1 + 2exp(−2), 1 + 2exp(−1))</text><text x="50" y="407" font-size="21">Only after all eligible keys: O = u / l</text><text x="30" y="469" font-size="22">O ≈ (0.845302, 1.154698). Keeping the old numerator unscaled is wrong.</text><text x="30" y="508" font-size="21">Real-arithmetic identity; actual floating-point paths need numerical gates.</text></g></svg>