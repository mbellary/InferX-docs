<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Logical position to physical pool slot</title><desc id="desc">Logical blocks zero one and two map to pool slots six one and four. Position nine maps to row one of slot four; its specified V coordinate is at pool byte offset 2280. Slot IDs name application storage, not DRAM page frames.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Sequence order is independent of pool placement</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Request R / attempt 1: N = 10; B = 4; table T = [6, 1, 4]</text><rect x="30" y="120" width="330" height="110" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="158" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Logical positions 0–3</text><text x="50" y="203" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Block j = 0</text><path d="M375,175 L470,175" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="485" y="120" width="545" height="110" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="505" y="158" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Physical pool slot 6</text><text x="505" y="203" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Base offset 3072 bytes</text><rect x="30" y="265" width="330" height="110" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="303" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Logical positions 4–7</text><text x="50" y="348" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Block j = 1</text><path d="M375,320 L470,320" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="485" y="265" width="545" height="110" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="505" y="303" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Physical pool slot 1</text><text x="505" y="348" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Base offset 512 bytes</text><rect x="30" y="410" width="330" height="110" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="448" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Logical positions 8–9</text><text x="50" y="493" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Block j = 2</text><path d="M375,465 L470,465" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="485" y="410" width="545" height="110" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="505" y="448" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Physical pool slot 4</text><text x="505" y="493" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Base offset 2048 bytes</text><text x="30" y="570" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Position 9: j = floor(9 / 4) = 2; r = 9 mod 4 = 1</text><text x="30" y="612" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">V / layer 1 / head 0 / feature 1: within-block offset = 232 bytes</text><text x="30" y="652" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Pool-relative element offset = 4 × 512 + 232 = 2,280 bytes</text><text x="30" y="694" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Read slots 6 → 1 → 4; slot IDs do not specify physical DRAM pages.</text></svg>