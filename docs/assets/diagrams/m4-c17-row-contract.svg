<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Two row contracts: center versus mean square"><rect width="1100" height="550" fill="#f5f7fb"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#526580"/></marker></defs><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Two row contracts: center versus mean square</text><rect x="270" y="82" width="560" height="56" rx="7" fill="#63758a"/><text x="550.0" y="117" text-anchor="middle" font-size="20" fill="white">Stored input → FP32; valid features k=0…D−1</text><path d="M400,138 L280,185" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M700,138 L820,185" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="190" width="450" height="56" rx="7" fill="#315bb5"/><text x="280.0" y="225" text-anchor="middle" font-size="20" fill="white">LayerNorm: mean μ, variance v</text><rect x="595" y="190" width="450" height="56" rx="7" fill="#087f83"/><text x="820.0" y="225" text-anchor="middle" font-size="20" fill="white">RMSNorm: mean square q</text><path d="M280,246 L280,280" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M820,246 L820,280" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="285" width="450" height="56" rx="7" fill="#315bb5"/><text x="280.0" y="320" text-anchor="middle" font-size="20" fill="white">γ × (x−μ) / sqrt(v+ε) + β</text><rect x="595" y="285" width="450" height="56" rx="7" fill="#087f83"/><text x="820.0" y="320" text-anchor="middle" font-size="20" fill="white">γ × x / sqrt(q+ε)</text><path d="M280,341 L400,389" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M820,341 L700,389" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="270" y="395" width="560" height="56" rx="7" fill="#7552a8"/><text x="550.0" y="430" text-anchor="middle" font-size="20" fill="white">Complete affine in FP32 → declared output cast</text><text x="28" y="505" font-size="18">Padding is excluded from statistics and D. Epsilon is inside the square root; affine is per feature.</text></g></svg>