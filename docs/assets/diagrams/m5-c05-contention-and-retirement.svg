<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Serialized demand and final-user lifetime are separate</title><desc id="desc">Independent constructed microsecond fixtures • no hardware benchmark</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Serialized demand and final-user lifetime are separate</text><text x="30" y="76" class="sub">Independent constructed microsecond fixtures • no hardware benchmark</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Five FIFO arrivals; 2-µs holds</text><text x="48" y="168" class="body">Waits: [0,2,4,6,8] µs</text><text x="48" y="195" class="body">Completions: [2,4,6,8,10] µs</text><text x="48" y="222" class="body">Mean wait = 4 µs; FIFO assumed</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="538" y="137" class="head">One slow holder amplifies waiting</text><text x="538" y="168" class="body">First hold 20 µs; next four hold 2</text><text x="538" y="195" class="body">Waits: [0,20,22,24,26] µs</text><text x="538" y="222" class="body">Mean wait = 18.4 µs</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="48" y="312" class="head">Cancellation at 3 is not retirement</text><text x="48" y="343" class="body">0: owner / device / reader = 1 / 1 / 1</text><text x="48" y="370" class="body">3: admission closed; last owner gone</text><text x="48" y="397" class="body">4: mappings detached; no publication</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Reuse only after every final access</text><text x="538" y="343" class="body">9: device done, host reader still live</text><text x="538" y="370" class="body">12: final host reader releases</text><text x="538" y="397" class="body">Zero claims + closed/detached → reusable</text><text x="30" y="465" class="body">Lock order prevents the stated lock cycle; it does not prove every form of progress.</text><text x="30" y="492" class="body">Unknown completion retains its claim; duplicate release cannot decrement it twice.</text></svg>