<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="title desc"><title id="title">Validity and eligibility before executable selection</title><desc id="desc">Invalid work rejects. Valid work uses an eligible ready fast variant, otherwise eligible ready generic, otherwise explicit unavailability. All launched work retains ownership until completion.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1000" height="665" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="39" font-size="28" fill="#0f172a">Dispatch uses the complete invocation contract</text><rect x="30" y="75" width="620" height="86" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="50" y="108" font-size="23" fill="#0f172a">Public input and ownership checks</text><text x="50" y="140" font-size="20" fill="#0f172a">Shape, dtype, values, extents, aliasing, context</text><rect x="730" y="75" width="240" height="86" rx="10" fill="#fee2e2" stroke="#94a3b8"/><text x="750" y="126" font-size="23" fill="#0f172a">Invalid → reject</text><path d="M650 119 L730 119" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="191" font-size="19" fill="#0f172a">valid</text><path d="M340 162 L340 214" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="219" width="620" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="50" y="253" font-size="23" fill="#0f172a">Eligible fast variant AND ready artifact?</text><text x="50" y="285" font-size="20" fill="#0f172a">Capacity, stride, alignment, resources, identity</text><rect x="730" y="219" width="240" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="750" y="254" font-size="22" fill="#0f172a">Yes → fast path</text><text x="750" y="286" font-size="20" fill="#0f172a">Retain handles</text><path d="M650 267 L730 267" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="343" font-size="19" fill="#0f172a">no</text><path d="M340 314 L340 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="370" width="620" height="95" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="50" y="404" font-size="23" fill="#0f172a">Eligible generic G AND ready artifact?</text><text x="50" y="436" font-size="20" fill="#0f172a">Same outputs, broader supported layout/length</text><rect x="730" y="370" width="240" height="95" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="750" y="407" font-size="23" fill="#0f172a">Yes → G</text><text x="750" y="437" font-size="20" fill="#0f172a">Retain handles</text><path d="M650 418 L730 418" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 466 L340 517" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="500" font-size="19" fill="#0f172a">no</text><rect x="30" y="522" width="620" height="62" rx="10" fill="#fee2e2" stroke="#94a3b8"/><text x="50" y="562" font-size="23" fill="#0f172a">Explicit unavailable / admission outcome</text><text x="30" y="624" font-size="21" fill="#0f172a">Keep descriptor, storage and executable ownership through covered completion.</text></g></svg>