<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Keep requested work separate from observed outcomes</title><desc id="desc">Eight-row constructed reference • token counts are not measured serving results</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Keep requested work separate from observed outcomes</text><text x="30" y="76" class="sub">Eight-row constructed reference • token counts are not measured serving results</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Immutable request bundle</text><text x="48" y="168" class="body">Prompt IDs / length; declared output cap</text><text x="48" y="195" class="body">Intended arrival; prefix / random identity</text><text x="48" y="222" class="body">Realized output is not known at arrival</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Eight successful reference labels</text><text x="538" y="168" class="body">Prompt total 1456; caps total 248</text><text x="538" y="195" class="body">Realized output total 124 tokens</text><text x="538" y="222" class="body">Means 182 / 31 / 15.5 tokens per request</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">The window defines the offered rate</text><text x="48" y="343" class="body">[0,100) ms: 8 / 0.1 = 80 requests/s</text><text x="48" y="370" class="body">[0,10) ms: 4 / 0.01 = 400 requests/s</text><text x="48" y="397" class="body">Seven gaps span 53 ms, not 100 ms</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Separate eight-received cutoff fixture</text><text x="538" y="343" class="body">1 rejected + 2 waiting + 1 nonterminal</text><text x="538" y="370" class="body">+ 2 successful + 1 failed + 1 cancelled</text><text x="538" y="397" class="body">Five admitted; final users tracked separately</text><text x="30" y="465" class="body">PFX membership is 3/8; sequential cold lookup reference has 2/8 candidate hits.</text><text x="30" y="492" class="body">Candidate reuse, actual hits and saved work require different evidence.</text></svg>