<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="735" viewBox="0 0 1060 735" role="img" aria-labelledby="title desc"><title id="title">Single request uncached generation loop and terminal transition</title><desc id="desc">A request is prepared once with identities and budget validation. Every active step forwards the whole prefix, selects and commits one ID, then checks EOS decoder stop and length. Only active work feeds back to another forward; terminal completion occurs once, and decoder finalization can instead produce an error.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="735" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">One request: full-prefix recomputation and a single terminal result</text><rect x="200" y="85" width="830" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="220" y="124" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Prepare once: IDs x, positions, model/decoder/policy identity</text><text x="220" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Validate P + G ≤ C; G = 0 ends without a forward.</text><rect x="200" y="235" width="830" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="220" y="275" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Forward the complete current prefix x + y; select one ID</text><text x="220" y="313" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">No KV cache; input length is P + g, positions start at 0.</text><path d="M615,195 L615,225" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="200" y="385" width="830" height="115" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="220" y="426" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Commit ID once, advance selection state and check termination</text><text x="220" y="462" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">EOS first; otherwise decode/match stop; otherwise check cap.</text><text x="220" y="490" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">Finalization may turn a proposed normal end into a decoding error.</text><path d="M615,345 L615,375" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="200" y="555" width="420" height="90" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="220" y="592" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Still active: next prefix</text><text x="220" y="628" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Retain request-owned state.</text><rect x="680" y="555" width="350" height="90" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="700" y="592" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Terminal exactly once</text><text x="700" y="628" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">No further forward/append.</text><path d="M410,510 L410,545" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M850,510 L850,545" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M190,600 L80,600 L80,285 L190,285" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="702" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Selected IDs, pending decoder bytes and visible text have different counts and lifetimes.</text></svg>