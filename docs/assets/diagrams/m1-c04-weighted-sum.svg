<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="title desc"><title id="title">Weighted sum and dot product</title><desc id="desc">Three corresponding feature products 8, minus 5 and minus 6 are summed to scalar minus 3.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#496a92"/></marker></defs><rect width="880" height="540" fill="white"/><text x="440" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b4d">A dot product combines matching feature contributions</text><text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Feature 0</text><rect x="35" y="100" width="230" height="70" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="150.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">2 × 4</text><path d="M150 170 V210" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="210" width="230" height="65" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="150.0" y="248.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Contribution: 8</text><text x="440" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Feature 1</text><rect x="325" y="100" width="230" height="70" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="440.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">−1 × 5</text><path d="M440 170 V210" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><rect x="325" y="210" width="230" height="65" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="440.0" y="248.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Contribution: −5</text><text x="730" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b4d">Feature 2</text><rect x="615" y="100" width="230" height="70" rx="10" fill="#e8f1ff" stroke="#496a92" stroke-width="2"/><text x="730.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">3 × (−2)</text><path d="M730 170 V210" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><rect x="615" y="210" width="230" height="65" rx="10" fill="#eef8f0" stroke="#496a92" stroke-width="2"/><text x="730.0" y="248.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Contribution: −6</text><path d="M150 275 V305 H440 V340" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M440 275 V340" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><path d="M730 275 V305 H440 V340" fill="none" stroke="#496a92" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="340" width="280" height="85" rx="10" fill="#ffdfa3" stroke="#496a92" stroke-width="2"/><text x="440.0" y="376.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">8 − 5 − 6 = −3</text><text x="440.0" y="401.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">One scalar result</text><text x="440" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Three paired products; two additions in a direct sum.</text><text x="440" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b4d">Weights need not be positive or sum to one.</text></svg>