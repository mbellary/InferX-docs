<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Count queries, sequences and context separately</title><desc id="desc">Constructed one-iteration candidates • no measured execution time</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Count queries, sequences and context separately</text><text x="30" y="76" class="sub">Constructed one-iteration candidates • no measured execution time</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Different caps answer different questions</text><text x="48" y="168" class="body">Live cap 6; executing sequences ≤4</text><text x="48" y="195" class="body">New query positions per forward ≤8</text><text x="48" y="222" class="body">Processed prefix c + q ≤4,096</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="538" y="137" class="head">Full candidate A/B/C/D fails</text><text x="538" y="168" class="body">Decode queries 1+1; prefills 6+4</text><text x="538" y="195" class="body">Four sequences fit; 12 queries exceed 8</text><text x="538" y="222" class="body">A/B/C: three sequences, eight queries</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="48" y="312" class="head">Context changes attention demand</text><text x="48" y="343" class="body">Pair proxy W(c,q) = qc + q(q+1)/2</text><text x="48" y="370" class="body">A/B/C: 5,141; A/B/D: 5,130 pairs</text><text x="48" y="397" class="body">These are not physical bytes or GPU time</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Equal R need not mean equal cost</text><text x="538" y="343" class="body">Fresh four-query prefill: 10 causal pairs</text><text x="538" y="370" class="body">Four long-context decodes: 16,384 pairs</text><text x="538" y="397" class="body">R=4 in both; different context and shape</text><text x="30" y="465" class="body">A query is a newly processed input position, not a cached token or useful output ID.</text><text x="30" y="492" class="body">The count gates are necessary; compatible execution, physical memory and service still matter.</text></svg>