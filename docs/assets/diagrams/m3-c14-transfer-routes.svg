<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Tensor routes with separately scoped bytes</title><desc id="desc">Same-GPU and peer copies differ from host-staged and remote staged routes. Remote staging adds two host-device legs plus one network payload. GPUDirect RDMA still needs registration and ordering.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" stroke="#526d82" fill="none"/></marker></defs><rect width="1100" height="600" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">Same useful tensor, different traffic and ownership boundaries</text><text x="30" y="90" font-size="18">Same GPU</text><rect x="230" y="65" width="240" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="242" y="99" font-size="18">Device source</text><rect x="700" y="65" width="310" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="712" y="99" font-size="18">Distinct device destination</text><path d="M470 92 L698 92" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="500" y="82" font-size="16">D2D: n useful</text><text x="30" y="180" font-size="18">Peer route</text><rect x="230" y="155" width="240" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="242" y="189" font-size="18">GPU A source</text><rect x="700" y="155" width="310" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="712" y="189" font-size="18">GPU B destination</text><path d="M470 182 L698 182" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="492" y="172" font-size="16">Supported peer: n</text><text x="30" y="270" font-size="18">Host staged</text><rect x="230" y="245" width="170" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="242" y="279" font-size="18">GPU A</text><rect x="515" y="245" width="180" height="55" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="527" y="279" font-size="18">Pinned host</text><rect x="860" y="245" width="180" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="872" y="279" font-size="18">GPU B</text><path d="M400 272 L513 272" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M695 272 L858 272" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="420" y="260" font-size="15">D2H n</text><text x="740" y="260" font-size="15">H2D n</text><text x="30" y="365" font-size="18">Remote staged</text><rect x="230" y="340" width="150" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="242" y="374" font-size="18">GPU A</text><rect x="425" y="340" width="150" height="55" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="437" y="374" font-size="18">Host A</text><rect x="730" y="340" width="150" height="55" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="742" y="374" font-size="18">Host B</text><rect x="925" y="340" width="150" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="937" y="374" font-size="18">GPU B</text><path d="M380 367 L423 367" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M575 367 L728 367" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M880 367 L923 367" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="600" y="355" font-size="16">Network n</text><text x="30" y="445" font-size="21">Supported GPUDirect RDMA: GPU A ↔ NIC A ↔ fabric ↔ NIC B ↔ GPU B</text><text x="30" y="491" font-size="18">No explicit CPU payload staging; registration and visibility handoffs still matter.</text><text x="30" y="535" font-size="19">Staged remote route: 2n host-device leg bytes + n network payload bytes.</text><text x="30" y="577" font-size="19">Different boundaries must not be summed and labelled as one wire throughput.</text></g></svg>