<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Follow dependencies to the chosen endpoint</title><desc id="desc">Constructed single-clock milliseconds; fixed work and sufficient resources for overlap</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Follow dependencies to the chosen endpoint</text><text x="30" y="76" class="sub">Constructed single-clock milliseconds; fixed work and sufficient resources for overlap</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Preparation → parallel work → publication</text><text x="48" y="168" class="body">8 ms → max(A, B) → 2 ms</text><text x="48" y="195" class="body">A = 40, B = 30: endpoint = 50 ms</text><text x="48" y="222" class="body">Summed spans = 80 ms, not elapsed time</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">The limiting branch can move</text><text x="538" y="168" class="body">Only B → 10: endpoint remains 50 ms</text><text x="538" y="195" class="body">Only A → 20: endpoint becomes 40 ms</text><text x="538" y="222" class="body">Both A = 20, B = 10: endpoint = 30 ms</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Baseline generator: four ordinary IDs</text><text x="48" y="343" class="body">Commits: 72, 88, 104, 120 ms</text><text x="48" y="370" class="body">TTFT = 72 ms; mean ITL = 16 ms</text><text x="48" y="397" class="body">Terminal = 125 ms; three decode forwards</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Which phase improved?</text><text x="538" y="343" class="body">Halve prefill: TTFT 40; terminal 93 ms</text><text x="538" y="370" class="body">Shorten gaps: TTFT 72; terminal 113 ms</text><text x="538" y="397" class="body">Output delivery needs its own endpoint</text><text x="30" y="465" class="body">A local speedup matters only through required work, readiness and available resources.</text><text x="30" y="492" class="body">Diagnostic traces explain dependencies; clean endpoint timing tests the service claim.</text></svg>