<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="730" viewBox="0 0 1060 730" role="img" aria-labelledby="title desc"><title id="title">Request and cache ownership of one immutable block</title><desc id="desc">Request A, request B and cache C each have one strong edge to slot two generation five. Request count two plus cache count one gives three strong owners of one 512 byte payload. In flight pins are separate lifetime obligations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="730" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Three owners; one sealed payload block</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Slot 2 / generation 5; Q = 512 bytes; 4 valid positions</text><rect x="30" y="125" width="350" height="95" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="180" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Request A edge</text><path d="M395,173 L540,320" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="270" width="350" height="95" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Request B edge</text><path d="M395,318 L540,320" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="415" width="350" height="95" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="470" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Cache C edge</text><path d="M395,463 L540,320" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="565" y="225" width="465" height="195" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="585" y="268" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Immutable completed K/V</text><text x="585" y="311" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#0f172a">r = 2; c = 1; n = 3</text><text x="585" y="354" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">One 512-byte payload</text><text x="585" y="395" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Mappings do not copy it.</text><rect x="30" y="555" width="1000" height="90" rx="10" fill="#f1f5f9" stroke="#64748b"/><text x="50" y="593" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">In-flight pins are tracked separately from strong owners.</text><text x="50" y="630" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Removing an owner does not finish its already admitted reader.</text><text x="30" y="689" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Count distinct blocks for payload; count edges and pins for lifetime obligations.</text></svg>