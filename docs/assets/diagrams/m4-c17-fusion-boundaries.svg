<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-label="Residual fusion: preserve rounding and every public output"><rect width="1100" height="590" fill="#f5f7fb"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#526580"/></marker></defs><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Residual fusion: preserve rounding and every public output</text><text x="28" y="90" font-size="21" font-weight="bold">Staged baseline</text><rect x="35" y="120" width="230" height="56" rx="7" fill="#63758a"/><text x="150.0" y="155" text-anchor="middle" font-size="20" fill="white">Read X and Z</text><rect x="315" y="120" width="350" height="56" rx="7" fill="#315bb5"/><text x="490.0" y="155" text-anchor="middle" font-size="20" fill="white">Add → Q_t → global U</text><rect x="715" y="120" width="350" height="56" rx="7" fill="#087f83"/><text x="890.0" y="155" text-anchor="middle" font-size="20" fill="white">Statistics + apply → Y</text><path d="M265,148 L307,148" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M665,148 L707,148" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="35" y="220" font-size="19">Three kernels; 6RDw activation bytes + affine + private-statistic traffic.</text><text x="28" y="295" font-size="21" font-weight="bold">Fused candidate, conditional on reviewed implementation</text><rect x="35" y="325" width="230" height="56" rx="7" fill="#63758a"/><text x="150.0" y="360" text-anchor="middle" font-size="20" fill="white">Read X and Z</text><rect x="315" y="325" width="350" height="56" rx="7" fill="#315bb5"/><text x="490.0" y="360" text-anchor="middle" font-size="20" fill="white">Add → Q_t → local U</text><rect x="715" y="325" width="350" height="56" rx="7" fill="#087f83"/><text x="890.0" y="360" text-anchor="middle" font-size="20" fill="white">Statistics + affine → Y</text><path d="M265,353 L307,353" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M665,353 L707,353" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M490,381 L490,421" stroke="#526580" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="315" y="426" width="350" height="56" rx="7" fill="#7552a8"/><text x="490.0" y="461" text-anchor="middle" font-size="20" fill="white">Store public U for later readers</text><text x="35" y="528" font-size="19">Private U: 3RDw activation bytes. Public U: 4RDw. Both keep the Q_t rounding boundary.</text><text x="35" y="563" font-size="17">Ideal logical payload; row rereads, spills, cache behavior, setup and readback are separate.</text></g></svg>