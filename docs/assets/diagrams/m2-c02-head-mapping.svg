<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title desc"><title id="title">Four query heads under MHA GQA and MQA</title><desc id="desc">MHA maps four queries to four distinct KV heads. GQA maps queries zero one to KV zero and two three to KV one. MQA maps all queries to KV zero. Each query head retains independent scores probabilities and outputs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="720" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Same four query heads; different numbers of distinct KV heads</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Contiguous equal groups; arrows indicate reads, not physical duplication.</text><rect x="30" y="115" width="310" height="430" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="48" y="155" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">MHA: Hkv = 4</text><text x="48" y="197" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Query heads</text><rect x="50" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="60" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">0</text><rect x="118" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="128" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">1</text><rect x="186" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="196" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">2</text><rect x="254" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="264" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">3</text><path d="M75,278 L75,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M143,278 L143,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M211,278 L211,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M279,278 L279,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="50" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="60" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">0</text><rect x="118" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="128" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">1</text><rect x="186" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="196" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">2</text><rect x="254" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="264" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">3</text><text x="48" y="477" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">KV heads (K and V)</text><text x="48" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Map: [0, 1, 2, 3]</text><rect x="375" y="115" width="310" height="430" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="393" y="155" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">GQA: Hkv = 2</text><text x="393" y="197" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Query heads</text><rect x="395" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="405" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">0</text><rect x="463" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="473" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">1</text><rect x="531" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="541" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">2</text><rect x="599" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="609" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">3</text><path d="M420,278 L453,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M488,278 L453,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M556,278 L605,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M624,278 L605,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="428" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="438" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">0</text><rect x="580" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="590" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">1</text><text x="393" y="477" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">KV heads (K and V)</text><text x="393" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Map: [0, 0, 1, 1]</text><rect x="720" y="115" width="310" height="430" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="738" y="155" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">MQA: Hkv = 1</text><text x="738" y="197" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Query heads</text><rect x="740" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="750" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">0</text><rect x="808" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="818" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">1</text><rect x="876" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="886" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">2</text><rect x="944" y="220" width="50" height="48" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="954" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">3</text><path d="M765,278 L875,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M833,278 L875,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M901,278 L875,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M969,278 L875,380" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="850" y="390" width="50" height="48" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="860" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">0</text><text x="738" y="477" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">KV heads (K and V)</text><text x="738" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Map: [0, 0, 0, 0]</text><rect x="30" y="585" width="1000" height="100" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="624" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Each query head keeps its own scores, softmax and output.</text><text x="50" y="664" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Sharing within a request does not authorize mutable cross-request sharing.</text></svg>