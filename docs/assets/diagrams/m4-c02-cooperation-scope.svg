<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Partial-block cooperation and synchronization scope</title><desc id="desc">Thirty-three valid positions occupy two warps, while all one-hundred-twenty-eight live block threads participate in the declared barrier protocol.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">N = 33 in a live 128-thread cooperative block</text><text x="30" y="78" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Logical group P = 128; only valid global accesses are allowed</text><rect x="40" y="120" width="300" height="140" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="58" y="156" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Warp 0: positions 0–31</text><text x="58" y="196" fill="#172b42" font-family="Arial, sans-serif" font-size="19">32 valid input publications</text><text x="58" y="232" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Position 31 needs peer 32.</text><rect x="375" y="120" width="300" height="140" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="393" y="156" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Warp 1: positions 32–63</text><text x="393" y="196" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Position 32 is valid.</text><text x="393" y="232" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Other slots publish zero.</text><rect x="710" y="120" width="290" height="140" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="728" y="156" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Warps 2 and 3</text><text x="728" y="196" fill="#172b42" font-family="Arial, sans-serif" font-size="19">No valid global data access</text><text x="728" y="232" fill="#172b42" font-family="Arial, sans-serif" font-size="19">All shared slots get zero.</text><path d="M190 260 L190 310" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M525 260 L525 310" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M855 260 L855 310" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="310" width="960" height="75" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="60" y="343" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Common block barrier: all 128 live threads participate in this protocol</text><text x="60" y="372" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Initialization and ordering precede shared-memory consumption.</text><rect x="40" y="425" width="960" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="60" y="460" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Valid consumers read the cyclic peer and write their own output.</text><text x="60" y="493" fill="#172b42" font-family="Arial, sans-serif" font-size="20">peer(31) = 32 crosses warps; peer(32) = 0 wraps the valid group.</text><text x="40" y="556" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Data-valid mask: 33 positions. Barrier participant set: all 128 live threads.</text><text x="40" y="599" fill="#172b42" font-family="Arial, sans-serif" font-size="19">A warp-only synchronization cannot establish this cross-warp publication edge.</text></svg>