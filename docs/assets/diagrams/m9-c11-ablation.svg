<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Constructed graph and prefix reuse ablation"><rect width="1100" height="600" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="28" y="40" font-size="25" font-weight="bold">Constructed four-cell comparison: graph savings depend on reuse</text><text x="300" y="96" font-size="21">Graph off</text><text x="720" y="96" font-size="21">Graph on</text><text x="28" y="185" font-size="21" font-weight="bold">Reuse off</text><rect x="225" y="125" width="350" height="130" rx="10" fill="#315bb5"/><text x="400" y="193" text-anchor="middle" font-size="37" fill="white">100 µs</text><text x="400" y="229" text-anchor="middle" font-size="17" fill="white">Completed equivalent request</text><rect x="645" y="125" width="350" height="130" rx="10" fill="#087f83"/><text x="820" y="193" text-anchor="middle" font-size="37" fill="white">80 µs</text><text x="820" y="229" text-anchor="middle" font-size="17" fill="white">Completed equivalent request</text><text x="28" y="370" font-size="21" font-weight="bold">Reuse on</text><rect x="225" y="310" width="350" height="130" rx="10" fill="#315bb5"/><text x="400" y="378" text-anchor="middle" font-size="37" fill="white">60 µs</text><text x="400" y="414" text-anchor="middle" font-size="17" fill="white">Completed equivalent request</text><rect x="645" y="310" width="350" height="130" rx="10" fill="#087f83"/><text x="820" y="378" text-anchor="middle" font-size="37" fill="white">55 µs</text><text x="820" y="414" text-anchor="middle" font-size="17" fill="white">Completed equivalent request</text><text x="28" y="493" font-size="21">Graph saving: 20 µs without reuse; 5 µs with reuse.</text><text x="28" y="533" font-size="21">Interaction: 55 − 80 − 60 + 100 = 15 µs. Combined saving: 45 µs.</text><text x="28" y="577" font-size="17">Stipulated teaching values, not model results. Every available cell still needs the same output contract.</text></g></svg>