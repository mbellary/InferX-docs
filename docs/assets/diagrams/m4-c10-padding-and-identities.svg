<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Virtual padding and physical copies</title><desc id="desc">Five valid positions and three invalid positions. Sum and maximum need different neutral values. Physical packing adds traffic and retained payload.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1000" height="510" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="39" font-size="28" fill="#0f172a">Logical width 5; execution width 8</text><text x="30" y="72" font-size="21" fill="#0f172a">Three extra positions are outside the row contract.</text><rect x="30" y="100" width="108" height="63" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="50" y="139" font-size="22" fill="#0f172a">x0</text><rect x="148" y="100" width="108" height="63" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="168" y="139" font-size="22" fill="#0f172a">x1</text><rect x="266" y="100" width="108" height="63" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="286" y="139" font-size="22" fill="#0f172a">x2</text><rect x="384" y="100" width="108" height="63" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="404" y="139" font-size="22" fill="#0f172a">x3</text><rect x="502" y="100" width="108" height="63" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="522" y="139" font-size="22" fill="#0f172a">x4</text><rect x="620" y="100" width="108" height="63" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="640" y="139" font-size="22" fill="#0f172a">invalid</text><rect x="738" y="100" width="108" height="63" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="758" y="139" font-size="22" fill="#0f172a">invalid</text><rect x="856" y="100" width="108" height="63" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="876" y="139" font-size="22" fill="#0f172a">invalid</text><rect x="30" y="195" width="940" height="89" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="50" y="228" font-size="22" fill="#0f172a">Virtual padding: valid loads only; no padded tensor allocation.</text><text x="50" y="262" font-size="21" fill="#0f172a">Sum → zero replacement. Maximum → negative-infinity replacement.</text><rect x="30" y="315" width="940" height="122" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="50" y="350" font-size="22" fill="#0f172a">Physical padding: original → packed image → reduction outputs</text><text x="50" y="385" font-size="21" fill="#0f172a">For 3 × 5 FP32 rows padded to 3 × 8:</text><text x="50" y="418" font-size="21" fill="#0f172a">276 logical global bytes; 180 retained payload bytes (stated mapping).</text><text x="30" y="474" font-size="21" fill="#0f172a">Mask stores too: publish 2 statistics / row, not padded positions.</text></g></svg>