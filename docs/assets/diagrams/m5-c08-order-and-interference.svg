<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Ordering redistributes delay across requests and tokens</title><desc id="desc">Separate reference fixtures • fixed toy demands • no measured performance claims</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Ordering redistributes delay across requests and tokens</text><text x="30" y="76" class="sub">Separate reference fixtures • fixed toy demands • no measured performance claims</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">Long and short jobs: FIFO at time 3</text><text x="48" y="168" class="body">L runs 3–15; S 15–16; T 16–17</text><text x="48" y="195" class="body">All three response times are 15 ms</text><text x="48" y="222" class="body">Measured-cohort service totals 14 ms</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Short jobs first: who gets worse?</text><text x="538" y="168" class="body">S runs 3–4; T 4–5; L 5–17</text><text x="538" y="195" class="body">Responses L/S/T = 17/3/3 ms</text><text x="538" y="222" class="body">Mean 23/3 ms; L regresses 2 ms</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Full prefill between decode iterations</text><text x="48" y="343" class="body">Decode commits 2,12,14 ms</text><text x="48" y="370" class="body">Consecutive gaps 10,2; mean 6 ms</text><text x="48" y="397" class="body">Prefill runs 2–10; cohort drains at 14</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Two equal prefill chunks</text><text x="538" y="343" class="body">Decode commits 2,8,14 ms</text><text x="538" y="370" class="body">Consecutive gaps 6,6; mean 6 ms</text><text x="538" y="397" class="body">Prefill done 12; cohort drains at 14</text><text x="30" y="465" class="body">Queue reordering cannot preempt work already executing or bypass missing resources.</text><text x="30" y="492" class="body">Equal mean decode gaps conceal different maxima: 10 ms versus 6 ms.</text></svg>