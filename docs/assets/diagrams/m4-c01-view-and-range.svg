<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Strided tensor view and exclusive byte range</title><desc id="desc">Six logical FP32 values occupy a pitched view in nine backing slots; the exclusive high end is 36 bytes.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">One 2 × 3 view inside a nine-element allocation</text><text x="30" y="76" fill="#172b42" font-family="Arial, sans-serif" font-size="19">FP32 · byte offset b = 4 · element strides (5, 1) · capacity L = 36 bytes</text><rect x="45" y="130" width="95" height="85" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="70" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22">gap</text><text x="55" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">0–3</text><text x="61" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 0</text><rect x="150" y="130" width="95" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="175" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">1</text><text x="160" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">4–7</text><text x="166" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 1</text><rect x="255" y="130" width="95" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="280" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">2</text><text x="265" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">8–11</text><text x="271" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 2</text><rect x="360" y="130" width="95" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="385" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">3</text><text x="370" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">12–15</text><text x="376" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 3</text><rect x="465" y="130" width="95" height="85" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="490" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22">gap</text><text x="475" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">16–19</text><text x="481" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 4</text><rect x="570" y="130" width="95" height="85" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="595" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22">gap</text><text x="580" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">20–23</text><text x="586" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 5</text><rect x="675" y="130" width="95" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="700" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">4</text><text x="685" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">24–27</text><text x="691" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 6</text><rect x="780" y="130" width="95" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="805" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">5</text><text x="790" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">28–31</text><text x="796" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 7</text><rect x="885" y="130" width="95" height="85" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="910" y="163" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">6</text><text x="895" y="197" fill="#172b42" font-family="Arial, sans-serif" font-size="17">32–35</text><text x="901" y="245" fill="#172b42" font-family="Arial, sans-serif" font-size="17">slot 8</text><text x="45" y="295" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Logical row 0: slots 1, 2, 3 → X = [1, 2, 3]</text><text x="45" y="336" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Logical row 1: slots 6, 7, 8 → X = [4, 5, 6]</text><text x="45" y="390" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Touched byte starts: 4, 8, 12, 24, 28, 32</text><text x="45" y="432" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Span = 4[(2−1)5 + (3−1)1 + 1] = 32 bytes</text><text x="45" y="474" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Exclusive end = b + span = 4 + 32 = 36 bytes</text><text x="45" y="523" fill="#172b42" font-family="Arial, sans-serif" font-size="19">A capacity of 35 fails: the last FP32 element needs bytes 32 through 35.</text><text x="45" y="566" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Gaps are backing storage, not extra logical inputs; they must remain unchanged.</text><text x="45" y="604" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Same logical matrix can use other strides; output values must still match the reference.</text></svg>