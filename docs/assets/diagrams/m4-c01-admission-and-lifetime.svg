<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Kernel admission and lifetime contract</title><desc id="desc">Admission checks precede submission; completion and validation precede publication, with retained ownership after cancellation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Admission and completion protect different parts of the contract</text><text x="30" y="76" fill="#172b42" font-family="Arial, sans-serif" font-size="20">A valid descriptor is not proof of completed or correct output.</text><rect x="40" y="115" width="285" height="140" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="58" y="151" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Admission gate</text><text x="58" y="190" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Shape / dtype / values / identity</text><text x="58" y="225" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Ranges / alias / launch limits</text><rect x="385" y="115" width="275" height="140" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="403" y="151" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Submitted work</text><text x="403" y="190" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Retain X, Y, Z and resources</text><text x="403" y="225" fill="#172b42" font-family="Arial, sans-serif" font-size="19">No early reuse or publication</text><rect x="720" y="115" width="280" height="140" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="738" y="151" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Completion observed</text><text x="738" y="190" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Readback / visibility</text><text x="738" y="225" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Reference and guard checks</text><path d="M325 185 L385 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M660 185 L720 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="305" width="285" height="95" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="58" y="343" fill="#172b42" font-family="Arial, sans-serif" font-size="20" font-weight="700">Invalid → reject, no submit</text><text x="58" y="378" fill="#172b42" font-family="Arial, sans-serif" font-size="16">Empty → success, no launch</text><rect x="385" y="305" width="275" height="95" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="403" y="343" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Cancelled / unresolved</text><text x="403" y="378" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Keep device-owned state</text><rect x="720" y="305" width="280" height="95" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="738" y="343" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Valid result → publish</text><text x="738" y="378" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Then retire required state</text><path d="M182 255 L182 305" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M522 255 L522 305" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M860 255 L860 305" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="455" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Read-only X/Y sharing is allowed; output/source overlap is rejected.</text><text x="40" y="501" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Host dispatch return does not establish that GPU readers have finished.</text><text x="40" y="545" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Cancellation can suppress publication without stopping the submitted kernel.</text><text x="40" y="590" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Reclaim after established completion or context retirement, not after a missing event.</text></svg>