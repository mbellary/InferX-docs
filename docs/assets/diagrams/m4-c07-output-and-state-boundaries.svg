<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Probability output and weighted-output storage boundaries</title><desc id="desc">Materialized probability path retains a one-thousand-twenty-eight-byte payload; online weighted path retains a forty-four-byte summary, under a specified traffic model with scores already supplied.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="42" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">The output interface determines the avoidable state</text><text x="30" y="85" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Constructed FP32 traffic model: N = 257, D = 8; scores already supplied.</text><rect x="35" y="130" width="460" height="310" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="171" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Materialized probabilities</text><text x="55" y="218" fill="#172b42" font-family="Arial, sans-serif" font-size="22">Three score scans</text><text x="55" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Write and reread 257 probabilities</text><text x="55" y="302" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Read values; emit 8 coordinates</text><text x="55" y="352" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Probability payload: 1028 B</text><text x="55" y="401" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Logical traffic: 13,396 B</text><rect x="545" y="130" width="460" height="310" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="565" y="171" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Online weighted output</text><text x="565" y="218" fill="#172b42" font-family="Arial, sans-serif" font-size="22">Read each score/value once</text><text x="565" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Retain m, l, u and valid count</text><text x="565" y="302" fill="#172b42" font-family="Arial, sans-serif" font-size="22">Emit 8 coordinates</text><text x="565" y="352" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Compact state: 44 B</text><text x="565" y="401" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Logical traffic: 9284 B</text><rect x="35" y="485" width="970" height="80" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="55" y="519" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Difference: 4112 logical bytes; performance still needs measurement.</text><text x="55" y="549" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Partial-state traffic, spills, metadata and actual DRAM bytes are separate.</text><text x="35" y="607" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Returning all 257 probabilities still requires producing that complete output.</text></svg>