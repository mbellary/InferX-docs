<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="705" viewBox="0 0 1060 705" role="img" aria-labelledby="title desc"><title id="title">Contract reference and evidence gate before an optimization claim</title><desc id="desc">A frozen contract specifies inputs results identities budgets and failures. Independent references and complementary invariant checks feed a correctness gate. Only then compare completed useful output performance while retaining failures and inconclusive findings.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="705" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#0f172a">Before a speed claim: freeze the contract and check evidence</text><rect x="30" y="85" width="1000" height="105" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="120" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Contract: valid inputs → required result + state + failure behavior</text><text x="50" y="160" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Name the interface, identities, numerical budgets and completion boundary.</text><path d="M530,195 L530,225" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="235" width="475" height="135" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="272" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Independent reference</text><text x="50" y="313" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Known answers + high precision</text><text x="50" y="348" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Shapes, identities and mathematics</text><rect x="535" y="235" width="495" height="135" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="555" y="272" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Complementary checks</text><text x="555" y="313" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Invariants + justified input relations</text><text x="555" y="348" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Deliberate defects must be detected</text><path d="M270,378 L270,415" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M780,378 L780,415" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="425" width="1000" height="100" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="463" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Gate: compare all required evidence before timing conclusions</text><text x="50" y="502" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Mismatch → reject equivalence; a changed contract needs a new evaluation.</text><path d="M530,535 L530,565" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="575" width="1000" height="100" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="613" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Then compare completed useful outputs under controlled workloads</text><text x="50" y="652" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Keep failures, regressions and inconclusive findings in the evidence record.</text></svg>