<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img">
<title>Different last-use boundaries in a constructed serialized trace</title>
<rect width="1100" height="540" fill="#f4f7fb"/>
<text x="30" y="38" font-family="sans-serif" font-size="25" fill="#152c49">Four buffers; four different last-use boundaries</text>
<text x="30" y="75" font-family="sans-serif" font-size="19" fill="#263d53">Constructed host-observation timeline in microseconds; no device measurement</text>
<line x1="250" y1="102" x2="250" y2="385" stroke="#d1dce8"/>
<text x="243" y="98" font-family="sans-serif" font-size="15" fill="#263d53">0</text>
<line x1="300" y1="102" x2="300" y2="385" stroke="#d1dce8"/>
<text x="293" y="98" font-family="sans-serif" font-size="15" fill="#263d53">2</text>
<line x1="450" y1="102" x2="450" y2="385" stroke="#d1dce8"/>
<text x="443" y="98" font-family="sans-serif" font-size="15" fill="#263d53">8</text>
<line x1="475" y1="102" x2="475" y2="385" stroke="#d1dce8"/>
<text x="468" y="98" font-family="sans-serif" font-size="15" fill="#263d53">9</text>
<line x1="625" y1="102" x2="625" y2="385" stroke="#d1dce8"/>
<text x="618" y="98" font-family="sans-serif" font-size="15" fill="#263d53">15</text>
<line x1="650" y1="102" x2="650" y2="385" stroke="#d1dce8"/>
<text x="643" y="98" font-family="sans-serif" font-size="15" fill="#263d53">16</text>
<line x1="825" y1="102" x2="825" y2="385" stroke="#d1dce8"/>
<text x="818" y="98" font-family="sans-serif" font-size="15" fill="#263d53">23</text>
<line x1="875" y1="102" x2="875" y2="385" stroke="#d1dce8"/>
<text x="868" y="98" font-family="sans-serif" font-size="15" fill="#263d53">25</text>
<text x="30" y="148" font-family="sans-serif" font-size="22" fill="#16496d">Hsrc</text>
<rect x="250" y="120" width="200" height="42" rx="6" fill="#cfe8e0" stroke="#7c9ab9"/>
<text x="460" y="148" font-family="sans-serif" font-size="17" fill="#263d53">safe after 8</text>
<text x="30" y="213" font-family="sans-serif" font-size="22" fill="#16496d">Dsrc</text>
<rect x="300" y="185" width="325" height="42" rx="6" fill="#cbdff4" stroke="#7c9ab9"/>
<text x="635" y="213" font-family="sans-serif" font-size="17" fill="#263d53">safe after 15</text>
<text x="30" y="278" font-family="sans-serif" font-size="22" fill="#16496d">Ddst</text>
<rect x="475" y="250" width="350" height="42" rx="6" fill="#ffe1ac" stroke="#7c9ab9"/>
<text x="835" y="278" font-family="sans-serif" font-size="17" fill="#263d53">safe after 23</text>
<text x="30" y="343" font-family="sans-serif" font-size="22" fill="#16496d">Hdst</text>
<rect x="650" y="315" width="225" height="42" rx="6" fill="#ded6f3" stroke="#7c9ab9"/>
<text x="885" y="343" font-family="sans-serif" font-size="17" fill="#263d53">safe after 25</text>
<text x="30" y="425" font-family="sans-serif" font-size="21" fill="#152c49">H2D 2–8 → transform 9–15 → D2H 16–23 → CPU consumer 24–25</text>
<text x="30" y="465" font-family="sans-serif" font-size="18" fill="#263d53">Bars cover required input/output uses and reservations; pool backing can remain allocated afterward.</text>
<text x="30" y="505" font-family="sans-serif" font-size="18" fill="#263d53">Submission returns at 3 and 17 do not establish final copy completion. Whole-slot reuse waits until 25.</text>
</svg>