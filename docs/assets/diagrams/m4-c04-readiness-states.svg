<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Compilation and readiness states</title><desc id="desc">Four cohorts distinguish absent artifact, disk hit, loaded module and exercised variant; a disk hit alone does not establish readiness.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="42" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">An artifact on disk is not yet a completed warm path</text><text x="30" y="85" fill="#172b42" font-family="Arial, sans-serif" font-size="21">State belongs to a layer, a variant and a lifetime.</text><rect x="35" y="130" width="450" height="170" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="53" y="168" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">S0: artifact absent</text><text x="53" y="217" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Translate the selected variant</text><text x="53" y="256" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Validate and retain its group</text><rect x="555" y="130" width="450" height="170" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="573" y="168" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">S1: persistent artifact</text><text x="573" y="217" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Fresh process finds the group</text><text x="573" y="256" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Context may still be absent</text><rect x="35" y="355" width="450" height="170" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="53" y="393" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">S2: module prepared</text><text x="53" y="442" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Context-local handle exists</text><text x="53" y="481" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Deferred work may remain</text><rect x="555" y="355" width="450" height="170" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="573" y="393" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">S3: exercised variant</text><text x="573" y="442" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Representative path completed</text><text x="573" y="481" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Dispatch and execution remain</text><path d="M487 215 L548 215" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M780 302 L780 330" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M780 330 L260 330" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M260 330 L260 350" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M487 440 L548 440" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="35" y="580" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Record disk, driver, process, context and device-state assumptions separately.</text></svg>