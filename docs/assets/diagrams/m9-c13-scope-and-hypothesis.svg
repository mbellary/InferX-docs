<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Metric scopes and a falsifiable resource hypothesis</title><desc id="desc">Normal execution, kernel profiles and useful service have different evidence scopes. A named metric observation leads to a hypothesis, an equivalent-work intervention and validation of resource changes and completed time. Cross-cohort counter and duration division is not directly observed bandwidth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Three evidence scopes answer different questions</text><rect x="30" y="105" width="320" height="100" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="42" y="134" font-size="19">Normal execution</text><text x="42" y="162" font-size="17">Correct outputs + completed times</text><rect x="390" y="105" width="320" height="100" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="402" y="134" font-size="19">Profiled kernel / range</text><text x="402" y="162" font-size="17">Compatible work, bytes and time</text><rect x="750" y="105" width="320" height="100" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="762" y="134" font-size="19">Useful service</text><text x="762" y="162" font-size="17">Arrivals, outcomes and latency</text><text x="30" y="255" font-size="20">Never divide one cohort’s byte counter by another cohort’s duration.</text><rect x="30" y="305" width="320" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="334" font-size="19">Named metric observation</text><text x="42" y="362" font-size="17">Scope, unit, denominator, policy</text><rect x="390" y="305" width="320" height="90" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="402" y="334" font-size="19">Testable resource hypothesis</text><text x="402" y="362" font-size="17">Preserve work; change one mechanism</text><rect x="750" y="305" width="320" height="90" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="762" y="334" font-size="19">Accept or revise explanation</text><text x="762" y="362" font-size="17">Check resource change and useful time</text><path d="M350 350 L385 350" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M710 350 L745 350" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="455" font-size="19">Retain invocation identity, dispatch coverage, replay passes and cache settings.</text><text x="30" y="500" font-size="19">Missing or denied metrics are unavailable evidence, never measured zeros.</text><text x="30" y="545" font-size="19">Constructed ledgers teach interpretation; no hardware profile is asserted.</text></g></svg>