<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Independent validation gates</title><desc id="desc">Semantic and layout checks, exact transfer bytes, numerical references and ownership all gate useful publication. A floating point tolerance cannot excuse identity, transfer or lifetime faults.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#526d82"/></marker></defs><rect width="1100" height="580" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="40" font-size="25">Correct output needs identity, bytes, arithmetic and ownership</text><rect x="30" y="105" width="490" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="134" font-size="19">1. Semantic / layout gate</text><text x="42" y="162" font-size="17">Shapes, strides, coefficients, request and generation</text><rect x="580" y="105" width="490" height="90" rx="8" fill="#cee8df" stroke="#8c9eb0"/><text x="592" y="134" font-size="19">2. Movement gate</text><text x="592" y="162" font-size="17">Exact bytes and offsets; conversions declared</text><path d="M520 150 L575 150" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="580" y="260" width="490" height="90" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="592" y="289" font-size="19">3. Numerical gate</text><text x="592" y="317" font-size="17">Independent reference + predeclared budget</text><rect x="30" y="260" width="490" height="90" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="42" y="289" font-size="19">4. Ownership gate</text><text x="42" y="317" font-size="17">Completed dependencies; readers retired</text><path d="M825 195 L825 255" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580 305 L525 305" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="410" font-size="22">All gates must pass before counting a result as useful.</text><text x="30" y="456" font-size="19">A tolerance cannot repair a wrong row, a stale epoch or a truncated transfer.</text><text x="30" y="501" font-size="19">A clean diagnostic run covers observed supported checks; it is not a proof.</text><text x="30" y="546" font-size="19">Preserve the first divergent stage and failed trial instead of widening the gate.</text></g></svg>