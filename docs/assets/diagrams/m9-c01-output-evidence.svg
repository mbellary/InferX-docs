<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="705" viewBox="0 0 1060 705" role="img" aria-labelledby="title desc"><title id="title">Same selected token can hide different distributions and small score errors can flip a near tie</title><desc id="desc">Blue reference probabilities and brown candidate probabilities both have maximum at ID zero but total variation about 0.308845. A separate near-tie example changes the selected ID with a maximum score error of two times ten to the minus eight. These are constructed examples, not sampling measurements.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="705" fill="#f8fafc"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">A selected token is a lossy observer of model behavior</text><text x="30" y="80" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Four vocabulary entries; reference and candidate both choose ID 0.</text><rect x="30" y="115" width="1000" height="295" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="153" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Different probabilities despite the same selected ID</text><text x="50" y="204" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">ID 0</text><rect x="130" y="185" width="450.7398" height="16" fill="#2563eb"/><rect x="130" y="206" width="244.80120000000002" height="16" fill="#b45309"/><text x="650" y="202" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Ref 0.643914</text><text x="825" y="202" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">B 0.349716</text><text x="50" y="255" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">ID 1</text><rect x="130" y="236" width="165.81810000000002" height="16" fill="#2563eb"/><rect x="130" y="257" width="221.5052" height="16" fill="#b45309"/><text x="650" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Ref 0.236883</text><text x="825" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">B 0.316436</text><text x="50" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">ID 2</text><rect x="130" y="287" width="61.0008" height="16" fill="#2563eb"/><rect x="130" y="308" width="221.5052" height="16" fill="#b45309"/><text x="650" y="304" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Ref 0.087144</text><text x="825" y="304" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">B 0.316436</text><text x="50" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#0f172a">ID 3</text><rect x="130" y="338" width="22.4413" height="16" fill="#2563eb"/><rect x="130" y="359" width="12.1877" height="16" fill="#b45309"/><text x="650" y="355" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Ref 0.032059</text><text x="825" y="355" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">B 0.017411</text><text x="50" y="443" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Blue: [2, 1, 0, −1]. Brown: [2, 1.9, 1.9, −1]. TV ≈ 0.308845.</text><rect x="30" y="480" width="1000" height="155" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="519" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Near tie: a small numerical error can change the decision</text><text x="50" y="563" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">[1, 0.99999999, 0, −1] → ID 0; [1, 1.00000001, 0, −1] → ID 1</text><text x="50" y="604" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#0f172a">Maximum score error: 2 × 10⁻⁸. Score and decision gates are separate.</text><text x="30" y="677" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#0f172a">Constructed arithmetic examples; bar lengths represent probabilities, not measured frequencies.</text></svg>