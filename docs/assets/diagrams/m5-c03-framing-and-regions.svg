<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Transport bytes and shared-region identity need explicit contracts</title><desc id="desc">Constructed schema and mapping fixtures • no IPC implementation</desc><rect width="1000" height="530" rx="16" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:25px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.body{font-size:18px}</style><text x="30" y="42" class="title">Transport bytes and shared-region identity need explicit contracts</text><text x="30" y="76" class="sub">Constructed schema and mapping fixtures • no IPC implementation</text><rect x="30" y="105" width="450" height="145" rx="10" fill="#dbeafe" stroke="#56738c"/><text x="48" y="137" class="head">One logical frame = 56 bytes</text><text x="48" y="168" class="body">Fixed header 40 + token payload 16</text><text x="48" y="195" class="body">Token count 3; IDs [10,11,12]</text><text x="48" y="222" class="body">Length / version / kind / identity checked</text><rect x="520" y="105" width="450" height="145" rx="10" fill="#dcfce7" stroke="#56738c"/><text x="538" y="137" class="head">Reads do not define stream messages</text><text x="538" y="168" class="body">Chunks [7,13,36] reconstruct one frame</text><text x="538" y="195" class="body">A 112-byte read may contain two frames</text><text x="538" y="222" class="body">Bound payload before allocation or dispatch</text><rect x="30" y="280" width="450" height="145" rx="10" fill="#fef3c7" stroke="#56738c"/><text x="48" y="312" class="head">Shared backing, distinct virtual bases</text><text x="48" y="343" class="body">Producer base 0x100000; peer 0x800000</text><text x="48" y="370" class="body">Offset 4096; extent 1024; region 16384</text><text x="48" y="397" class="body">Producer 0x101000; consumer 0x801000</text><rect x="520" y="280" width="450" height="145" rx="10" fill="#ede9fe" stroke="#56738c"/><text x="538" y="312" class="head">Bounds are necessary, not sufficient</text><text x="538" y="343" class="body">0 ≤ offset ≤ size; extent ≤ size − offset</text><text x="538" y="370" class="body">Offset 16000 / extent 512 rejects</text><text x="538" y="397" class="body">Readiness / epoch / generation / lease needed</text><text x="30" y="465" class="body">Rust thread channels are not process transports; foreign pointers are not region descriptors.</text><text x="30" y="492" class="body">Shared host mapping does not establish process-shared synchronization or GPU allocation sharing.</text></svg>