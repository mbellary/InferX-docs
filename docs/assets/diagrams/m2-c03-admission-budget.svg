<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="725" viewBox="0 0 1060 725" role="img" aria-labelledby="title desc"><title id="title">Whole-service budget and request admission bound</title><desc id="desc">A hypothetical twenty four GiB service deducts twelve GiB weights two workspace and two other and safety. Eight GiB remain. At five hundred twenty eight MiB per request fifteen fit and sixteen exceed the pool. Actual device capacity still requires measurement.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="725" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">A disjoint budget bounds full request commitments</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Hypothetical service budget: 24 GiB; k = 128 KiB per position</text><rect x="30" y="115" width="1000" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="154" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Fixed costs: weights 12 GiB + workspace 2 GiB + other/safety 2 GiB</text><text x="50" y="198" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Remaining request pool: 24 − 12 − 2 − 2 = 8 GiB = 8192 MiB</text><text x="50" y="229" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">All allowances are disjoint; this is not an observed device specification.</text><rect x="30" y="280" width="1000" height="125" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="321" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">4096-slot reservation: 512 MiB; additional request allowance: 16 MiB</text><text x="50" y="365" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#0f172a">Modeled cost per request: 528 MiB</text><text x="50" y="396" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Bmax = floor(8192 / 528) = 15 requests</text><rect x="30" y="445" width="475" height="140" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="485" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">15 requests fit</text><text x="50" y="529" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">15 × 528 = 7920 MiB</text><text x="50" y="568" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">272 MiB remains</text><rect x="535" y="445" width="495" height="140" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="555" y="485" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">16 requests do not fit</text><text x="555" y="529" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#0f172a">16 × 528 = 8448 MiB</text><text x="555" y="568" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">256 MiB beyond the pool</text><text x="30" y="645" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">A current short-request count does not fund all future context growth.</text><text x="30" y="686" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Actual allocator peaks and workspace dependence still require validation.</text></svg>