<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Producer, transport, visibility, consumer and acknowledgement milestones</title><desc id="desc">Source ready at 3, submit at 4, local completion at 8, receiver observes placement at 9, visibility handoff at 10, GPU consumer 11 to 14, consumption acknowledgement at 16. These are invented observations.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" stroke="#526d82" fill="none"/></marker></defs><rect width="1100" height="600" fill="#f4f7fc"/><g font-family="Arial, sans-serif" fill="#243b4c"><text x="30" y="38" font-size="25">Completion domains do not collapse into one ready flag</text><text x="30" y="76" font-size="18">Constructed common-clock observations; no transport or GPU measurement</text><text x="40" y="129" font-size="18">3 µs</text><rect x="190" y="105" width="660" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="202" y="139" font-size="18">Source producer ready</text><path d="M900 123 L900 170" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="184" font-size="18">4 µs</text><rect x="190" y="160" width="660" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="202" y="194" font-size="18">Submit network request</text><path d="M900 178 L900 225" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="239" font-size="18">8 µs</text><rect x="190" y="215" width="660" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="202" y="249" font-size="18">Local completion observed</text><path d="M900 233 L900 280" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="294" font-size="18">9 µs</text><rect x="190" y="270" width="660" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="202" y="304" font-size="18">Receiver observes placement</text><path d="M900 288 L900 335" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="349" font-size="18">10 µs</text><rect x="190" y="325" width="660" height="55" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="202" y="359" font-size="18">Visibility handoff established</text><path d="M900 343 L900 390" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="404" font-size="18">11–14 µs</text><rect x="190" y="380" width="660" height="55" rx="8" fill="#fce1a9" stroke="#8c9eb0"/><text x="202" y="414" font-size="18">GPU consumer executes</text><path d="M900 398 L900 445" stroke="#526d82" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="459" font-size="18">16 µs</text><rect x="190" y="435" width="660" height="55" rx="8" fill="#dceaf8" stroke="#8c9eb0"/><text x="202" y="469" font-size="18">Consumption ack at sender</text><text x="30" y="550" font-size="18">Local completion: source lifetime per contract. Destination: retain through consumer.</text><text x="30" y="582" font-size="18">Acknowledgement identity and meaning must match the tensor, epoch and generation.</text></g></svg>