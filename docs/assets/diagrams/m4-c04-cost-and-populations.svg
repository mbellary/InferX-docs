<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Preparation recovery and cold-call populations</title><desc id="desc">One-time preparation recovers after ten thousand uses; nearest-rank p99 changes sharply between one and two percent cold calls.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="42" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Constructed costs: recovery and population boundaries</text><rect x="35" y="95" width="970" height="180" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="132" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Extra preparation: 40 ms; warm saving: 4 µs per use</text><text x="55" y="178" fill="#172b42" font-family="Arial, sans-serif" font-size="22">10,000 uses × 4 µs = 40 ms: tie</text><text x="55" y="218" fill="#172b42" font-family="Arial, sans-serif" font-size="22">10,001 uses: first positive saving in this serial model</text><text x="55" y="252" fill="#172b42" font-family="Arial, sans-serif" font-size="19">No overlap, eviction or additional rebuilds assumed.</text><rect x="35" y="310" width="470" height="205" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="55" y="350" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">1% cold: 10 / 1000 calls</text><text x="55" y="397" fill="#172b42" font-family="Arial, sans-serif" font-size="21">990 warm calls at 8 µs</text><text x="55" y="441" fill="#172b42" font-family="Arial, sans-serif" font-size="21">10 cold calls at 40,008 µs</text><text x="55" y="486" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Mean 408 µs; p99 8 µs</text><rect x="535" y="310" width="470" height="205" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="555" y="350" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">2% cold: 20 / 1000 calls</text><text x="555" y="397" fill="#172b42" font-family="Arial, sans-serif" font-size="21">980 warm calls at 8 µs</text><text x="555" y="441" fill="#172b42" font-family="Arial, sans-serif" font-size="21">20 cold calls at 40,008 µs</text><text x="555" y="486" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Mean 808 µs; p99 40,008 µs</text><text x="35" y="566" fill="#172b42" font-family="Arial, sans-serif" font-size="20">p99 uses nearest rank over the complete supplied population.</text><text x="35" y="602" fill="#172b42" font-family="Arial, sans-serif" font-size="20">These arithmetic examples are not measured runtime results.</text></svg>