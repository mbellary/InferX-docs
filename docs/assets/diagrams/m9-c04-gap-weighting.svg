<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="705" viewBox="0 0 1060 705" role="img" aria-labelledby="title desc"><title id="title">Gap weighted versus request weighted means</title><desc id="desc">Request A has three gaps and mean 15; B has one gap and mean 100. Equal gap weight gives 36.25 milliseconds. Equal eligible request weight gives 57.5 milliseconds. Two other requests have no gaps and remain in coverage reporting.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="705" fill="#f8fafc"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Choose the unit that receives equal weight</text><rect x="30" y="85" width="1000" height="135" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="50" y="122" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Request A: 3 gaps → 10, 15, 20 ms → mean 15 ms</text><text x="50" y="166" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Request B: 1 gap → 100 ms → mean 100 ms</text><text x="50" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Requests C and D: no gaps; means unavailable, not zero.</text><rect x="30" y="255" width="1000" height="145" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="50" y="296" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Each gap has equal weight</text><text x="50" y="341" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#0f172a">(10 + 15 + 20 + 100) / 4 = 36.25 ms</text><text x="50" y="379" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Longer output sequences can contribute more observations.</text><rect x="30" y="435" width="1000" height="145" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="476" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Each eligible request has equal weight</text><text x="50" y="521" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#0f172a">(15 + 100) / 2 = 57.5 ms</text><text x="50" y="559" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Only the 2 requests with an observed gap enter this mean.</text><text x="30" y="628" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Keep all 4 requests in outcome and coverage accounting.</text><text x="30" y="669" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Never create a gap between different requests or across a missing ID.</text></svg>