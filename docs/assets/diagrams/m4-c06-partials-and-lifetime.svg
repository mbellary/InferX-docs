<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Cross-block partials and completion lifetime</title><desc id="desc">Eight partials require an ordered final consumer; scratch is retained until safe completion, with failure and cancellation preserving in-flight resources.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">N = 1000; P = 128; eight first-stage partials</text><rect x="35" y="100" width="970" height="90" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="135" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">First-stage ownership: 7 × 128 inputs + 104 final inputs</text><text x="55" y="171" fill="#172b42" font-family="Arial, sans-serif" font-size="20">24 identity positions pad the final chunk; no cross-block spin barrier.</text><path d="M520 192 L520 225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="230" width="970" height="90" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="55" y="265" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Ordered completion dependency before final consumption</text><text x="55" y="301" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Same stream, or explicit cross-stream dependency covering all partials.</text><path d="M520 322 L520 355" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="360" width="970" height="90" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="55" y="395" fill="#172b42" font-family="Arial, sans-serif" font-size="23" font-weight="700">Final reduction owns one result; consumes all eight partials</text><text x="55" y="431" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Scratch stays bound to this request / row / generation through last use.</text><path d="M520 452 L520 485" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="490" width="970" height="70" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="55" y="533" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Observed safe completion → publish result and permit resource retirement</text><text x="35" y="602" fill="#172b42" font-family="Arial, sans-serif" font-size="20">32 B scratch; 4068 B logical global traffic; 4036 B live value storage.</text></svg>