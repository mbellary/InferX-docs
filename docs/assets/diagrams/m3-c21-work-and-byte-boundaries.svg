<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">GEMV logical work and byte boundaries</title><desc id="desc">Weights and vector feed dot products, which write output; logical bytes and request costs have distinct scopes.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">One GEMV: distinguish logical data from measured traffic</text><text x="30" y="73" fill="#172b42" font-family="Arial, sans-serif" font-size="19">FP32 baseline: y = Ax, A is M × N; one measured operation at a time</text><rect x="40" y="110" width="260" height="145" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="60" y="145" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Weights A</text><text x="60" y="181" fill="#172b42" font-family="Arial, sans-serif" font-size="19">M × N values</text><text x="60" y="216" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Logical read: 4MN bytes</text><rect x="40" y="280" width="260" height="110" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="60" y="316" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Input x: N values</text><text x="60" y="356" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Logical read: 4N bytes</text><rect x="380" y="175" width="265" height="145" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="400" y="215" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">M dot products</text><text x="400" y="253" fill="#172b42" font-family="Arial, sans-serif" font-size="19">F = 2MN FLOPs</text><text x="400" y="289" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Conventional count</text><rect x="725" y="175" width="270" height="145" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="745" y="215" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Output y: M values</text><text x="745" y="253" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Write: 4M bytes</text><text x="745" y="289" fill="#172b42" font-family="Arial, sans-serif" font-size="19">β = 0: no old-y input</text><path d="M300 185 L380 220" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 333 L380 278" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M645 246 L725 246" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="438" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Q_min = 4MN + 4N + 4M: one-pass logical minimum, not a DRAM counter</text><text x="40" y="477" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Repeated input loads, caches, transactions and internal workspace can change actual traffic.</text><text x="40" y="520" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Operation interval: prepared device inputs → completed GEMV.</text><text x="40" y="555" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Request interval also includes required transfers, validation and publication.</text><text x="40" y="589" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Allocation and guard bytes belong in capacity accounting, not this logical numerator.</text></svg>