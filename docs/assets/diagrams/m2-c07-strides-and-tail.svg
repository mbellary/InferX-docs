<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="710" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc"><title id="title">Mapped attention rows and tensor strides</title><desc id="desc">Five positions use slot three and then row zero of slot one. The remaining three rows are invalid. With separate K and V allocations, coordinate position four feature one is at byte offset 72 in row major layout A and 96 in feature major layout B.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1060" height="710" fill="#f8fafc"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Mapped rows need the consumer’s stride contract</text><text x="30" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">One layer/head; d = 2; FP64; B = 4; N = 5; T = [3, 1]</text><rect x="30" y="120" width="1000" height="105" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="50" y="157" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Positions 0–3 → slot 3, rows 0–3</text><text x="50" y="201" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Four valid rows; logical order stays 0 → 1 → 2 → 3</text><rect x="30" y="255" width="1000" height="120" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="50" y="295" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Position 4 → slot 1, row 0</text><text x="50" y="337" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#0f172a">Row 0 valid; rows 1–3 are reserved and excluded</text><path d="M530,392 L530,425" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="445" width="485" height="135" rx="10" fill="#dcfce7" stroke="#64748b"/><rect x="545" y="445" width="485" height="135" rx="10" fill="#f1e8ff" stroke="#64748b"/><text x="50" y="481" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Layout A: (slot, row, feature)</text><text x="50" y="521" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Element strides: (8, 2, 1)</text><text x="50" y="559" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">p = 4, f = 1 → 72 bytes</text><text x="565" y="481" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Layout B: (slot, feature, row)</text><text x="565" y="521" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Element strides: (8, 4, 1)</text><text x="565" y="559" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">p = 4, f = 1 → 96 bytes</text><text x="30" y="627" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#0f172a">Offsets are relative to the appropriate separate K or V base.</text><text x="30" y="670" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#0f172a">Both addresses can be in bounds; mismatched strides still read wrong data.</text></svg>