<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" role="img" aria-labelledby="title desc"><title id="title">Rebuild recorded history; do not skip a missing causal block</title><desc id="desc">Separate eight-slot fixture; S = token IDs 1–12; B = 4; k = 128 bytes/position</desc><rect width="1060" height="740" fill="#f8fafc"/>
<text x="30" y="45" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#142033">Rebuild recorded history; do not skip a missing causal block</text>
<text x="30" y="86" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#142033">Separate eight-slot fixture; S = token IDs 1–12; B = 4; k = 128 bytes/position</text>
<rect x="30" y="115" width="1000" height="112" rx="12" fill="#dbeafe" stroke="#8492a6"/>
<text x="50" y="148" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Original retained state: logical blocks 0 and 2</text>
<text x="50" y="183" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Block 0: positions 0–3. Missing block 1: positions 4–7.</text>
<text x="50" y="212" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Block 2: positions 8–11 remains cache-owned, but lies beyond the gap.</text>
<rect x="30" y="250" width="1000" height="112" rx="12" fill="#fef3c7" stroke="#8492a6"/>
<text x="50" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Attach only the intact beginning prefix</text>
<text x="50" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Reuse block 0, then evaluate recorded positions 4–11 in order.</text>
<text x="50" y="347" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Preserve model, tokens, positions, masks, execution and namespace identity.</text>
<rect x="30" y="385" width="1000" height="112" rx="12" fill="#dcfce7" stroke="#8492a6"/>
<text x="50" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Prepare two private destination blocks</text>
<text x="50" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Eight rebuilt positions × 128 = 1,024 destination bytes.</text>
<text x="50" y="482" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Two old retained blocks + two destinations = four assigned blocks, 2,048 bytes.</text>
<rect x="30" y="520" width="1000" height="112" rx="12" fill="#ede9fe" stroke="#8492a6"/>
<text x="50" y="553" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#142033">Validate completion before publication</text>
<text x="50" y="588" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#142033">Compare exact labels; actual model checks require justified numerical budgets.</text>
<text x="50" y="617" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Failed or cancelled submitted work keeps lifetime protection until completion.</text>
<text x="30" y="700" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#142033">Projected byte counts are not device measurements; old unused retained state needs separate eviction.</text>
</svg>
