<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Separate performance evidence and useful-outcome gates</title><desc id="desc">Normal timing, system timeline and kernel counters retain separate scopes; improved mean can accompany worse p99 and deadlines.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Three evidence streams; one explicit useful-result contract</text><rect x="40" y="80" width="960" height="65" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="60" y="119" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Shared manifest: workload, identities, references, hardware state and tool settings</text><rect x="40" y="185" width="290" height="155" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="58" y="222" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Normal execution</text><text x="58" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Unprofiled request samples</text><text x="58" y="295" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Complete outcomes / latency</text><rect x="375" y="185" width="290" height="155" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="393" y="222" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">System timeline</text><text x="393" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Host / GPU dependencies</text><text x="393" y="295" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Correlation and coverage</text><rect x="710" y="185" width="290" height="155" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="728" y="222" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Kernel diagnosis</text><text x="728" y="260" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Bytes, readiness, residency</text><text x="728" y="295" fill="#172b42" font-family="Arial, sans-serif" font-size="19">Metric and replay scope</text><path d="M185 145 L185 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M520 145 L520 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M855 145 L855 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M185 340 L185 395" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M520 340 L520 395" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M855 340 L855 395" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="395" width="960" height="85" rx="8" fill="#e2e8f0" stroke="#8293a8"/><text x="60" y="429" fill="#172b42" font-family="Arial, sans-serif" font-size="21" font-weight="700">Gates: equivalent output → valid request boundary → tail / deadline / outcomes</text><text x="60" y="462" fill="#172b42" font-family="Arial, sans-serif" font-size="18">Counter runs do not replace normal timing; replays are not independent served requests.</text><text x="40" y="526" fill="#172b42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Synthetic cohorts: mean improves, deadline result worsens</text><text x="40" y="565" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Baseline: mean 113 µs · p99 200 µs · on-time 99/100</text><text x="40" y="603" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Candidate: mean 105.2 µs · p99 500 µs · on-time 98/100</text></svg>