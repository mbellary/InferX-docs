<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Fan-out retention versus recomputation</title><desc id="desc">Three valid two-output mappings trade materialized storage, duplicated producer work and a larger fused execution unit.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1040" height="620" fill="#f5f7fc"/><text x="30" y="40" fill="#172b42" font-family="Arial, sans-serif" font-size="25" font-weight="700">Fan-out contract: return both Z and U = 3A</text><text x="30" y="87" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Same read-only inputs and required outputs; different retention choices.</text><rect x="35" y="125" width="970" height="115" rx="8" fill="#dbeafe" stroke="#8293a8"/><text x="55" y="157" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Materialize A once; two consumers</text><text x="55" y="195" fill="#172b42" font-family="Arial, sans-serif" font-size="22">3 launches | 32N logical bytes | producer arithmetic: 2N</text><text x="55" y="227" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Retain A until both consumers finish; live value payload 24N B.</text><rect x="35" y="265" width="970" height="115" rx="8" fill="#fef3c7" stroke="#8293a8"/><text x="55" y="297" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Recompute A inside each consumer</text><text x="55" y="335" fill="#172b42" font-family="Arial, sans-serif" font-size="22">2 launches | 28N logical bytes | producer arithmetic: 4N</text><text x="55" y="367" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Repeated producer work is visible; live value payload 20N B.</text><rect x="35" y="405" width="970" height="115" rx="8" fill="#d1fae5" stroke="#8293a8"/><text x="55" y="437" fill="#172b42" font-family="Arial, sans-serif" font-size="24" font-weight="700">One combined two-output unit</text><text x="55" y="475" fill="#172b42" font-family="Arial, sans-serif" font-size="22">1 launch | 20N logical bytes | producer arithmetic: 2N</text><text x="55" y="507" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Larger combined execution/resource scope; live value payload 20N B.</text><text x="35" y="570" fill="#172b42" font-family="Arial, sans-serif" font-size="20">Producer counts only forming A: one multiplication and one addition per item.</text><text x="35" y="611" fill="#172b42" font-family="Arial, sans-serif" font-size="21">Fewer launches or bytes do not establish a timing winner; join both outputs.</text></svg>