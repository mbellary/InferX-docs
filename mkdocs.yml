site_name: InferX
site_description: Learning LLM inference and serving engines, from model semantics to production systems.
site_url: https://mbellary.github.io/InferX-docs/
repo_url: https://github.com/mbellary/InferX-docs
repo_name: mbellary/InferX-docs
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home:
      - Overview: index.md
      - Chapter outline inventory: chapter-outline-inventory.md
      - Detailed chapter authoring order: chapter-authoring-order.md
      - Chapter execution plan and progress: chapter-execution-plan.md
      - "Module 1: Reading order": module-1.md
      - "Module 2: Reading order": module-2.md
